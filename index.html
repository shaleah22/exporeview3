                           cls + '">' + v.exp + '</span> <span style="color:#38a169;">&middot;</span> <span class="tOut">' +
                           p.outer + '</span></span></sup> = ' + varHtml(v, cls, v.exp * p.outer)
            });
        });

        return list;
    }

    /* ---------------- Cues ---------------- */

    function setCue(activeFactor) {
        root.querySelectorAll('.factor').forEach(function (el) {
            var f = el.dataset.f;
            el.classList.remove('cued', 'dim');
            if (activeFactor === null) return;
            if (f === 'out' || f === String(activeFactor)) el.classList.add('cued');
            else el.classList.add('dim');
        });
    }

    /* ---------------- Arrows ---------------- */

    function svgEl(name, attrs) {
        var el = document.createElementNS('http://www.w3.org/2000/svg', name);
        for (var k in attrs) el.setAttribute(k, attrs[k]);
        return el;
    }

    function clearArrows() { arrowSvg.innerHTML = ''; }

    function arrowPathData(fromEl, toEl, hostRect, lane) {
        var f = fromEl.getBoundingClientRect();
        var t = toEl.getBoundingClientRect();
        var x1 = f.left + f.width / 2 - hostRect.left;
        var y1 = f.top - hostRect.top - 2;
        var x2 = t.left + t.width / 2 - hostRect.left;
        var y2 = t.top - hostRect.top - 6;
        var span = Math.abs(x1 - x2);
        var lift = Math.min(44 + span * 0.28 + lane * 10, 115);
        var cx = (x1 + x2) / 2;
        var cy = Math.min(y1, y2) - lift;
        return 'M ' + x1 + ' ' + y1 + ' Q ' + cx + ' ' + cy + ' ' + x2 + ' ' + y2;
    }

    function drawArrow(targetKey, lane, animate) {
        var host = arrowSvg.parentElement;
        var from = tgt(targetKey);
        var to = tgt('out');
        if (!from || !to) return 0;

        var d = arrowPathData(from, to, host.getBoundingClientRect(), lane);
        var path = svgEl('path', {
            d: d, fill: 'none', stroke: ARROW_COLOR,
            'stroke-width': '4', 'stroke-linecap': 'round',
            'data-target': targetKey, 'data-lane': lane
        });
        arrowSvg.appendChild(path);

        if (!animate) return 0;
        var len = path.getTotalLength();
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
        path.style.transition = 'stroke-dashoffset 0.65s ease-in-out';
        requestAnimationFrame(function () { path.style.strokeDashoffset = '0'; });
        return 650;
    }

    function redrawAllArrows() {
        var drawn = Array.prototype.slice.call(arrowSvg.querySelectorAll('path[data-target]'))
            .map(function (p) { return [p.dataset.target, Number(p.dataset.lane)]; });
        clearArrows();
        drawn.forEach(function (pair) { drawArrow(pair[0], pair[1], false); });
    }

    window.addEventListener('resize', function () {
        if (isVisible() && (phase === 'shortcut' || phase === 'done')) redrawAllArrows();
    });

    /* ---------------- Phases ---------------- */

    function startPreview() {
        phase = 'preview';
        setCue(null);
        stepCountEl.textContent = '';
        stepTitleEl.textContent = 'Here is the problem.';
        stepLineEl.innerHTML = '<span style="color:#718096; font-size:0.7em;">Getting ready&hellip;</span>';
        later(startSteps, 1700);
    }

    function startSteps() {
        if (phase !== 'preview') return;
        phase = 'steps';
        stepIndex = 0;
        renderStep();
    }

    function renderStep() {
        var step = steps[stepIndex];
        stepSolved = false;

        stepCountEl.textContent = 'Step ' + (stepIndex + 1) + ' of ' + steps.length;
        stepTitleEl.innerHTML = step.title;
        stepLineEl.innerHTML = step.lineHtml;
        hideReveal();

        feedback.textContent = '';
        feedback.className = 'feedback';
        hintEl.textContent = '';
        actionsEl.style.visibility = 'hidden';

        setCue(step.factorIndex);
        focusInput();
    }

    function hideReveal() {
        revealEl.classList.remove('showing');
        revealEl.innerHTML = '';
    }

    function addChip(html) {
        var chip = document.createElement('span');
        chip.className = 'chip';
        chip.innerHTML = html;
        stripEl.appendChild(chip);
    }

    function advanceFromStep() {
        stepIndex++;
        if (stepIndex >= steps.length) startShortcut();
        else renderStep();
    }

    function startShortcut() {
        phase = 'shortcut';
        clearTimers();
        setCue(null);
        clearArrows();

        stepCountEl.textContent = 'The shortcut';
        feedback.textContent = '';
        feedback.className = 'feedback';
        hintEl.textContent = '';
        stepTitleEl.innerHTML = 'The outer exponent reaches every factor inside. Multiply the exponents.';
        stepLineEl.innerHTML = '';
        hideReveal();

        root.querySelector('[data-final]').classList.add('showing');
        root.querySelectorAll('.ans-part').forEach(function (el) { el.classList.remove('shown'); });
        root.querySelector('[data-eq]').classList.remove('shown');

        later(function () {
            root.querySelector('[data-eq]').classList.add('shown');
            runArrow(0);
        }, 450);
    }

    function runArrow(i) {
        if (phase !== 'shortcut') return;
        if (i >= steps.length) { finishShortcut(); return; }

        var step = steps[i];
        setCue(step.factorIndex);
        stepLineEl.innerHTML = step.arrowLine;

        clearArrows();
        var dur = drawArrow(step.factorIndex, 0, true);
        later(function () {
            var part = ansPart(step.factorIndex);
            if (part) part.classList.add('shown');
            later(function () { runArrow(i + 1); }, 850);
        }, dur);
    }

    function showAllArrowsNow() {
        clearTimers();
        clearArrows();
        root.querySelector('[data-eq]').classList.add('shown');
        steps.forEach(function (s) {
            var part = ansPart(s.factorIndex);
            if (part) part.classList.add('shown');
        });
        var last = steps[steps.length - 1];
        drawArrow(last.factorIndex, 0, false);
        stepLineEl.innerHTML = steps.map(function (s) { return s.arrowLine; })
            .join('<span style="color:#a0aec0; padding:0 6px;">|</span>');
        finishShortcut();
    }

    function finishShortcut() {
        phase = 'done';
        setCue(null);
        feedback.textContent = 'Problem complete!';
        feedback.className = 'feedback correct';
        actionsEl.style.visibility = 'visible';
        nextBtn.focus();
    }

    /* ---------------- Checking ---------------- */

    const workEl     = root.querySelector('[data-work]');
    const checkBtn   = root.querySelector('[data-check]');
    const nextBtn    = root.querySelector('[data-next]');

    /* ===================== helpers ===================== */
    const TCLS = ['t1', 't2', 't3'];
    const DOT = ' <span class="op">&middot;</span> ';
    const VARS = ['c', 'g', 'h', 'p', 'q', 'r', 's', 't', 'u', 'v', 'w', 'z'];
    const STAGE_COLORS = [
        { main: '#b7791f', soft: '#fff3d1' },
        { main: '#2b6cb0', soft: '#e2eeff' },
        { main: '#2f855a', soft: '#ddf6e5' },
        { main: '#6b46c1', soft: '#efe2ff' }
    ];

    function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function coin(pr) { return Math.random() < (pr === undefined ? 0.5 : pr); }
    function pickVars(k) {
        const pool = VARS.slice(), out = [];
        for (let i = 0; i < k; i++) out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
        return out;
    }

    /* ===================== fractions ===================== */
    function gcd(a, b) { while (b) { const t = b; b = a % b; a = t; } return a || 1; }
    function fr(n, d) {
        d = (d === undefined) ? 1 : d;
        if (d < 0) { n = -n; d = -d; }
        const g = gcd(Math.abs(n), Math.abs(d));
        return { n: n / g, d: d / g };
    }
    function frMul(a, b) { return fr(a.n * b.n, a.d * b.d); }
    function frIsOne(f) { return f.n === 1 && f.d === 1; }
    function frIsNegOne(f) { return f.n === -1 && f.d === 1; }
    function frText(f) { return f.d === 1 ? String(f.n) : f.n + '/' + f.d; }
    function frHtml(f) {
        if (f.d === 1) return String(f.n).replace('-', '&minus;');
        return (f.n < 0 ? '&minus;' : '') +
            '<span class="frac"><span class="num">' + Math.abs(f.n) + '</span><span class="denom">' + f.d + '</span></span>';
    }

    /* ===================== problem structure ===================== */
    function mono(coefN, vars, coefD) {
        return { coef: fr(coefN, coefD || 1), vars: (vars || []).map(v => ({ name: v[0], exp: v[1] })) };
    }
    function buildProblem(factors, style, label) {
        const q = { kind: 'mono', factors: factors, style: style, label: label };
        q.varOrder = [];
        factors.forEach(f => f.vars.forEach(v => { if (q.varOrder.indexOf(v.name) === -1) q.varOrder.push(v.name); }));
        q.coefAnswer = factors.reduce((acc, f) => frMul(acc, f.coef), fr(1, 1));
        q.expAnswer = {};
        q.varOrder.forEach(name => {
            q.expAnswer[name] = factors.reduce((s, f) => {
                const v = f.vars.find(v => v.name === name);
                return s + (v ? v.exp : 0);
            }, 0);
        });
        q.answerText = answerText(q);
        return q;
    }
    function answerText(q) {
        const v = q.varOrder.filter(n => q.expAnswer[n] !== 0)
            .map(n => q.expAnswer[n] === 1 ? n : n + '^' + q.expAnswer[n]).join('');
        const c = q.coefAnswer;
        if (!v) return frText(c);
        if (frIsOne(c)) return v;
        if (frIsNegOne(c)) return '-' + v;
        return frText(c) + v;
    }
    function answerHtmlOf(q) {
        const v = q.varOrder.filter(n => q.expAnswer[n] !== 0)
            .map(n => n + expSup(q.expAnswer[n], false)).join('');
        const c = q.coefAnswer;
        if (!v) return frHtml(c);
        if (frIsOne(c)) return v;
        if (frIsNegOne(c)) return '&minus;' + v;
        return frHtml(c) + v;
    }

    /* ===================== display ===================== */
    function expSup(e, showOne) {
        if (e === 1 && !showOne) return '';
        return '<sup>' + (e < 0 ? '&minus;' : '') + Math.abs(e) + '</sup>';
    }
    function coefPieceText(f) {
        if (frIsNegOne(f.coef) && f.vars.length) return '&minus;';
        if (!frIsOne(f.coef) || f.vars.length === 0) return frHtml(f.coef);
        return '';
    }
    function problemHtml(q, focus) {
        const dim = !!focus;
        const wrap = (html, cls, hot) =>
            '<span class="piece ' + cls + (dim ? (hot ? ' hot' : ' cool') : '') + '">' + html + '</span>';
        const sep = q.style === 'dot' ? DOT : '';
        return q.factors.map((f, i) => {
            const cls = TCLS[i % TCLS.length];
            let inner = '';
            const ct = coefPieceText(f);
            if (ct) inner += wrap(ct, cls, focus && focus.kind === 'coef');
            f.vars.forEach(v => {
                inner += wrap(v.name + expSup(v.exp, false), cls,
                    focus && focus.kind === 'var' && focus.name === v.name);
            });
            if (!inner) inner = wrap('1', cls, false);
            const paren = (q.style === 'paren' && f.vars.length > 0) || (f.coef.n < 0 && i > 0);
            if (paren) {
                const pc = '<span class="' + cls + (dim ? ' piece cool' : '') + '">';
                inner = pc + '(</span>' + inner + pc + ')</span>';
            }
            return inner;
        }).join(sep);
    }
    function numericProblemHtml(dim) {
        const f1 = p.exp1 < 0 ? '(' + p.exp1 + ')' : p.exp1;
        const f2 = p.exp2 < 0 ? '(' + p.exp2 + ')' : p.exp2;
        const cls = dim ? ' piece hot' : ' piece';
        return '<span class="t1' + cls + '">' + p.base + '<sup>' + f1 + '</sup></span>' + DOT +
            '<span class="t2' + cls + '">' + p.base + '<sup>' + f2 + '</sup></span>';
    }

    /* ===================== generators ===================== */
    function genOneVar() {
        const v = pick(VARS);
        let c1 = rnd(2, 12), c2 = rnd(2, 12);
        if (coin(0.25)) c1 = -c1;
        if (coin(0.25)) c2 = -c2;
        let e1 = rnd(1, 4), e2 = rnd(2, 8);
        if (e1 + e2 > 11) e2 = 11 - e1;
        return buildProblem([mono(c1, [[v, e1]]), mono(c2, [[v, e2]])], coin() ? 'paren' : 'dot');
    }
    function genNegZero() {
        const r = Math.random(), v = pick(VARS);
        if (r < 0.3) {
            const ePos = rnd(3, 9), eNeg = -rnd(1, ePos - 1);
            const parts = coin() ? [[v, eNeg], [v, ePos]] : [[v, ePos], [v, eNeg]];
            return buildProblem([mono(1, [parts[0]]), mono(1, [parts[1]])], 'dot');
        }
        if (r < 0.55) {
            return buildProblem([mono(rnd(2, 9), [[v, -rnd(1, 3)]]), mono(rnd(2, 9), [[v, rnd(4, 9)]])], 'dot');
        }
        if (r < 0.78) {
            return buildProblem([mono(-1, [[v, 1]]), mono(rnd(2, 9), [[v, rnd(2, 5)]])], 'dot');
        }
        const two = pickVars(2);
        return buildProblem(
            [mono(1, [[two[0], rnd(3, 7)]]), mono(1, [[two[0], 1]]), mono(1, [[two[1], 0]])], 'plain');
    }
    function genTwoVar() {
        const two = pickVars(2), v1 = two[0], v2 = two[1];
        let c1 = rnd(2, 9), c2 = rnd(2, 9);
        if (coin(0.35)) c1 = -c1;
        if (coin(0.4)) c2 = -c2;
        const a1 = rnd(1, 5), a2 = rnd(1, 5);
        let b1, b2;
        if (coin(0.4)) { b1 = -rnd(1, 3); b2 = rnd(-b1 + 1, 9); }
        else { b1 = rnd(1, 4); b2 = rnd(1, 8); }
        return buildProblem([mono(c1, [[v1, a1], [v2, b1]]), mono(c2, [[v1, a2], [v2, b2]])],
            coin() ? 'paren' : 'dot');
    }
    function genThree() {
        const v = pick(VARS);
        const c = [rnd(2, 5), rnd(2, 5), rnd(2, 5)];
        c[rnd(0, 2)] *= -1;
        if (coin(0.4)) c[0] = 1;
        return buildProblem(
            [mono(c[0], [[v, rnd(1, 3)]]), mono(c[1], [[v, rnd(1, 4)]]), mono(c[2], [[v, rnd(1, 4)]])], 'paren');
    }
    function genFrac() {
        const two = pickVars(2), v1 = two[0], v2 = two[1];
        const d = pick([2, 3, 4, 5]);
        const big = d * rnd(2, 6) * (coin() ? -1 : 1);
        return buildProblem([
            mono(coin() ? -1 : 1, [], d),
            mono(1, [[v1, rnd(1, 3)], [v2, rnd(1, 3)]]),
            mono(big, [[v1, rnd(1, 4)], [v2, rnd(1, 3)]])
        ], 'paren');
    }
    function genNumeric() {
        const base = pick([2, 3, 4, 5, 6, 7]);
        const e1 = rnd(-3, 4), e2 = rnd(-3, 4);
        const q = {
            kind: 'numeric', style: 'dot', base: base, exp1: e1, exp2: e2,
            factors: [], varOrder: [], coefAnswer: fr(1, 1), expAnswer: {}
        };
        q.answerText = base + '^' + (e1 + e2);
        return q;
    }

    /* after the practice sheet: -2p⁷q⁵r · (-9p⁴q²r³), (mn)(8m²n)(-mn⁹),
       9p · 5p²q · q⁴, 16r · (5/4 q²r⁵) -- same shapes, fresh numbers */
    function genThreeLetters() {
        const [a, b, c] = pickVars(3);
        const c1 = rnd(2, 9) * (coin(0.5) ? -1 : 1), c2 = rnd(2, 9) * (coin(0.5) ? -1 : 1);
        const e = () => rnd(1, 7);
        const f1 = [[a, e()], [b, e()], [c, coin(0.4) ? 1 : e()]];
        const f2 = [[a, e()], [b, e()], [c, e()]];
        return buildProblem([mono(c1, f1), mono(c2, f2)], coin() ? 'paren' : 'dot');
    }
    function genThreeFactorsTwoLetters() {
        const [a, b] = pickVars(2);
        const shape = rnd(0, 2);
        if (shape === 0) {           // (mn)(8m²n)(-mn⁹)
            return buildProblem([mono(1, [[a, 1], [b, 1]]), mono(rnd(2, 9), [[a, rnd(2, 5)], [b, 1]]),
                                 mono(-1, [[a, 1], [b, rnd(2, 9)]])], 'paren');
        }
        if (shape === 1) {           // -4c³d · cd · 7c⁴d²
            return buildProblem([mono(-rnd(2, 6), [[a, rnd(2, 5)], [b, 1]]), mono(1, [[a, 1], [b, 1]]),
                                 mono(rnd(2, 8), [[a, rnd(2, 5)], [b, rnd(2, 4)]])], 'dot');
        }
        return buildProblem([mono(rnd(2, 9), [[a, 1]]), mono(rnd(2, 7), [[a, rnd(2, 4)], [b, 1]]),   // 9p · 5p²q · q⁴
                             mono(1, [[b, rnd(2, 6)]])], 'dot');
    }
    function genFracTimesWhole() {
        const [a, b] = pickVars(2);
        const d = pick([2, 3, 4, 5]);
        let n; do { n = rnd(1, 9); } while (gcd(n, d) !== 1 || n === d);
        const whole = d * rnd(2, 6) * (coin(0.3) ? -1 : 1);
        const w = mono(whole, [[b, rnd(1, 3)]]), f = mono(n, [[a, rnd(1, 4)], [b, rnd(1, 6)]], d);
        return buildProblem(coin(0.6) ? [w, f] : [f, w], 'dot');
    }

    const POOL = [genOneVar, genOneVar, genNegZero, genTwoVar, genTwoVar, genThree, genFrac,
                  genThreeLetters, genThreeFactorsTwoLetters, genFracTimesWhole];
    if (opts.includeNumeric !== false) POOL.push(genNumeric);

    /* ===================== state ===================== */
    let localCount = 0;
    let p = null;
    let stages = [];
    let stageIndex = 0;
    let solved = false;
    let previewTimer = null;

    function nextNumber() { return opts.number ? opts.number() : ++localCount; }
    function isVisible() {
        if (root.classList.contains('hidden')) return false;
        const panel = root.closest('.panel');
        return !panel || panel.classList.contains('is-active');
    }
    function advance() { if (opts.onNext) opts.onNext(); else loadNewProblem(); }

    function signature(q) {
        if (q.kind === 'numeric') return 'n' + q.base + ':' + [q.exp1, q.exp2].sort((a, b) => a - b).join(',');
        return q.factors
            .map(f => frText(f.coef) + '[' + f.vars.map(v => v.name + '^' + v.exp).join(',') + ']')
            .sort().join(';');
    }

    // the problems on the Canvas quiz, so the drill never repeats one exactly
    const BANNED = new Set([
        buildProblem([mono(4, [['x', 2]]), mono(10, [['x', 9]])], 'paren'),
        buildProblem([mono(4, [['x', 3]]), mono(3, [['x', 2]])], 'dot'),
        buildProblem([mono(1, [['a', -2]]), mono(1, [['a', 8]])], 'dot'),
        buildProblem([mono(1, [['b', 3]]), mono(1, [['b', -2]])], 'dot'),
        buildProblem([mono(1, [['m', -2]]), mono(1, [['m', 5]])], 'dot'),
        buildProblem([mono(-1, [['y', 1]]), mono(9, [['y', 3]])], 'dot'),
        buildProblem([mono(3, [['j', 4], ['k', -2]]), mono(7, [['j', 5], ['k', 9]])], 'dot'),
        buildProblem([mono(5, [['m', 4], ['n', -2]]), mono(-9, [['m', 3], ['n', 8]])], 'dot'),
        buildProblem([mono(1, [['m', 5]]), mono(1, [['n', 1]]), mono(1, [['m', 4]])], 'dot'),
        buildProblem([mono(1, [['d', 6]]), mono(1, [['d', 1]]), mono(1, [['f', 0]])], 'plain'),
        buildProblem([mono(3, [['x', 1]]), mono(4, [['x', 4]]), mono(-2, [['x', 3]])], 'paren'),
        buildProblem([mono(-2, [['a', 5], ['b', 3]]), mono(-3, [['a', 4], ['b', 2]])], 'paren'),
        buildProblem([mono(-1, [], 2), mono(1, [['x', 1], ['y', 3]]), mono(-20, [['x', 3], ['y', 1]])], 'paren'),
        // the practice sheet the review was modelled on
        buildProblem([mono(8, [['k', 3]]), mono(-8, [['k', 4]])], 'paren'),
        buildProblem([mono(-7, [['x', 5]]), mono(9, [['x', 5]])], 'paren'),
        buildProblem([mono(-6, [['a', 1], ['b', 2]]), mono(4, [['a', 3], ['b', 6]])], 'paren'),
        buildProblem([mono(-2, [['p', 7], ['q', 5], ['r', 1]]), mono(-9, [['p', 4], ['q', 2], ['r', 3]])], 'dot'),
        buildProblem([mono(6, [['x', 5], ['y', 8]]), mono(-7, [['x', 2], ['y', 4]])], 'paren'),
        buildProblem([mono(5, [['y', 1]]), mono(-3, [['y', 4]]), mono(4, [['y', 7]])], 'dot'),
        buildProblem([mono(1, [['m', 1], ['n', 1]]), mono(8, [['m', 2], ['n', 1]]), mono(-1, [['m', 1], ['n', 9]])], 'paren'),
        buildProblem([mono(-4, [['c', 3], ['d', 1]]), mono(1, [['c', 1], ['d', 1]]), mono(7, [['c', 4], ['d', 2]])], 'dot'),
        buildProblem([mono(9, [['p', 1]]), mono(5, [['p', 2], ['q', 1]]), mono(1, [['q', 4]])], 'dot'),
        buildProblem([mono(4, [['x', 5], ['y', 1]]), mono(12, [['x', 3], ['y', 8]])], 'paren'),
        buildProblem([mono(-24, [['x', 2], ['y', 1]]), mono(1, [['x', 1], ['y', 1]], 3)], 'dot'),
        buildProblem([mono(16, [['r', 1]]), mono(5, [['q', 2], ['r', 5]], 4)], 'dot')
    ].map(signature).concat(['n5:1,2', 'n3:-3,2', 'n3:-2,3', 'n2:1,4', 'n2:-3,3', 'n2:2,2']));

    function generateProblem() {
        let q, tries = 0;
        do { q = pick(POOL)(); } while (BANNED.has(signature(q)) && ++tries < 40);
        return q;
    }

    /* ===================== stages ===================== */
    function varEntries(name) {
        const out = [];
        p.factors.forEach((f, i) => {
            const v = f.vars.find(v => v.name === name);
            if (v) out.push({ exp: v.exp, cls: TCLS[i % TCLS.length] });
        });
        return out;
    }
    function hasCoefficients() { return p.factors.some(f => !frIsOne(f.coef)); }

    function buildStages() {
        const list = [];
        if (p.kind === 'numeric') {
            list.push({
                kind: 'exp', name: String(p.base), key: String(p.base),
                entries: [{ exp: p.exp1, cls: 't1' }, { exp: p.exp2, cls: 't2' }],
                answer: String(p.exp1 + p.exp2)
            });
            return list;
        }
        if (hasCoefficients()) {
            list.push({ kind: 'coef', key: 'coef', answer: frText(p.coefAnswer) });
        }
        p.varOrder.forEach(name => {
            list.push({
                kind: 'exp', name: name, key: name, entries: varEntries(name),
                answer: String(p.expAnswer[name])
            });
        });
        return list;
    }

    /* ===================== the work lines ===================== */
    function coefParts() {
        return p.factors.map((f, i) => '<span class="' + TCLS[i % TCLS.length] + '">' + frHtml(f.coef) + '</span>');
    }
    function varParts(name, entries) {
        return entries.map(e => '<span class="' + e.cls + '">' + name + expSup(e.exp, true) + '</span>');
    }
    function expandVarHtml(name, entries) {
        const num = [], den = [];
        entries.forEach(e => {
            for (let i = 0; i < Math.abs(e.exp); i++) (e.exp > 0 ? num : den).push(e.cls);
        });
        const cancel = Math.min(num.length, den.length);
        const one = (cls, struck) => '<span class="' + cls + (struck ? ' cross-out' : '') + '">' + name + '</span>';
        const numParts = num.map((c, i) => one(c, i < cancel));
        const denParts = den.map((c, i) => one(c, i < cancel));
        if (!numParts.length && !denParts.length) return '1';
        if (!denParts.length) return numParts.join(DOT);
        const top = numParts.length ? ['1'].concat(numParts).join(DOT) : '1';
        return '<span class="frac"><span class="num">' + top + '</span><span class="denom">' + denParts.join(DOT) + '</span></span>';
    }

    function expandOrPower(name, entries) {
        const total = entries.reduce((a, e) => a + Math.abs(e.exp), 0);
        return (total > 0 && total <= 14)
            ? expandVarHtml(name, entries)
            : varParts(name, entries).join(DOT);
    }

    function rewriteHtml(activeKey) {
        const groups = [];
        if (p.kind === 'numeric') {
            const entries = [{ exp: p.exp1, cls: 't1' }, { exp: p.exp2, cls: 't2' }];
            groups.push({ key: String(p.base), html: expandOrPower(String(p.base), entries) });
        } else {
            if (hasCoefficients()) groups.push({ key: 'coef', html: coefParts().join(DOT) });
            p.varOrder.forEach(name => {
                groups.push({ key: name, html: expandOrPower(name, varEntries(name)) });
            });
        }
        return groups.map(g =>
            '<span class="group' + (g.key === activeKey ? ' on' : '') + '">' + g.html + '</span>'
        ).join(DOT);
    }

    function doneLine(s) {
        if (s.kind === 'coef') {
            return coefParts().join(DOT) + ' = <span class="result">' + frHtml(p.coefAnswer) + '</span>';
        }
        const total = parseInt(s.answer, 10);
        const left = varParts(s.name, s.entries).join(DOT);
        const sum = s.entries.map(e =>
            '<span class="' + e.cls + '">' + (e.exp < 0 ? '(&minus;' + Math.abs(e.exp) + ')' : e.exp) + '</span>')
            .join(' <span class="plus">+</span> ');
        const middle = s.entries.length > 1 ? ' = ' + s.name + '<sup><span class="exp-sum">' + sum + '</span></sup>' : '';
        const right = total === 0
            ? '<span class="result">1</span>'
            : '<span class="result">' + s.name + expSup(total, false) + '</span>';
        const zeroNote = total === 0
            ? (p.kind === 'numeric'
                ? ' <span class="note">zero power, so it is 1</span>'
                : ' <span class="note">zero power, so it drops out</span>')
            : '';
        return left + middle + ' = ' + right + zeroNote;
    }

    function valueTag() {
        const exp = p.exp1 + p.exp2;
        const inner = exp === 0 ? '1' : valueHtml(p.base, exp);
        return '<span class="value-tag">' +
                   '<span class="vlabel">Value<svg class="varrow" viewBox="0 0 10 16" aria-hidden="true"><path class="vshaft" d="M5 1 V9"/><path class="vhead" d="M1.4 8 L5 14.5 L8.6 8 Z"/></svg></span>' +
                   '<span class="vnum">' + inner + '</span>' +
               '</span>';
    }

    function renderWork() {
        let html = '';
        if (stageIndex >= -1) {
            const activeKey = (stageIndex >= 0 && stages[stageIndex]) ? stages[stageIndex].key : null;
            let rw = rewriteHtml(activeKey);
            const showValue = solved && p.kind === 'numeric';
            if (showValue) rw += ' = ' + valueTag();
            html += '<span class="wline rewrite' + (showValue ? ' has-value' : '') + '">' + rw + '</span>';
        }
        for (let i = 0; i < stages.length; i++) {
            if (i < stageIndex) html += '<span class="wline done">' + doneLine(stages[i]) + '</span>';
        }
        if (solved) {
            const left = p.kind === 'numeric' ? numericProblemHtml(false) : problemHtml(p, null);
            const ans = p.kind === 'numeric'
                ? p.base + expSup(p.exp1 + p.exp2, true)
                : answerHtmlOf(p);
            html += '<span class="wline final">' + left + ' = <span class="result">' + ans + '</span></span>';
        }
        workEl.innerHTML = html;
        workEl.scrollTop = workEl.scrollHeight;
    }

    /* ===================== rendering ===================== */
    function stageColor(i) {
        if (!stages[i]) return STAGE_COLORS[0];
        if (stages[i].kind === 'coef') return STAGE_COLORS[0];
        const vi = p.kind === 'numeric' ? 0 : p.varOrder.indexOf(stages[i].name);
        return STAGE_COLORS[1 + (Math.max(vi, 0) % 3)];
    }

    function renderAnswerLine() {
        let html = '';
        stages.forEach((s, i) => {
            if (s.kind === 'coef') {
                html += '<input type="text" class="box coef-box waiting" data-stage="' + i + '" maxlength="6" ' +
                    'autocomplete="off" spellcheck="false" disabled>';
            } else {
                const base = p.kind === 'numeric' ? p.base : s.name;
                html += '<span class="avar" data-avar="' + i + '">' + base +
                    '<sup><input type="text" class="box exp-box waiting" data-stage="' + i + '" maxlength="3" ' +
                    'inputmode="numeric" autocomplete="off" spellcheck="false" disabled></sup></span>';
            }
        });
        answerEl.innerHTML = html;
    }

    function setStage(i) {
        stageIndex = i;
        if (i >= stages.length) { finish(); return; }

        const s = stages[i];
        const col = stageColor(i);
        card.style.setProperty('--stage', col.main);
        card.style.setProperty('--stage-soft', col.soft);

        const focus = s.kind === 'coef' ? { kind: 'coef' } : { kind: 'var', name: s.name };
        displayEl.innerHTML = p.kind === 'numeric' ? numericProblemHtml(true) : problemHtml(p, focus);

        root.querySelectorAll('.box').forEach(b => {
            const bi = parseInt(b.dataset.stage, 10);
            b.classList.remove('active');
            if (bi === i) {
                b.disabled = false;
                b.classList.remove('waiting');
                b.classList.add('active');
            } else if (bi > i) {
                b.disabled = true;
                b.classList.add('waiting');
            }
        });
        renderWork();
        const box = root.querySelector('.box[data-stage="' + i + '"]');
        if (box && isVisible()) box.focus();
    }

    function renderProblem(newP) {
        p = newP;
        stages = buildStages();
        solved = false;
        stageIndex = -2;
        if (previewTimer) { clearTimeout(previewTimer); previewTimer = null; }

        titleEl.textContent = nextNumber();
        feedbackEl.textContent = '';
        feedbackEl.className = 'feedback';
        workEl.innerHTML = '';
        nextBtn.style.display = 'none';
        checkBtn.style.display = '';

        card.style.setProperty('--stage', '#a0aec0');
        card.style.setProperty('--stage-soft', '#edf2f7');

        // the whole problem, nothing dimmed, for a couple of seconds
        displayEl.innerHTML = p.kind === 'numeric' ? numericProblemHtml(false) : problemHtml(p, null);
        renderAnswerLine();

        previewTimer = setTimeout(skipAhead, 2000);
    }

    // problem only -> problem rewritten -> first step
    function skipAhead() {
        if (previewTimer) { clearTimeout(previewTimer); previewTimer = null; }
        if (stageIndex === -2) {
            stageIndex = -1;
            renderWork();
            previewTimer = setTimeout(skipAhead, 2200);
        } else if (stageIndex === -1) {
            setStage(0);
        }
    }

    /* ===================== checking ===================== */
    function cleanNum(v) {
        return String(v).trim().replace(/[\u2212\u2013\u2014]/g, '-').replace(/\s+/g, '').replace(/^\+/, '');
    }

    function lockStage(i) {
        const box = root.querySelector('.box[data-stage="' + i + '"]');
        box.value = stages[i].answer;
        box.disabled = true;
        box.classList.remove('active', 'waiting');
        box.classList.add('locked');
        if (stages[i].kind === 'exp' && stages[i].answer === '0' && p.kind !== 'numeric') {
            const av = root.querySelector('[data-avar="' + i + '"]');
            if (av) av.classList.add('vanish');
        }
    }

    function checkCurrent(silent) {
        if (solved || stageIndex < 0 || stageIndex >= stages.length) return;
        const s = stages[stageIndex];
        const box = root.querySelector('.box[data-stage="' + stageIndex + '"]');
        if (!box) return;
        const val = cleanNum(box.value);
        if (val === '') return;

        if (val === cleanNum(s.answer)) {
            lockStage(stageIndex);
            if (stageIndex + 1 >= stages.length) {
                setStage(stages.length);
            } else {
                feedbackEl.textContent = '';
                feedbackEl.className = 'feedback';
                setStage(stageIndex + 1);
            }
            return;
        }
        if (silent) return;

        box.classList.remove('shake');
        void box.offsetWidth;
        box.classList.add('shake');
        feedbackEl.className = 'feedback incorrect';
        feedbackEl.innerHTML = wrongMessage(s, val);
    }

    function wrongMessage(s, val) {
        const num = parseFloat(val);
        const want = parseFloat(s.answer);

        if (s.kind === 'coef') {
            if (!/^-?\d+$/.test(val)) return 'Type just a number here.';
            const nums = p.factors.map(f => f.coef.n / f.coef.d);
            const sum = nums.reduce((a, b) => a + b, 0);
            const negs = p.factors.filter(f => f.coef.n < 0).length;
            if (num === sum) return 'That is adding them. Multiply the highlighted numbers instead.';
            if (num === -want) {
                return negs % 2 === 0
                    ? 'Right number, wrong sign. Two negatives multiply to a positive.'
                    : 'Right number, wrong sign. One negative keeps the answer negative.';
            }
            if (p.factors.some(f => frIsNegOne(f.coef) && f.vars.length))
                return 'Multiply the highlighted numbers. A lone minus sign counts as &minus;1.';
            if (p.factors.some(f => f.coef.d !== 1))
                return 'Multiply the highlighted numbers, fraction included.';
            return 'Multiply the highlighted numbers together.';
        }

        const name = s.name;
        if (!/^-?\d+$/.test(val)) return 'Type just the exponent here, as a number.';
        if (s.entries.length === 1) {
            return want === 0
                ? 'Only one ' + name + ' here, and its exponent stays the same.'
                : 'Only one ' + name + ' here. Its exponent does not change.';
        }
        if (s.entries.some(e => e.exp === 1) && num === want - 1)
            return 'Close. The ' + name + ' with no exponent written counts as 1.';
        const exps = s.entries.map(e => e.exp);
        const prod = exps.reduce((a, b) => a * b, 1);
        if (num === prod && prod !== want) return 'That is multiplying the exponents. Add them instead.';
        if (num === -want) return 'Right number, wrong sign. Watch the negative exponent.';
        if (s.entries.some(e => e.exp < 0))
            return 'Add the exponents, but a negative one takes some away instead.';
        if (num > want) return 'Too high. Count the highlighted ' + name + ' factors again.';
        if (num < want) return 'Too low. Count the highlighted ' + name + ' factors again.';
        return 'Add the exponents on the highlighted ' + name + '.';
    }

    function finish() {
        solved = true;
        card.style.setProperty('--stage', '#2f855a');
        card.style.setProperty('--stage-soft', '#ddf6e5');
        displayEl.innerHTML = p.kind === 'numeric' ? numericProblemHtml(false) : problemHtml(p, null);
        feedbackEl.textContent = 'Correct!';
        feedbackEl.className = 'feedback correct';
        renderWork();
        checkBtn.style.display = 'none';
        nextBtn.style.display = '';
        if (isVisible()) nextBtn.focus();
    }

    /* ===================== events ===================== */
    root.addEventListener('input', function (e) {
        if (!e.target.classList.contains('box')) return;
        if (feedbackEl.classList.contains('incorrect')) {
            feedbackEl.textContent = '';
            feedbackEl.className = 'feedback';
        }
        checkCurrent(true);
    });

    document.addEventListener('click', function (e) {
        if (!isVisible()) return;
        if (previewTimer && !(e.target && e.target.tagName === 'BUTTON')) skipAhead();
    });

    document.addEventListener('keydown', function (e) {
        if (!isVisible()) return;
        if (previewTimer) { skipAhead(); return; }
        if (e.key !== 'Enter') return;
        if (e.target && e.target.tagName === 'BUTTON') return;
        e.preventDefault();
        if (solved) advance();
        else checkCurrent(false);
    });

    checkBtn.addEventListener('click', function () { checkCurrent(false); });
    nextBtn.addEventListener('click', advance);

    function loadNewProblem() { renderProblem(generateProblem()); }
    function focusInput() {
        if (solved) { nextBtn.focus(); return; }
        const box = root.querySelector('.box[data-stage="' + stageIndex + '"]');
        if (box && !box.disabled) box.focus();
    }
    function pause() { if (previewTimer) { clearTimeout(previewTimer); previewTimer = null; } }

    return { loadNewProblem: loadNewProblem, focusInput: focusInput, pause: pause };
}


/* =====================================================================
   Mixed: alternates between the two drills, one shared problem count.
   ===================================================================== */
function createMixed(rootA, rootB) {
    let count = 0;
    const number = () => ++count;
    const recent = [];
    let currentKind = null;

    const a = createNumberDrill(rootA, { number: number, onNext: next });
    const b = createStepDrill(rootB, { number: number, onNext: next, includeNumeric: false });

    function choose() {
        // never more than two of the same kind in a row
        if (recent.length >= 2 && recent[0] === recent[1]) return recent[0] === 'a' ? 'b' : 'a';
        return Math.random() < 0.5 ? 'a' : 'b';
    }

    function next() {
        const kind = choose();
        recent.unshift(kind);
        recent.length = Math.min(recent.length, 2);
        currentKind = kind;

        if (kind === 'a') {
            rootB.classList.add('hidden');
            rootA.classList.remove('hidden');
            a.loadNewProblem();
        } else {
            rootA.classList.add('hidden');
            rootB.classList.remove('hidden');
            b.loadNewProblem();
        }
    }

    function focusInput() {
        if (currentKind === 'a') a.focusInput();
        else if (currentKind === 'b') b.focusInput();
    }

    return { loadNewProblem: next, focusInput: focusInput };
}

return { createNumberDrill: createNumberDrill, createStepDrill: createStepDrill };
})();


/* ===== DIV: lifted verbatim from the div drill, wrapped so the two
   sets of factories can share one page ===== */
var DIV = (function () {

/* =====================================================================
   Drill A: number bases. Type the exponent, then see the work.
   ===================================================================== */
/* =====================================================================
   Shared helpers: fit the type to the room, and drag a term across a bar.
   ===================================================================== */

// Every box starts at the biggest size the stylesheet allows and only steps
// down if the contents would spill. Nothing is smaller than it has to be.
const FIT_TARGETS = [];

function fitEl(el) {
    if (!el || !el.isConnected) return;
    el.style.fontSize = '';
    if (!el.clientHeight) return;
    let fs = parseFloat(window.getComputedStyle(el).fontSize);
    const min = 12;
    let guard = 40;
    while (guard-- > 0 && fs > min &&
           (el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1)) {
        fs = Math.max(min, fs * 0.93);
        el.style.fontSize = fs + 'px';
    }
}

function fitSoon(el, after) {
    if (!el) return;
    if (FIT_TARGETS.indexOf(el) === -1) FIT_TARGETS.push(el);
    window.requestAnimationFrame(function () {
        fitEl(el);
        if (after) after();
    });
}

function fitAll() { FIT_TARGETS.forEach(fitEl); }

let fitTimer = null;
window.addEventListener('resize', function () {
    clearTimeout(fitTimer);
    fitTimer = setTimeout(fitAll, 120);
});

/* ---------------------------------------------------------------------
   Dragging a term from one side of the fraction bar to the other.
   The host element holds a .frac.movemode with [data-zone="num"] and
   [data-zone="den"] halves, and grabbable pieces carry [data-move].
   A tap picks a term up, a second tap on the far side drops it, which is
   what happens on a touch screen at the board.
   --------------------------------------------------------------------- */
function createDragMove(cfg) {
    const host = cfg.host;
    let drag = null;
    let selected = null;
    let swallowClick = false;

    function zoneAt(x, y) {
        const frac = host.querySelector('.frac.movemode');
        if (!frac) return null;
        const r = frac.getBoundingClientRect();
        const pad = Math.max(44, r.height * 0.35);
        if (x < r.left - pad || x > r.right + pad || y < r.top - pad || y > r.bottom + pad) return null;
        const numEl = frac.querySelector('[data-zone="num"]');
        if (!numEl) return null;
        return y <= numEl.getBoundingClientRect().bottom ? 'num' : 'den';
    }

    function paintZone(side) {
        host.querySelectorAll('[data-zone]').forEach(function (z) {
            z.classList.toggle('zone-hot', !!side && z.dataset.zone === side);
        });
    }

    function clearSelection() {
        selected = null;
        host.querySelectorAll('.piece.picked').forEach(function (el) { el.classList.remove('picked'); });
    }

    function endDrag() {
        if (!drag) return;
        if (drag.ghost && drag.ghost.parentNode) drag.ghost.parentNode.removeChild(drag.ghost);
        if (drag.el) drag.el.classList.remove('dragging');
        document.body.classList.remove('dragging-now');
        paintZone(null);
        window.removeEventListener('pointermove', onDragMove);
        window.removeEventListener('pointerup', onDragEnd);
        window.removeEventListener('pointercancel', onDragEnd);
        drag = null;
    }

    function placeGhost(x, y) {
        drag.ghost.style.left = (x - drag.dx) + 'px';
        drag.ghost.style.top = (y - drag.dy) + 'px';
    }

    function onDragMove(e) {
        if (!drag) return;
        if (Math.abs(e.clientX - drag.x0) > 5 || Math.abs(e.clientY - drag.y0) > 5) drag.moved = true;
        placeGhost(e.clientX, e.clientY);
        if (drag.moved) paintZone(zoneAt(e.clientX, e.clientY));
    }

    function onDragEnd(e) {
        if (!drag) return;
        const idx = drag.idx;
        const moved = drag.moved;
        const side = zoneAt(e.clientX, e.clientY);
        endDrag();
        swallowClick = true;
        setTimeout(function () { swallowClick = false; }, 0);

        if (!moved) {
            const el = host.querySelector('[data-move="' + idx + '"]');
            if (selected === idx) { clearSelection(); return; }
            clearSelection();
            selected = idx;
            if (el) el.classList.add('picked');
            if (cfg.onPick) cfg.onPick(idx);
            return;
        }
        if (side && cfg.onDrop(idx, side) !== false) clearSelection();
    }

    host.addEventListener('pointerdown', function (e) {
        if (!cfg.isActive()) return;
        const el = e.target && e.target.closest ? e.target.closest('[data-move]') : null;
        if (!el) return;
        e.preventDefault();

        const rect = el.getBoundingClientRect();
        const cs = window.getComputedStyle(el);
        const ghost = el.cloneNode(true);
        ghost.className = 'drag-ghost';
        ghost.style.fontSize = cs.fontSize;
        ghost.style.fontWeight = cs.fontWeight;
        ghost.style.color = cs.color;
        document.body.appendChild(ghost);

        drag = {
            el: el, ghost: ghost, idx: parseInt(el.dataset.move, 10),
            x0: e.clientX, y0: e.clientY, moved: false,
            dx: e.clientX - (rect.left + rect.width / 2),
            dy: e.clientY - (rect.top + rect.height / 2)
        };
        placeGhost(e.clientX, e.clientY);
        el.classList.add('dragging');
        document.body.classList.add('dragging-now');
        window.addEventListener('pointermove', onDragMove);
        window.addEventListener('pointerup', onDragEnd);
        window.addEventListener('pointercancel', onDragEnd);
    });

    host.addEventListener('click', function (e) {
        if (!cfg.isActive() || swallowClick) return;
        if (selected === null) return;
        const z = e.target && e.target.closest ? e.target.closest('[data-zone]') : null;
        if (!z) return;
        const idx = selected;
        if (cfg.onDrop(idx, z.dataset.zone) !== false) clearSelection();
    });

    return { clearSelection: clearSelection, endDrag: endDrag };
}


function createNumberDrill(root, opts) {
    opts = opts || {};

    root.innerHTML =
        '<div class="card" data-card>' +
            '<div class="problem-header"><span data-title>Problem 1</span></div>' +
            '<div class="expression-row" data-expr></div>' +
            '<div class="move-rule" data-rule></div>' +
            '<div class="feedback" data-feedback></div>' +
            '<div class="expanded-reveal" data-reveal></div>' +
            '<div class="action-container" data-actions>' +
                '<button class="next-btn" data-next>Next problem</button>' +
            '</div>' +
        '</div>';

    const cardEl    = root.querySelector('[data-card]');
    const titleEl   = root.querySelector('[data-title]');
    const exprRow   = root.querySelector('[data-expr]');
    const ruleEl    = root.querySelector('[data-rule]');
    const feedback  = root.querySelector('[data-feedback]');
    const revealEl  = root.querySelector('[data-reveal]');
    const actionsEl = root.querySelector('[data-actions]');
    const nextBtn   = root.querySelector('[data-next]');

    const bases = opts.bases || [2, 3, 4, 5, 6, 7];

    const FLIP_IDX = 99;

    let localCount = 0;
    let waitingForNext = false;
    let busy = false;
    let current = null;

    function nextNumber() { return opts.number ? opts.number() : ++localCount; }
    function isVisible() {
        if (root.classList.contains('hidden')) return false;
        const panel = root.closest('.panel');
        return !panel || panel.classList.contains('is-active');
    }
    function advance() { if (opts.onNext) opts.onNext(); else loadNewProblem(); }
    function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    /* ---------- a deliberate mix, rather than luck of the draw ----------
       Types are dealt from a shuffled bag, so every ten problems hold three
       straight ones, two that subtract to a negative, two with a negative on
       the bottom, two with a negative on top, and one with negatives on both.
       That keeps the drag-it-up-and-fill-the-blank kind to about one in five. */
    const TYPE_MIX = [
        ['plainPos', 3],
        ['plainNeg', 2],
        ['denNeg',   2],
        ['numNeg',   2],
        ['bothNeg',  1]
    ];

    let typeBag = [];
    let lastType = null;
    let lastBase = null;

    function dealBag() {
        const bag = [];
        TYPE_MIX.forEach(function (row) {
            for (let i = 0; i < row[1]; i++) bag.push(row[0]);
        });
        for (let i = bag.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const swap = bag[i]; bag[i] = bag[j]; bag[j] = swap;
        }
        // don't let a bag open with the type the last one closed on
        if (lastType && bag[0] === lastType) {
            for (let k = 1; k < bag.length; k++) {
                if (bag[k] !== lastType) { bag[0] = bag[k]; bag[k] = lastType; break; }
            }
        }
        return bag;
    }

    function nextType() {
        if (!typeBag.length) typeBag = dealBag();
        lastType = typeBag.shift();
        return lastType;
    }

    function pickBase() {
        let b;
        do { b = bases[Math.floor(Math.random() * bases.length)]; } while (b === lastBase);
        lastBase = b;
        return b;
    }

    function generateProblem() {
        const base = pickBase();
        let topExp, botExp;

        switch (nextType()) {
            case 'plainPos':               // 5^4 / 5^2, nothing to move
                botExp = getRandomInt(0, 2);
                topExp = botExp + getRandomInt(1, 4);
                break;
            case 'plainNeg':               // 7^3 / 7^4, subtract straight to a negative
                topExp = getRandomInt(0, 2);
                botExp = topExp + getRandomInt(1, 4);
                break;
            case 'denNeg':                 // 2^3 / 2^-2, one drag up, positive answer
                topExp = getRandomInt(0, 4);
                botExp = -getRandomInt(1, 3);
                break;
            case 'numNeg':                 // 3^-3 / 3^3, drag down, fill the blank, drag up
                topExp = -getRandomInt(1, 3);
                botExp = getRandomInt(1, 4);
                break;
            default:                       // 4^-1 / 4^-3, both cross the bar
                topExp = -getRandomInt(1, 3);
                do { botExp = -getRandomInt(1, 3); } while (botExp === topExp);
                break;
        }

        return { base: base, topExp: topExp, botExp: botExp, answer: topExp - botExp };
    }

    /* ============ the two powers, and where each one is sitting ============ */
    function isMovable(t) { return t.exp < 0; }
    function pendingMoves() { return current ? current.terms.filter(isMovable).length : 0; }
    function inMoveStage() { return !!current && !waitingForNext && pendingMoves() > 0; }

    function expText(e) { return (e < 0 ? '&minus;' : '') + Math.abs(e); }

    function termHtml(t, moveMode) {
        // colour stays with the term it came from, so you can see what moved
        const cls = t.home === 'num' ? 't1' : 't2';
        const grab = moveMode && isMovable(t);
        return '<span class="piece ' + cls + (grab ? ' grabbable' : '') + '" data-vi="' + t.idx + '"' +
            (grab ? ' data-move="' + t.idx + '"' : '') + '>' +
            current.base + '<sup>' + expText(t.exp) + '</sup></span>';
    }

    function sideHtml(side, moveMode) {
        const parts = current.terms
            .filter(function (t) { return t.side === side; })
            .map(function (t) { return termHtml(t, moveMode); });
        if (!parts.length) return '<span class="piece">1</span>';
        return parts.join(' <span class="op">&middot;</span> ');
    }

    function exprHtml(moveMode) {
        // the side each waiting term needs to end up on
        const targets = {};
        if (moveMode) {
            current.terms.filter(isMovable).forEach(function (t) {
                targets[t.side === 'num' ? 'den' : 'num'] = true;
            });
        }
        const cls = function (s) {
            return (s === 'num' ? 'num' : 'denom') + (targets[s] ? ' zone-target' : '');
        };
        const zone = function (s) { return moveMode ? ' data-zone="' + s + '"' : ''; };

        return '<span class="frac' + (moveMode ? ' movemode' : '') + '">' +
                   '<span class="' + cls('num') + '"' + zone('num') + '>' + sideHtml('num', moveMode) + '</span>' +
                   '<span class="' + cls('den') + '"' + zone('den') + '>' + sideHtml('den', moveMode) + '</span>' +
               '</span>' +
               '<span>=</span>' +
               rightHtml(moveMode);
    }

    // A negative answer is never asked for straight out. The blank is the
    // positive power sitting on the bottom, and once it is right the computer
    // carries it up across the bar so the class sees where the minus comes from.
    function rightHtml(moveMode) {
        const inp = '<input type="text" class="ans-input' + (moveMode ? ' waiting' : '') + '" maxlength="4" ' +
            'inputmode="numeric" autocomplete="off" spellcheck="false"' + (moveMode ? ' disabled' : '') + '>';
        if (needsFlip()) {
            return '<div class="input-area"><span class="frac">' +
                       '<span class="num" data-up>1</span>' +
                       '<span class="denom has-blank"><span class="piece" data-power>' + current.base +
                           '<sup class="exp-slot">' + inp + '</sup></span></span>' +
                   '</span></div>';
        }
        return '<div class="input-area"><span>' + current.base + '<sup>' + inp + '</sup></span></div>';
    }

    // where a power will sit once every negative exponent has crossed the bar
    function finalSide(t) {
        if (t.exp >= 0) return t.side;
        return t.side === 'num' ? 'den' : 'num';
    }
    // Only when nothing is left on top does the class fill in a positive power
    // underneath and let the computer carry it up. Anything still sitting over
    // the bar is an ordinary subtract-the-exponents problem.
    function needsFlip() {
        return current.answer < 0 && current.terms.every(function (t) { return finalSide(t) === 'den'; });
    }

    function expectedInput() {
        return needsFlip() ? String(-current.answer) : String(current.answer);
    }

    function reduceHint() {
        return 'Every power is on the bottom now. Add those exponents into one power.';
    }

    function nextPrompt() {
        return needsFlip() ? reduceHint() : 'Type the answer.';
    }

    function ruleHtml() {
        const f = function (n, d) {
            return '<span class="frac"><span class="num">' + n + '</span><span class="denom">' + d + '</span></span>';
        };
        return '<span class="rule-text">A negative exponent means the power belongs on the other side of the bar.</span>' +
            '<span class="rule-math">' +
                f('1', 'a<sup>&minus;n</sup>') + ' = a<sup>n</sup>' +
                '<span class="rule-gap"></span>' +
                'a<sup>&minus;n</sup> = ' + f('1', 'a<sup>n</sup>') +
            '</span>';
    }

    function moveHint() {
        return pendingMoves() > 1
            ? 'Drag each power with a negative exponent across the bar. The exponent turns positive on the way over.'
            : 'Drag the power with the negative exponent across the bar. The exponent turns positive on the way over.';
    }

    function renderExpr(landedIdx) {
        const moveMode = pendingMoves() > 0;
        exprRow.innerHTML = exprHtml(moveMode);
        ruleEl.style.display = moveMode ? 'block' : 'none';
        if (landedIdx !== undefined) {
            const el = exprRow.querySelector('[data-vi="' + landedIdx + '"]');
            if (el) el.classList.add('landed');
        }
        fitSoon(exprRow);
        return moveMode;
    }

    function inFlipStage() { return !!current && !!current.flipStage && !current.flipped; }

    // Once the blank is filled the power becomes a solid term again, sitting
    // under the bar with the same handle the class already used on the left.
    function renderFlipStage() {
        const area = exprRow.querySelector('.input-area');
        if (!area) return;
        area.innerHTML =
            '<span class="frac movemode">' +
                '<span class="num zone-target" data-zone="num">1</span>' +
                '<span class="denom" data-zone="den">' +
                    '<span class="piece grabbable" data-move="' + FLIP_IDX + '">' + current.base +
                        '<sup>' + Math.abs(current.answer) + '</sup></span>' +
                '</span>' +
            '</span>';
        ruleEl.style.display = 'block';
        fitSoon(exprRow);
    }

    function attemptFlip(side) {
        if (side === 'den') {
            feedback.className = 'feedback incorrect';
            feedback.textContent = 'It is already under the bar. Drag it up over the bar instead.';
            return false;
        }
        current.flipStage = false;
        renderFlipped();
        afterFlip();
        return true;
    }

    function handleDrop(idx, side) {
        return idx === FLIP_IDX ? attemptFlip(side) : attemptDrop(idx, side);
    }

    function attemptDrop(idx, side) {
        const t = current.terms[idx];
        if (!t || !isMovable(t)) return false;
        if (side === t.side) {
            feedback.className = 'feedback incorrect';
            feedback.textContent = t.side === 'den'
                ? 'That is the side it is already on. A negative exponent moves up across the bar.'
                : 'That is the side it is already on. A negative exponent moves down across the bar.';
            return false;
        }

        t.side = side;
        t.exp = -t.exp;
        const stillMoving = renderExpr(idx);

        if (stillMoving) {
            feedback.className = 'feedback hint';
            feedback.textContent = moveHint();
        } else {
            feedback.className = 'feedback correct';
            feedback.textContent = 'The exponent is positive now. ' + nextPrompt();
            const input = exprRow.querySelector('.ans-input');
            if (input && isVisible()) input.focus();
        }
        return true;
    }

    const dragger = createDragMove({
        host: exprRow,
        isActive: function () { return inMoveStage() || inFlipStage(); },
        onPick: function (idx) {
            feedback.className = 'feedback hint';
            feedback.textContent = idx === FLIP_IDX
                ? 'Now tap above the bar.'
                : 'Now tap the other side of the bar.';
        },
        onDrop: handleDrop
    });

    function renderProblem(p) {
        current = p;
        current.terms = [
            { idx: 0, home: 'num', side: 'num', exp: p.topExp },
            { idx: 1, home: 'den', side: 'den', exp: p.botExp }
        ];
        titleEl.textContent = nextNumber();

        feedback.textContent = '';
        feedback.className = 'feedback';
        revealEl.style.display = 'none';
        actionsEl.style.display = 'none';
        cardEl.classList.remove('done');
        waitingForNext = false;
        busy = false;
        current.flipped = false;
        current.flipStage = false;
        dragger.endDrag();
        dragger.clearSelection();

        ruleEl.innerHTML = ruleHtml();
        const moveMode = renderExpr();
        revealEl.innerHTML = buildWorkHtml(p.base, p.topExp, p.botExp);

        if (moveMode) {
            feedback.className = 'feedback hint';
            feedback.textContent = moveHint();
        } else {
            if (needsFlip()) {
                feedback.className = 'feedback hint';
                feedback.textContent = reduceHint();
            }
            const input = exprRow.querySelector('.ans-input');
            if (input && isVisible()) input.focus();
        }
    }

    /* ============ after 1/b^n: the same number as b^-n and as a value ============ */
    function showEquivalents() {
        const n = -current.answer;
        const size = Math.pow(current.base, n).toLocaleString('en-US');
        exprRow.insertAdjacentHTML('beforeend',
            '<span class="equiv-eq">=</span>' +
            '<span class="piece flip-result equiv-neg">' + current.base + '<sup>&minus;' + n + '</sup></span>' +
            '<span class="equiv-eq">=</span>' +
            '<span class="equiv-val"><span class="equiv-label">value</span>' +
                '<span class="frac"><span class="num">1</span><span class="denom">' + size + '</span></span></span>');
        fitSoon(exprRow);
    }

    /* ============ the computer carries the power up across the bar ============ */
    function renderFlipped() {
        const area = exprRow.querySelector('.input-area');
        if (!area) return;
        area.innerHTML = '<span class="piece landed flip-result">' + current.base +
            '<sup>&minus;' + Math.abs(current.answer) + '</sup></span>';
    }

    function afterFlip() {
        current.flipped = true;
        busy = false;
        feedback.className = 'feedback correct';
        feedback.innerHTML = 'Up over the bar, so the exponent turns negative: ' +
            current.base + '<sup>&minus;' + Math.abs(current.answer) + '</sup>';
        finishProblem();
    }

    function finishProblem() {
        revealEl.style.display = 'block';
        actionsEl.style.display = 'block';
        cardEl.classList.add('done');
        ruleEl.style.display = 'none';
        waitingForNext = true;
        animateCrossOuts();
        fitSoon(exprRow);
        fitSoon(revealEl);
    }

    function buildWorkHtml(base, top, bot) {
        const netExp = top - bot;
        const dot = ' &middot; ';
        const factor = (cls) => cls ? '<span class="' + cls + '">' + base + '</span>' : String(base);
        const struck = (cls, pair) => '<span class="' + cls + ' cross-out" data-pair="' + pair + '">' + base + '</span>';
        const power = (cls, exp) => '<span class="' + cls + '">' + base + '<sup>' + exp + '</sup></span>';
        const frac = (num, den) =>
            '<span class="frac"><span class="num">' + num + '</span><span class="denom">' + den + '</span></span>';

        // Where every base ends up once negative exponents move across the bar.
        // Color stays with the term it came from, so you can see what moved.
        const topCls = [];
        const botCls = [];
        for (let i = 0; i < Math.max(top, 0); i++) topCls.push('t1');
        for (let i = 0; i < Math.max(-bot, 0); i++) topCls.push('t2');
        for (let i = 0; i < Math.max(bot, 0); i++) botCls.push('t2');
        for (let i = 0; i < Math.max(-top, 0); i++) botCls.push('t1');

        const cancelCount = Math.min(topCls.length, botCls.length);

        function expanded(withCancel) {
            const numParts = topCls.map((c, i) => (withCancel && i < cancelCount) ? struck(c, i) : factor(c));
            const denParts = botCls.map((c, i) => (withCancel && i < cancelCount) ? struck(c, i) : factor(c));
            return frac(
                numParts.length ? numParts.join(dot) : '1',
                denParts.length ? denParts.join(dot) : '1'
            );
        }

        function simplified() {
            if (netExp === 0) return '1';
            const factors = Array(Math.abs(netExp)).fill(factor(null)).join(dot);
            return netExp > 0 ? factors : frac('1', factors);
        }

        const stages = [];

        // a negative exponent flips across the bar first
        if (top < 0 || bot < 0) {
            const numTerms = [];
            if (top > 0) numTerms.push(power('t1', top));
            if (top === 0) numTerms.push('<span class="t1">1</span>');
            if (bot < 0) numTerms.push(power('t2', Math.abs(bot)));
            const denTerms = [];
            if (bot > 0) denTerms.push(power('t2', bot));
            if (bot === 0) denTerms.push('<span class="t2">1</span>');
            if (top < 0) denTerms.push(power('t1', Math.abs(top)));
            stages.push(frac(
                numTerms.length ? numTerms.join(dot) : '1',
                denTerms.length ? denTerms.join(dot) : '1'
            ));
        }

        stages.push(expanded(cancelCount > 0));
        if (cancelCount > 0) stages.push(simplified());

        // the value goes on the end of the expanded form, labelled with an arrow,
        // the same way the multiplying drill shows it
        const size = Math.pow(base, Math.abs(netExp));
        const tag = (html) =>
            '<span class="value-tag">' +
                '<span class="vlabel">Value<svg class="varrow" viewBox="0 0 10 16" aria-hidden="true"><path class="vshaft" d="M5 1 V9"/><path class="vhead" d="M1.4 8 L5 14.5 L8.6 8 Z"/></svg></span>' +
                '<span class="vnum">' + html + '</span>' +
            '</span>';
        if (netExp === 0 && stages[stages.length - 1] === '1') stages[stages.length - 1] = tag('1');
        else stages.push(tag(netExp === 0 ? '1' : netExp > 0 ? String(size) : frac('1', size)));

        const fmtTop = top < 0 ? '(' + top + ')' : top;
        const fmtBot = bot < 0 ? '(' + bot + ')' : bot;

        const zeroPowerLine = netExp === 0
            ? '<div class="work-step">' +
                  '<div class="work-label">Zero power</div>' +
                  '<div class="work-line">' + base + '<sup>0</sup> = 1</div>' +
              '</div>'
            : '';

        return '<div class="work-box">' +
                   '<div class="work-step">' +
                       '<div class="work-label">Expanded form</div>' +
                       '<div class="work-line has-value">' + stages.join(' = ') + '</div>' +
                   '</div>' +
                   '<div class="work-step">' +
                       '<div class="work-label">Divide the same bases? Subtract the exponents.</div>' +
                       '<div class="work-line">' + base +
                           '<sup><span class="t1">' + fmtTop + '</span><span class="exp-content"> ' +
                           '<span style="color: #38a169;">&minus;</span> <span class="t2">' + fmtBot + '</span></span></sup>' +
                           ' = ' + base + '<sup>' + netExp + '</sup>' +
                       '</div>' +
                   '</div>' +
                   zeroPowerLine +
               '</div>';
    }

    function animateCrossOuts() {
        const marks = root.querySelectorAll('.cross-out[data-pair]');
        if (!marks.length) return;

        const reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        const pairs = new Map();
        marks.forEach(m => {
            const key = m.dataset.pair;
            if (!pairs.has(key)) pairs.set(key, []);
            pairs.get(key).push(m);
        });

        const groups = [...pairs.keys()].sort((a, b) => a - b);
        groups.forEach((key, i) => {
            const draw = () => pairs.get(key).forEach(m => m.classList.add('on'));
            if (reduced) draw();
            else setTimeout(draw, 250 + i * 300);
        });
    }

    root.addEventListener('input', function (event) {
        if (!event.target.classList.contains('ans-input') || waitingForNext || busy) return;

        const input = event.target;
        const userVal = input.value.trim();
        const want = expectedInput();

        if (userVal === want) {
            input.disabled = true;
            if (needsFlip()) {
                /* The class stops at the positive power under the bar. Nothing is
                   dragged back up: the drill writes the same number as a negative
                   power and as a value, so they can see all three are equal. */
                showEquivalents();
                feedback.innerHTML = 'Correct! 1 over ' + current.base + '<sup>' + want + '</sup> is the same as ' +
                    current.base + '<sup>&minus;' + want + '</sup>.';
                feedback.className = 'feedback correct';
                finishProblem();
            } else {
                feedback.textContent = 'Correct!';
                feedback.className = 'feedback correct';
                finishProblem();
            }
        } else if (needsFlip() && userVal === '-' + want) {
            feedback.textContent = 'Down on the bottom the exponent is positive. Type just ' + want + '.';
            feedback.className = 'feedback incorrect';
        } else if (userVal.length >= want.length || (userVal.includes('-') && userVal.length >= 2)) {
            feedback.textContent = 'Not quite, try again.';
            feedback.className = 'feedback incorrect';
        } else {
            feedback.textContent = '';
        }
    });

    document.addEventListener('keydown', function (event) {
        if (event.key !== 'Enter' || !isVisible() || busy) return;
        if (waitingForNext) {
            event.preventDefault();
            advance();
        }
    });

    nextBtn.addEventListener('click', advance);

    function loadNewProblem() { renderProblem(generateProblem()); }
    function focusInput() {
        const input = exprRow.querySelector('.ans-input');
        if (input && !input.disabled) input.focus();
        else if (waitingForNext) nextBtn.focus();
    }

    return { loadNewProblem: loadNewProblem, focusInput: focusInput };
}


/* =====================================================================
   Drill B: one step at a time, variables and coefficients.
   Top of the fraction is blue, bottom is red, all the way through.
   ===================================================================== */
function createStepDrill(root, opts) {
    opts = opts || {};

    root.innerHTML =
        '<div class="card" data-card>' +
            '<div class="problem-title" data-title>Problem 1</div>' +
            '<div class="expression-row">' +
                '<span data-display></span>' +
                '<span class="eq">=</span>' +
                '<span class="answer-line" data-answer></span>' +
            '</div>' +
            '<div class="feedback" data-feedback></div>' +
            '<div class="work" data-work></div>' +
            '<div class="action-container">' +
                '<button class="check-btn" data-check>Check this step</button>' +
                '<button class="next-btn" data-next>Next problem</button>' +
            '</div>' +
        '</div>';

    const card       = root.querySelector('[data-card]');
    const titleEl    = root.querySelector('[data-title]');
    const displayEl  = root.querySelector('[data-display]');
    const answerEl   = root.querySelector('[data-answer]');
    const feedbackEl = root.querySelector('[data-feedback]');
    const workEl     = root.querySelector('[data-work]');
    const checkBtn   = root.querySelector('[data-check]');
    const nextBtn    = root.querySelector('[data-next]');
    const exprRowEl  = root.querySelector('.expression-row');

    /* ===================== helpers ===================== */
    const DOT = ' <span class="op">&middot;</span> ';
    const VARS = ['a', 'b', 'c', 'd', 'm', 'n', 'p', 'q', 'r', 's', 't', 'u', 'v', 'w', 'x', 'y', 'z'];
    const EXPAND_LIMIT = 22;
    const STAGE_COLORS = [
        { main: '#b7791f', soft: '#fff3d1' },
        { main: '#2b6cb0', soft: '#e2eeff' },
        { main: '#2f855a', soft: '#ddf6e5' },
        { main: '#6b46c1', soft: '#efe2ff' }
    ];
    const MOVE_COLOR = { main: '#805ad5', soft: '#f1e6ff' };

    function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function coin(pr) { return Math.random() < (pr === undefined ? 0.5 : pr); }
    function pickVars(k) {
        const pool = VARS.slice(), out = [];
        for (let i = 0; i < k; i++) out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
        return out.sort();
    }

    /* ===================== fractions ===================== */
    function gcd(a, b) { while (b) { const t = b; b = a % b; a = t; } return a || 1; }
    function fr(n, d) {
        d = (d === undefined) ? 1 : d;
        if (d < 0) { n = -n; d = -d; }
        const g = gcd(Math.abs(n), Math.abs(d));
        return { n: n / g, d: d / g };
    }
    function frMul(a, b) { return fr(a.n * b.n, a.d * b.d); }
    function frDiv(a, b) { return fr(a.n * b.d, a.d * b.n); }
    function frIsOne(f) { return f.n === 1 && f.d === 1; }
    function frIsNegOne(f) { return f.n === -1 && f.d === 1; }
    function frText(f) { return f.d === 1 ? String(f.n) : f.n + '/' + f.d; }
    function frHtml(f) {
        if (f.d === 1) return String(f.n).replace('-', '&minus;');
        return (f.n < 0 ? '&minus;' : '') +
            '<span class="frac"><span class="num">' + Math.abs(f.n) + '</span><span class="denom">' + f.d + '</span></span>';
    }
    function fracHtml(num, den) {
        return '<span class="frac"><span class="num">' + num + '</span><span class="denom">' + den + '</span></span>';
    }

    /* ===================== problem structure ===================== */
    function mono(coefN, vars, coefD) {
        return { coef: fr(coefN, coefD || 1), vars: (vars || []).map(v => ({ name: v[0], exp: v[1] })) };
    }
    function buildProblem(num, den) {
        const q = { num: num, den: den };
        q.varOrder = [];
        num.concat(den).forEach(f => f.vars.forEach(v => {
            if (q.varOrder.indexOf(v.name) === -1) q.varOrder.push(v.name);
        }));

        // every letter remembers the side it started on, so a term that gets
        // dragged across the bar can keep the colour of where it came from
        q.allVars = [];
        [['num', num], ['den', den]].forEach(pair => {
            pair[1].forEach(f => f.vars.forEach(v => {
                v.home = pair[0];
                v.side = pair[0];
                v.exp0 = v.exp;
                v.idx = q.allVars.length;
                q.allVars.push(v);
            }));
        });
        q.negCount = q.allVars.filter(v => v.exp0 < 0).length;

        const nc = num.reduce((acc, f) => frMul(acc, f.coef), fr(1, 1));
        const dc = den.reduce((acc, f) => frMul(acc, f.coef), fr(1, 1));
        q.coefAnswer = frDiv(nc, dc);
        q.expAnswer = {};
        q.varOrder.forEach(name => {
            const t = sideExp(num, name);
            const b = sideExp(den, name);
            q.expAnswer[name] = t - b;
        });
        q.answerText = answerText(q);
        return q;
    }
    function sideExp(factors, name) {
        return factors.reduce((s, f) => {
            const v = f.vars.find(v => v.name === name);
            return s + (v ? v.exp : 0);
        }, 0);
    }
    function answerText(q) {
        const v = q.varOrder.filter(n => q.expAnswer[n] !== 0)
            .map(n => q.expAnswer[n] === 1 ? n : n + '^' + q.expAnswer[n]).join('');
        const c = q.coefAnswer;
        if (!v) return frText(c);
        if (frIsOne(c)) return v;
        if (frIsNegOne(c)) return '-' + v;
        return frText(c) + v;
    }
    // a negative exponent in the answer is written as a fraction instead
    function answerHtmlOf(q) {
        const pos = q.varOrder.filter(n => q.expAnswer[n] > 0).map(n => n + expSup(q.expAnswer[n], false)).join('');
        const neg = q.varOrder.filter(n => q.expAnswer[n] < 0).map(n => n + expSup(-q.expAnswer[n], false)).join('');
        const c = q.coefAnswer;
        const mag = fr(Math.abs(c.n), c.d);
        const head = (!frIsOne(mag) || (!pos && !neg)) ? frHtml(mag) : '';
        const top = (head + pos) || '1';
        const body = neg ? fracHtml(top, neg) : top;
        return (c.n < 0 ? '&minus;' : '') + body;
    }

    /* ===================== display ===================== */
    function expSup(e, showOne) {
        if (e === 1 && !showOne) return '';
        return '<sup>' + (e < 0 ? '&minus;' : '') + Math.abs(e) + '</sup>';
    }
    function coefPieceText(f) {
        if (frIsNegOne(f.coef) && f.vars.length) return '&minus;';
        if (!frIsOne(f.coef) || f.vars.length === 0) return frHtml(f.coef);
        return '';
    }
    function movable(v) { return v.exp < 0; }
    function pendingMoves() { return p ? p.allVars.filter(movable).length : 0; }

    function piece(html, cls, hot, dim) {
        return '<span class="piece ' + cls + (dim ? (hot ? ' hot' : ' cool') : '') + '">' + html + '</span>';
    }
    function varPiece(v, cls, focus, orig) {
        const dim = !!focus;
        const moveMode = !!focus && focus.kind === 'move';
        const grab = moveMode && !orig && movable(v);
        const hot = moveMode
            ? grab
            : !!(focus && focus.kind === 'var' && focus.name === v.name);
        return '<span class="piece ' + cls + (dim ? (hot ? ' hot' : ' cool') : '') +
            (grab ? ' grabbable' : '') + '" data-vi="' + v.idx + '"' +
            (grab ? ' data-move="' + v.idx + '"' : '') + '>' +
            v.name + expSup(orig ? v.exp0 : v.exp, false) + '</span>';
    }

    function sideHtml(side, focus, orig) {
        const dim = !!focus;
        const homeCls = side === 'num' ? 't1' : 't2';
        const factors = side === 'num' ? p.num : p.den;
        const other = side === 'num' ? p.den : p.num;
        const out = [];

        factors.forEach((f, i) => {
            let inner = '';
            const ct = coefPieceText(f);
            if (ct) inner += piece(ct, homeCls, focus && focus.kind === 'coef', dim);
            f.vars.forEach(v => {
                if (!orig && v.side !== side) return;
                inner += varPiece(v, homeCls, focus, orig);
            });
            if (!inner) {
                if (factors.length > 1) return;   // an emptied factor just disappears
                inner = piece('1', homeCls, false, dim);
            }
            if (i > 0) {
                const pc = '<span class="' + homeCls + (dim ? ' piece cool' : '') + '">';
                inner = pc + '(</span>' + inner + pc + ')</span>';
            }
            out.push(inner);
        });

        // anything that has been dragged over from the other side
        if (!orig) {
            other.forEach(f => f.vars.forEach(v => {
                if (v.side !== side) return;
                out.push(varPiece(v, v.home === 'num' ? 't1' : 't2', focus, orig));
            }));
        }

        if (!out.length) return piece('1', homeCls, false, dim);
        return out.join('');
    }

    function problemHtml(focus, orig) {
        const moveMode = !!focus && focus.kind === 'move';
        // the side each waiting term needs to end up on
        const targets = {};
        if (moveMode) p.allVars.filter(movable).forEach(v => { targets[v.side === 'num' ? 'den' : 'num'] = true; });
        const cls = s => (s === 'num' ? 'num' : 'denom') + (targets[s] ? ' zone-target' : '');
        const zone = s => moveMode ? ' data-zone="' + s + '"' : '';
        return '<span class="frac' + (moveMode ? ' movemode' : '') + '">' +
            '<span class="' + cls('num') + '"' + zone('num') + '>' + sideHtml('num', focus, orig) + '</span>' +
            '<span class="' + cls('den') + '"' + zone('den') + '>' + sideHtml('den', focus, orig) + '</span>' +
            '</span>';
    }

    /* ===================== generators ===================== */
    // two variables on top, one of them divided away: e^4 f^9 / e^2
    function genNoCoef() {
        const v = pickVars(2);
        const a = rnd(3, 8), b = rnd(1, a - 1);
        return buildProblem(
            [mono(1, [[v[0], a], [v[1], rnd(2, 8)]])],
            [mono(1, [[v[0], b]])]);
    }
    // one variable, coefficients that divide evenly: 12x^7 / (4x^2)
    function genOneVar() {
        const v = pick(VARS);
        const c2 = rnd(2, 9), k = rnd(2, 9);
        const a = rnd(3, 9), b = rnd(1, a - 1);
        return buildProblem([mono(c2 * k, [[v, a]])], [mono(c2, [[v, b]])]);
    }
    // 20x^5 y^16 / (5x^2 y^5)
    function genTwoVar() {
        const v = pickVars(2);
        const c2 = pick([2, 3, 4, 5, 6]), k = rnd(2, 8);
        const a1 = rnd(3, 8), b1 = rnd(1, a1 - 1);
        const a2 = rnd(4, 12), b2 = rnd(1, a2 - 1);
        return buildProblem(
            [mono(c2 * k, [[v[0], a1], [v[1], a2]])],
            [mono(c2, [[v[0], b1], [v[1], b2]])]);
    }
    // three variables with a negative exponent underneath: c^4 d^5 e^10 / (c^2 d^-6 e)
    function genThreeVar() {
        const v = pickVars(3);
        const a1 = rnd(3, 7), b1 = rnd(1, a1 - 1);
        const a2 = rnd(2, 6), b2 = -rnd(2, 6);
        const a3 = rnd(4, 10);
        return buildProblem(
            [mono(1, [[v[0], a1], [v[1], a2], [v[2], a3]])],
            [mono(1, [[v[0], b1], [v[1], b2], [v[2], 1]])]);
    }
    // a product on top: 24x^2 y^3 (2x^8) / (6xy^2)
    function genProductTop() {
        const v = pickVars(2);
        const c3 = pick([2, 3, 4, 5, 6]), k = rnd(2, 8), c2 = rnd(2, 4);
        const a1 = rnd(1, 4), a2 = rnd(4, 8), b1 = rnd(1, Math.min(a1 + a2 - 1, 6));
        const t2 = rnd(2, 6), b2 = rnd(1, t2 - 1);
        return buildProblem(
            [mono(c3 * k, [[v[0], a1], [v[1], t2]]), mono(c2, [[v[0], a2]])],
            [mono(c3 * c2, [[v[0], b1], [v[1], b2]])]);
    }
    // the answer comes out negative: x^3 / x^7
    function genNegResult() {
        const v = pickVars(2);
        const a = rnd(1, 4), b = a + rnd(1, 4);
        const c = rnd(2, 6);
        return buildProblem(
            [mono(c * rnd(2, 5), [[v[0], a], [v[1], rnd(2, 6)]])],
            [mono(c, [[v[0], b], [v[1], rnd(1, 2)]])]);
    }
    // one variable divides all the way out, leaving a zero power
    function genZeroPower() {
        const v = pickVars(2);
        const a = rnd(2, 6);
        const c = rnd(2, 8);
        return buildProblem(
            [mono(c * rnd(2, 6), [[v[0], a], [v[1], rnd(3, 8)]])],
            [mono(c, [[v[0], a], [v[1], rnd(1, 2)]])]);
    }
    // the coefficient does not divide evenly, so the answer keeps a fraction
    function genFracCoef() {
        const v = pickVars(2);
