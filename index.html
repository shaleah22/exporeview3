                if (asPow1(n.a, n.b)) return powOne(n, O(P(n.a, 1), n.b));
                if (asPow1(n.b, n.a)) return powOne(n, O(n.a, P(n.b, 1)));
                if (isPowLit(n.a) && isPowLit(n.b) && rEq(litVal(n.a.b), litVal(n.b.b))) return sameBaseOver(n);
            }
            if (!HOLD && isPowLit(n.a) && isPowLit(n.b) && n.a.e < 0 && n.b.e < 0) {
                const m = drag(n, 'Both exponents are negative: each power crosses the bar and its exponent turns positive.',
                    `Drag ${T(n.a)} ↓   ${T(n.b)} ↑`,
                    '↕ other side of the bar');
                src(m, n.a, 'pow', 'a');
                src(m, n.b, 'pow', 'b');
                const moved = (p, id) => SL(m, id, p.e === -1 ? Qr(litVal(p.b)) : P(p.b, -p.e), p.e === -1);
                return O(moved(n.b, 'b'), moved(n.a, 'a'));
            }
            if (!HOLD && isPowLit(n.b) && n.b.e < 0) {
                const m = drag(n, 'A negative power on the bottom moves up across the bar, and its exponent turns positive.',
                    `Drag ${T(n.b)} ↑`,
                    '↕ other side of the bar');
                src(m, n.b, 'pow', '');
                const up = SL(m, '', n.b.e === -1 ? Qr(litVal(n.b.b)) : P(n.b.b, -n.b.e), n.b.e === -1);
                const A1 = litVal(n.a);
                return SC((A1 !== null && rEq(A1, R(1))) ? up : B('·', n.a, up));
            }
            if (!HOLD && isPowLit(n.a) && n.a.e < 0 && (Bv !== null || isPowLit(n.b))) {
                const m = drag(n, 'A negative power on top moves down across the bar, and its exponent turns positive.',
                    `Drag ${T(n.a)} ↓`,
                    '↕ other side of the bar');
                src(m, n.a, 'pow', '');
                const down = SL(m, '', n.a.e === -1 ? Qr(litVal(n.a.b)) : P(n.a.b, -n.a.e), n.a.e === -1);
                return O(Q(1), Bv !== null && rEq(Bv, R(1)) ? down : B('·', n.b, down));
            }
            // same base, no negatives left: subtract the smaller exponent from the bigger one, on whichever side it belongs
            if (isPowLit(n.a) && isPowLit(n.b) && rEq(litVal(n.a.b), litVal(n.b.b))) {
                const m = mv(n, 'Same base divided: subtract the exponents.');
                m.tip = 'Divide the same bases? Subtract exponents.';
                m.lightExp = [n.a, n.b];
                m.lightBar = n;
                /* Always top minus bottom, even when that leaves a negative exponent.
                   Going straight to 1 over a positive power would be subtracting
                   backwards and crossing the bar in the same breath -- two rules at
                   once.  4³/4⁴ becomes 4⁻¹ here, and the crossing is its own move
                   afterwards, the same one the rest of the drill teaches. */
                return P(n.a.b, n.a.e - n.b.e, ask(m, `${numT(n.a.e)} − ${parT(n.b.e)} = ?`,
                    n.b.e < 0 ? '− (−) = +' : 'top − bottom'));
            }
            return O(step(n.a), step(n.b));
        }

        case 'bin': {
            const A = litVal(n.a), Bv = litVal(n.b);
            /* a sum is handled off how each side is written, so the -8/1 and -24/3
               scaffolding is read back correctly on the next pass */
            if (n.op === '+' || n.op === '−') {
                const wa = written(n.a), wb = written(n.b);
                if (wa && wb) return addStep(n, wa, wb);
            }
            if (LAWS && MULS.includes(n.op) && n.op !== '÷') {
                if (asPow1(n.a, n.b)) return powOne(n, B(n.op, P(n.a, 1), n.b));
                if (asPow1(n.b, n.a)) return powOne(n, B(n.op, n.a, P(n.b, 1)));
            }
            if (A !== null && Bv !== null) {
                const bothInt = A.d === 1n && Bv.d === 1n;
                if (n.op === '+' || n.op === '−') {
                    const word = n.op === '+' ? 'Add' : 'Subtract';
                    const m = mv(n, bothInt ? `${word}.` : `${word} the fractions — they need a common denominator.`);
                    const nudge = bothInt ? T(n)
                        : A.d === Bv.d ? `Same bottom: ${n.op} the tops`
                        : `Common bottom: ${lcmB(A.d, Bv.d)}`;
                    return H(Qr(n.op === '+' ? rAdd(A, Bv) : rSub(A, Bv)), ask(m, `${T(n)} = ?`, nudge));
                }
                if (n.op === '÷') {
                    const m = mv(n, 'Divide.');
                    return H(Qr(rDiv(A, Bv)), ask(m, `${T(n)} = ?`, '÷ fraction = × its flip'));
                }
                const xs = crossBoard(n, [A, Bv]);
                if (xs === 'defer') return n;
                if (xs) return xs;
                const m = mv(n, 'Multiply.');
                return H(Qr(rMul(A, Bv)), ask(m, `${T(n)} = ?`,
                    (bothInt ? T(n) : 'top × top, bottom × bottom, simplify') + (A.n < 0n || Bv.n < 0n ? '  (sign!)' : '')));
            }
            if (MULS.includes(n.op) && isPowLit(n.a) && isPowLit(n.b)) {
                const ba = litVal(n.a.b), bb = litVal(n.b.b);
                if (rEq(ba, bb)) {
                    if (n.op === '÷') {
                        const m = mv(n, 'Same base divided: subtract the exponents.');
                        m.tip = 'Divide the same bases? Subtract exponents.';
                        m.lightExp = [n.a, n.b];
                        m.lightOp = n;
                        return P(n.a.b, n.a.e - n.b.e, ask(m, `${numT(n.a.e)} − ${parT(n.b.e)} = ?`, n.b.e < 0 ? '− (−) = +' : 'first − second'));
                    }
                    const m = mv(n, 'Same base multiplied: add the exponents.');
                    m.tip = 'Same base ×  →  add the exponents';
                    m.lightExp = [n.a, n.b];
                    m.lightOp = n;
                    return P(n.a.b, n.a.e + n.b.e, ask(m, `${numT(n.a.e)} + ${parT(n.b.e)} = ?`, '+ not ×'));
                }
                if (n.op !== '÷' && n.a.e === n.b.e && n.a.e < 0) {
                    /* nothing to type here, so the note is the only thing that says
                       what just happened to the line */
                    const m = mv(n, 'Same exponent, multiplied: multiply the bases together and keep the exponent.');
                    m.tip = 'Same exponents different bases? Multiply the bases and keep the exponent the same.';
                    return P(B(n.op, n.a.b, n.b.b), n.a.e);
                }
            }
            return B(n.op, step(n.a), step(n.b));
        }

        case 'jx': {
            if (n.items.every(it => litVal(it) !== null)) {
                const vals = n.items.map(litVal);
                const xs = crossBoard(n, vals);
                if (xs === 'defer') return n;
                if (xs) return xs;
                const m = mv(n, 'Everything is a number now: multiply them all together.');
                return H(Qr(vals.reduce(rMul)), ask(m, `${T(n)} = ?`,
                    vals.some(v => v.d !== 1n) ? 'top × top, bottom × bottom, simplify' : T(n)));
            }
            return J(...n.items.map(it => step(it)));
        }
    }
}

/* ============================================================
   Rendering to HTML
   ============================================================ */
const MINUS = '−';
/* HOLES: null = draw every hole as its number; an array = draw input boxes and record what each expects */
let HOLES = null;
/* HL: null, or a Map from a piece of the expression to the move it feeds, so that piece can be highlighted */
let HL = null;
/* finer highlights: HLE = powers whose exponent lights up, HLO = operators (or fraction bars) that light up */
let HLE = null, HLO = null;
/* DRAG: null, or a Map from a piece of the line above to how it is dragged */
let DRAG = null;
/* SLOTS: while drawing a live step, every drop spot is listed here */
let SLOTS = null;
let XSL = null;   // cross-cancel lines drawn in the live step
let XSMODE = 'board';
/* set for the outermost node of a line only, so the top-level pieces of the expression
   can be marked and later given matching widths.  Cleared on the way down, so a nested
   product or sum is never marked. */
let TOP = false;
const partHtml = (k, html) => `<span class="part" data-p="${k}">${html}</span>`;
const termHtml = (id, target, kind, m, inner, label) =>
    `<span class="term src" id="src-${id}" data-target="slot-${target}" data-kind="${kind}" data-m="${m}" tabindex="-1" role="button" aria-label="${label}">${inner}</span>`;
const slotHtml = (id, m, extra = '') => { SLOTS.push({ id, m }); return `<span class="drop-slot" id="slot-${id}" data-m="${m}"${extra}>?</span>`; };
const box = (cls, expect) => { const i = HOLES.length; HOLES.push(expect); return `<input class="ans-input ${cls}" data-h="${i}" inputmode="text" autocomplete="off" spellcheck="false" aria-label="answer box ${i + 1}">`; };
const intTxt = n => (n < 0n ? MINUS + (-n) : '' + n);
const hasStack = n => {
    switch (n.t) {
        case 'q': return n.v.d !== 1n;
        case 'rq': case 'over': return true;
        case 'grp': case 'hole': case 'slot': case 'scaf': return hasStack(n.x);
        case 'fslot': case 'xs': return true;
        case 'pow': return hasStack(n.b);
        case 'bin': return hasStack(n.a) || hasStack(n.b);
        case 'jx': return n.items.some(hasStack);
    }
};
const fracHtml = (a, b) => `<span class="fr"><span class="fn">${a}</span><span class="fd${String(b).includes('class="ex') ? ' lift' : ''}">${b}</span></span>`;
function paren(inner, tall) {
    return tall
        ? `<span class="pg"><span class="lp"></span><span class="pgi">${inner}</span><span class="rp"></span></span>`
        : `<span class="pg short"><span class="pc">(</span>${inner}<span class="pc">)</span></span>`;
}
const expHtml = (e, eh, lit) => HOLES && eh
    ? `<span class="ex">${box('exp-in', { kind: 'int', v: e, meta: eh })}</span>`
    : `<span class="ex${e < 0 ? ' neg' : ''}${lit !== undefined ? ' hl hlx' : ''}"${lit !== undefined ? ` data-m="${lit}"` : ''}>${e < 0 ? MINUS + (-e) : e}</span>`;
function holeHtml(v, ctx, meta) {
    if (v.d === 1n) {
        const b = box('val-in', { kind: 'int', v: Number(v.n), meta });
        return ctx.asBase && v.n < 0n ? paren(b, false) : b;
    }
    const f = fracHtml(box('frac-in', { kind: 'num', v, meta }), box('frac-in', { kind: 'den', v, meta }));
    return ctx.asBase ? paren(f, true) : f;
}

function qHtml(v, wrapNeg) {
    const neg = v.n < 0n, a = neg ? -v.n : v.n;
    if (v.d === 1n) {
        const s = intTxt(v.n);
        return neg && wrapNeg ? paren(s, false) : s;
    }
    const f = neg ? `<span class="row"><span class="sg">${MINUS}</span>${fracHtml(a, v.d)}</span>` : fracHtml(a, v.d);
    return neg && wrapNeg ? paren(f, true) : f;
}

function render(n, ctx = {}) {
    const top = TOP; TOP = false;
    let inner;
    const d = DRAG && DRAG.get(n);
    if (d && d.kind === 'pow') {
        inner = termHtml(d.id, d.id, 'pow', d.m, renderRaw(n, ctx), `${T(n)}. Drag it across the fraction bar, or press Enter.`);
    } else if (d && d.kind === 'fracpow') {
        const L = litVal(n.b), neg = L.n < 0n, a = neg ? -L.n : L.n;
        const top = termHtml(`${d.id}t`, `${d.id}d`, 'fbase', d.m, `${a}`, `${a}, the top of the fraction. Drag it to the bottom, or press Enter.`);
        const bot = termHtml(`${d.id}b`, `${d.id}n`, 'fbase', d.m, `${L.d}`, `${L.d}, the bottom of the fraction. Drag it to the top, or press Enter.`);
        const f = `<span class="row">${neg ? `<span class="sg">${MINUS}</span>` : ''}${fracHtml(top, bot)}</span>`;
        inner = `<span class="pw"><span class="row">${paren(f, true)}</span>${expHtml(n.e)}</span>`;
    } else {
        TOP = top;
        inner = renderRaw(n, ctx);
        TOP = false;
    }
    if (HL && HL.has(n)) return `<span class="hl" data-m="${HL.get(n)}">${inner}</span>`;
    return inner;
}

/* a whole line of work, with its top-level pieces marked */
function renderLine(n, ctx = {}) { TOP = true; const h = render(n, ctx); TOP = false; return h; }

function renderRaw(n, ctx = {}) {
    const top = TOP; TOP = false;
    switch (n.t) {
        case 'hole':
            if (HOLES) return holeHtml(n.x.v, ctx, n.meta);
            return render(n.x, ctx);
        case 'xs': {
            if (!HOLES) return render(n.x, ctx);
            if (XSMODE === 'result') {
                const tp = n.top.reduce((a, b) => a * b, 1), bp = n.bot.reduce((a, b) => a * b, 1);
                const inp = id => `<input class="ans-input xsin" id="${id}" inputmode="numeric" autocomplete="off" spellcheck="false">`;
                const body = bp === 1 ? inp('xr-n') : fracHtml(inp('xr-n'), inp('xr-d'));
                XSL.push({ m: n.m, cm: n.cm, node: n, tp, bp });
                return `<span class="row xres">${n.neg ? `<span class="sg">${MINUS}</span>` : ''}${body}</span>`;
            }
            XSL.push({ m: n.m, cm: n.cm, node: n });
            const cells = n.tops.map((a, i) => {
                const t = `<span class="xstack xt" id="xt-${i}"><span class="xv">${a}</span></span>`;
                if (n.bots[i] === 1) return `<span class="xcell">${t}</span>`;
                const b = `<span class="xstack xb" id="xb-${i}"><span class="xv">${n.bots[i]}</span></span>`;
                return `<span class="xcell">${fracHtml(t, b)}</span>`;
            });
            return `<span class="row xs" data-xs="${n.m}">${n.neg ? `<span class="sg">${MINUS}</span>` : ''}${cells.join('<span class="op">×</span>')}</span>`;
        }
        case 'slot':
            if (SLOTS) return slotHtml(n.id ? `${n.m}${n.id}` : `${n.m}`, n.m, n.hide ? ' data-hide="1"' : '');
            return render(n.x, ctx);
        case 'scaf':
            if (SLOTS) return `<span class="fr scaffold"><span class="fn">${render(n.x)}</span><span class="fd">1</span></span>`;
            return render(n.x, ctx);
        case 'fslot': {
            if (!SLOTS) return render(n.x, ctx);
            const id = `${n.m}${n.id}`, neg = n.L.n < 0n;
            /* the top of the fraction becomes the bottom, so the bar is left over a 1
               exactly when the top was 1 */
            const one = (neg ? -n.L.n : n.L.n) === 1n;
            const f = fracHtml(slotHtml(`${id}n`, n.m, ` data-blk="${id}"`), slotHtml(`${id}d`, n.m, ` data-blk="${id}"`))
                .replace('<span class="fr">', `<span class="fr" id="fr-${id}"${one ? ' data-one="1"' : ''}>`);
            const base = paren(`<span class="row">${neg ? `<span class="sg">${MINUS}</span>` : ''}${f}</span>`, true);
            const ex = `<span class="ex flipx" id="fx-${id}"${n.e === 1 ? ' data-hide="1"' : ''}><span class="exp-sign neg">${MINUS}</span><span class="exp-num neg">${n.e}</span></span>`;
            return `<span class="pw"><span class="row">${base}</span>${ex}</span>`;
        }
        case 'q': {
            if (ctx.asBase) {
                if (n.v.d === 1n && n.v.n >= 0n) return intTxt(n.v.n);
                return paren(qHtml(n.v, false), n.v.d !== 1n);
            }
            return qHtml(n.v, ctx.wrapNeg);
        }
        case 'rq': {
            const neg = n.n < 0n, a = neg ? -n.n : n.n;
            const f = fracHtml(`${a}`, `${n.d}`);
            const body = neg ? `<span class="row"><span class="sg">${MINUS}</span>${f}</span>` : f;
            return neg && (ctx.wrapNeg || ctx.asBase) ? paren(body, true) : body;
        }
        case 'grp': return paren(render(n.x), hasStack(n.x));
        case 'pow': {
            const base = n.b.t === 'q' || n.b.t === 'grp' || n.b.t === 'hole' || n.b.t === 'slot'
                ? render(n.b, { asBase: true })
                : paren(render(n.b), hasStack(n.b));
            return `<span class="pw"><span class="row">${base}</span>${expHtml(n.e, n.eh, HLE ? HLE.get(n) : undefined)}</span>`;
        }
        case 'over':
            if (HLO && HLO.has(n)) return fracHtml(render(n.a), render(n.b)).replace('<span class="fr">', `<span class="fr hlbar" data-m="${HLO.get(n)}">`);
            return fracHtml(render(n.a), render(n.b));
        case 'bin': {
            const p = prec(n);
            const side = (c, right) => {
                const cp = prec(c);
                const needs = cp < p || (right && cp === p && (n.op === '−' || n.op === '÷'));
                return needs ? paren(render(c), hasStack(c)) : render(c, { wrapNeg: right });
            };
            const litOp = HLO && HLO.has(n) ? ` hl hlop" data-m="${HLO.get(n)}` : '';
            const L = side(n.a, false);
            const OP = `<span class="op${n.op === "·" ? " dot" : ""}${litOp}">${n.op}</span>`;
            const Rt = side(n.b, true);
            return `<span class="row">${top ? partHtml(0, L) + partHtml(1, OP) + partHtml(2, Rt) : L + OP + Rt}</span>`;
        }
        case 'jx': {
            let out = '';
            const piece = [];
            n.items.forEach((it, i) => {
                const before = out;
                if (i === 0) out += render(it);
                else if (it.t === 'grp') out += render(it);
                else if (it.t === 'hole' && it.x.t === 'q' && it.x.v.d === 1n) out += paren(render(it), false);
                else if (it.t === 'slot' && SLOTS) out += paren(render(it), false);
                else if (it.t === 'pow' && (n.items[i - 1].t === 'grp' || !(it.b.t === 'q' && it.b.v.d === 1n && it.b.v.n >= 0n))) out += render(it);
                else out += paren(render(it), hasStack(it));
                piece.push(out.slice(before.length));
            });
            return `<span class="row jx">${top ? piece.map((h, i) => partHtml(i, h)).join('') : out}</span>`;
        }
    }
}

function mixedHtml(v) {
    const neg = v.n < 0n, a = neg ? -v.n : v.n;
    return `<span class="row">${neg ? MINUS : ''}${a / v.d}<span class="gap"></span>${fracHtml(a % v.d, v.d)}</span>`;
}

/* ============================================================
   Solving: the chain of steps
   ============================================================ */
function solve(expr) {
    const steps = [{ node: expr, html: renderLine(expr), moves: [] }];
    let cur = expr, guard = 0;
    while (litVal(cur) === null || cur.t === 'grp') {
        if (cur.t === 'grp') { cur = cur.x; continue; }
        // a whole number plus a fraction less than 1 is already a mixed number: write it that way and stop
        if (cur.t === 'bin' && cur.op === '+') {
            const A = litVal(cur.a), Bv = litVal(cur.b);
            const whole = x => x && x.d === 1n && x.n > 0n;
            const part = x => x && x.d !== 1n && x.n > 0n && x.n < x.d;
            if ((whole(A) && part(Bv)) || (part(A) && whole(Bv))) {
                const v = rAdd(A, Bv);
                steps.push({ direct: true, html: mixedHtml(v), moves: [], prevHtml: steps[steps.length - 1].html });
                return { steps, value: v };
            }
        }
        MOVES = [];
        HOLD = LAWS;
        let next = step(cur);
        let moves = MOVES;
        if (HOLD && !moves.length) { MOVES = []; HOLD = false; next = step(cur); moves = MOVES; }
        if (moves.length > 1 && moves.some(m => m.cancel)) {
            MOVES = []; DEFER = true;
            next = step(cur);
            moves = MOVES; DEFER = false;
        }
        MOVES = null;
        HOLD = false;
        const html = renderLine(next);
        if (html !== steps[steps.length - 1].html) {
            HL = new Map(moves.filter(m => !m.lightExp).map(m => [m.src, m.idx]));
            HLE = new Map(moves.flatMap(m => (m.lightExp || []).map(p => [p, m.idx])));
            HLO = new Map(moves.flatMap(m => [m.lightOp, m.lightBar].filter(Boolean).map(x => [x, m.idx])));
            DRAG = new Map(moves.flatMap(m => (m.sources || []).map(sp => [sp.node, sp])));
            const prevHtml = renderLine(cur);
            HL = null;
            HLE = null;
            HLO = null;
            DRAG = null;
            steps.push({ node: next, html, moves, prevHtml });
        }
        cur = unhole(next);
        if (++guard > 40) throw new Error('did not finish');
    }
    const v = litVal(cur);
    const abs = v.n < 0n ? -v.n : v.n;
    if (v.d !== 1n && abs > v.d) {
        const m = { idx: 0, src: cur, rule: 'Last thing: write the improper fraction as a mixed number.', seq: 0 };
        HL = new Map([[cur, 0]]);
        const prevHtml = renderLine(cur);
        HL = null;
        steps.push({ mixed: v, html: mixedHtml(v), moves: [m], prevHtml });
    }
    return { steps, value: v };
}

/* the line under a cross-cancel line: the rest of the expression as it was, with boxes where the product goes */
function xsResultLine(st) {
    HOLES = []; SLOTS = []; XSL = []; XSMODE = 'result';
    const html = renderLine(st.node);
    const info = XSL[0];
    HOLES = null; SLOTS = null; XSL = null; XSMODE = 'board';
    return { html, info };
}

/* the step drawn with its boxes; the boxes are grouped into questions, asked left to right */
function liveStep(st) {
    HOLES = [];
    SLOTS = [];
    XSL = [];
    let html;
    if (st.mixed) {
        const v = st.mixed, neg = v.n < 0n, a = neg ? -v.n : v.n, m = st.moves[0];
        const whole = a / v.d;
        const wAsk = { m, seq: 0, q: `${a} ÷ ${v.d} = ?  (whole number)`, nudge: `${v.d} × ? ≤ ${a}` };
        const fAsk = { m, seq: 1, q: `${a} − ${v.d * whole} = ?  over ${v.d}`, nudge: `${a} − ${v.d * whole}` };
        const w = box('val-in', { kind: 'int', v: Number((neg ? -1n : 1n) * whole), meta: wAsk });
        const r = R(a % v.d, v.d);
        html = `<span class="row mixed">${w}${fracHtml(box('frac-in', { kind: 'num', v: r, meta: fAsk }), box('frac-in', { kind: 'den', v: r, meta: fAsk }))}</span>`;
    } else if (st.direct) {
        html = st.html;
    } else {
        html = renderLine(st.node);
    }
    const holes = HOLES, slots = SLOTS, boards = XSL;
    HOLES = null;
    SLOTS = null;
    XSL = null;
    const units = [];
    holes.forEach((h, i) => {
        let u = units.find(u => u.meta === h.meta);
        if (!u) { u = { type: 'box', meta: h.meta, idx: [] }; units.push(u); }
        u.idx.push(i);
    });
    (st.moves || []).filter(m => m.drag).forEach(m => {
        units.push({ type: 'drag', meta: m.drag, slots: slots.filter(sl => sl.m === m.idx).map(sl => sl.id) });
    });
    boards.forEach(bd => units.push({ type: 'cancel', meta: bd.cm, idx: [], node: bd.node }));
    units.sort((a, b) => (a.meta.m.idx - b.meta.m.idx) || (a.meta.seq - b.meta.seq));
    return { html, holes, units };
}

/* ============================================================
   Problem families, one for each kind on the handout
   ============================================================ */
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const gcdN = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
const coprimeBelow = b => { let a; do { a = ri(1, b - 1); } while (gcdN(a, b) !== 1); return a; };
const distinctExp = (lo, hi, not) => { let e; do { e = ri(lo, hi); } while (e === not); return e; };

const LAW_CAP = { 2: 8, 3: 5, 4: 4, 5: 3, 6: 3, 7: 2, 10: 3 };
const lawBase = () => pick([2, 2, 3, 3, 4, 5, 6, 7, 10]);
/* the power the problem ends on: not 0, and small enough to work out */
const lawOk = (b, net) => net !== 0 && Math.abs(net) <= LAW_CAP[b];

const FAMILIES = [
    { name: 'Differences, a quotient, and a zero power', make() {
        const x = ri(2, 4), y = pick([x, x, 1, 2, 3]);
        const d1 = ri(1, 6), d2 = ri(1, 6);
        const diff = (v, s) => B('−', Q(v + s), Q(s));
        const e1 = ri(2, 3);
        /* the two differences often come out equal on purpose, so that the same-base
           rule has something to bite on.  When they do, the exponents must not also
           match: x²/x² is a quotient that is only ever 1, and subtracting 2 from 2
           teaches nothing. */
        const e2 = y === x ? distinctExp(1, 2, e1) : ri(1, 2);
        const top = P(diff(x, d1), e1), bot = P(diff(y, d2), e2);
        return B(pick(['+', '+', '−']), B('×', O(top, bot), P(Q(ri(2, 5)), -ri(1, 3))), P(Q(ri(2, 12)), 0));
    } },
    { name: 'A fraction plus a zero power', make() {
        const b = ri(3, 20), a = coprimeBelow(b);
        const inner = O(P(Q(ri(2, 9)), -ri(2, 8)), P(Q(ri(2, 9)), -ri(2, 8)));
        return B(pick(['+', '+', '−']), P(Q(a, b), 1), P(inner, 0));
    } },
    { name: 'One over a negative power', make() {
        const a = ri(2, 6), k = a > 4 ? ri(1, 2) : ri(1, 3);
        return B('+', O(Q(1), P(G(Q(a)), -k)), J(Q(ri(2, 9)), P(P(Q(ri(2, 6)), -ri(2, 4)), 0)));
    } },
    { name: 'Negative fraction base plus a power of a power', make() {
        const a = ri(2, 5), k = a > 3 ? 2 : ri(2, 4);
        const inner = Math.random() < 0.7 ? P(P(Q(ri(2, 5)), -ri(1, 3)), 1) : P(P(Q(ri(2, 4)), ri(2, 3)), -1);
        return B('+', P(Q(-1, a), -k), inner);
    } },
    { name: 'Power of a power plus a fraction to a negative power', make() {
        const p = ri(2, 3), m = ri(1, p === 2 ? 4 : 2), n = ri(1, 2);
        const b = ri(2, 6), a = Math.random() < 0.7 ? 1 : coprimeBelow(b);
        return B(pick(['+', '+', '−']), P(P(Q(p), -m), -n), P(Q(a, b), -ri(1, 3)));
    } },
    { name: 'Same exponent, multiplied', make() {
        const b = ri(2, 9), a = pick([coprimeBelow(b), ri(2, 7)]);
        if (gcdN(a, b) !== 1) return null;
        const k = ri(1, 3), op = pick(['·', '×']);
        const c = pick([b, b, 1]) === 1 ? b * ri(2, 3) : b;
        if (a === 1 && c === b) return null;
        return B(op, P(Q(a, b), -k), P(Q(c), -k));
    } },
    { name: 'A coefficient times a negative power', make() {
        return B('·', Q(pick([-1, 1]) * ri(2, 9)), P(Q(ri(2, 5)), -ri(1, 4)));
    } },
    { name: 'A product of powers', make() {
        const r = ri(2, 4), e1 = ri(1, 4), e2 = distinctExp(1, 4, e1);
        return J(Q(ri(2, 5)), G(P(Q(ri(2, 7)), 1)), G(P(Q(ri(2, 5)), -ri(1, 3))), G(O(P(Q(r), -e1), P(Q(r), -e2))));
    } },
    { name: 'Same base, divided', make() {
        const b = ri(3, 9), a = coprimeBelow(b);
        const m = ri(1, 7), n = m + pick([1, 2, 2, 3, -1, -2]);
        if (n < 1) return null;
        return B('÷', P(Q(a, b), m), P(Q(a, b), n));
    } },
    { name: 'One over a negative power, squared', make() {
        const p = ri(2, 4), k = ri(1, 3), m = ri(1, 3);
        return P(O(Q(1), P(Q(p), -k)), m);
    } },
    { name: 'Negative fraction base times a power', make() {
        const a = ri(2, 4), k = ri(2, 3);
        return B('·', P(Q(-1, a), -k), P(P(Q(pick([a, a, 2, 3, 5])), -ri(1, 3)), 1));
    } },
    { name: 'Power of a power plus a quotient', make() {
        const q = ri(2, 4);
        return B('+', P(P(Q(ri(2, 3)), -ri(1, 2)), -ri(1, 2)), O(P(Q(q), ri(1, 2)), P(Q(q), -ri(1, 2))));
    } },
    { name: 'One over a negative power, times a power', make() {
        const p = ri(2, 5), k = ri(1, 3);
        const q = pick([p * p, p * p, p, ri(2, 9)]), m = ri(1, 2);
        return B('·', O(Q(1), P(Q(p), -k)), P(Q(q), -m));
    } },
    /* ---------- laws of exponents: one base all the way through ----------
       The answers are kept small enough to work out by hand: the power left at the
       end never goes past about 250 (2⁸, 3⁵, 4⁴, 5³, 6³). */
    { name: 'Same base in parentheses, raised to a power', laws: true, make() {
        const b = lawBase(), m = -ri(2, 6), k = pick([2, 2, 3, -1, -2]);
        if (!lawOk(b, (1 + m) * k)) return null;
        const inner = Math.random() < 0.7 ? B('×', Q(b), P(Q(b), m)) : B('×', P(Q(b), m), Q(b));
        return P(G(inner), k);
    } },
    { name: 'A power over a product with a zero power', laws: true, make() {
        const b = lawBase(), a = ri(1, 5), c = -ri(1, 4);
        if (!lawOk(b, a - c)) return null;
        const bot = Math.random() < 0.7 ? B('×', P(Q(b), 0), P(Q(b), c)) : B('×', P(Q(b), c), P(Q(b), 0));
        return O(P(Q(b), a), bot);
    } },
    { name: 'A quotient of powers, raised to a power', laws: true, make() {
        const b = lawBase(), a = ri(-7, 7), c = ri(-7, 7), k = pick([2, 3, 4, -1, -2, -3, -4, -6]);
        if (a === 0 || c === 0 || a === c || (a > 0 && c > 0)) return null;
        if (!lawOk(b, (a - c) * k)) return null;
        return P(O(P(Q(b), a), P(Q(b), c)), k);
    } },
    { name: 'A zero power or a bare base in a quotient, raised to a power', laws: true, make() {
        const b = lawBase(), c = -ri(1, 4), k = pick([2, 3, 4, -2, -3]);
        const v = ri(0, 2);
        const expr = v === 0 ? O(P(Q(b), 0), P(Q(b), c))
            : v === 1 ? O(P(Q(b), c), Q(b))
            : O(Q(b), P(Q(b), c));
        const net = (v === 0 ? -c : v === 1 ? c - 1 : 1 - c) * k;
        if (!lawOk(b, net)) return null;
        return P(expr, k);
    } },
    { name: 'A power of a power times the same base', laws: true, make() {
        const b = lawBase(), a = ri(2, 5), c = -ri(1, 3), d = pick([a, a, ri(1, 7)]);
        if (!lawOk(b, a * c + d)) return null;
        const pp = P(P(Q(b), a), c), q = P(Q(b), d);
        return Math.random() < 0.8 ? B('×', pp, q) : B('×', q, pp);
    } },
    { name: 'A power of a power in a quotient', laws: true, make() {
        const b = lawBase(), a = ri(-5, 5), c = pick([2, 3, 4, 5, 6, -2]), d = pick([-1, -1, -2]);
        if (a === 0) return null;
        const up = Math.random() < 0.5;
        if (!lawOk(b, up ? c * d - a : a - c * d)) return null;
        return up ? O(P(P(Q(b), c), d), P(Q(b), a)) : O(P(Q(b), a), P(P(Q(b), c), d));
    } },
    { name: 'A power times a quotient of powers', laws: true, make() {
        const b = lawBase(), a = -ri(1, 6), c = ri(1, 7), d = -ri(1, 7);
        if (!lawOk(b, a + c - d)) return null;
        return B('·', P(Q(b), a), O(P(Q(b), c), P(Q(b), d)));
    } },
    /* ---------- more one-base shapes, after the practice sheet ----------
       (3⁻⁶ × 3³)⁻¹, 4⁻¹ × (4⁻³)⁻¹, (4⁰)⁻² / 4², 5² × 5⁶ / 5⁻⁶ -- same shapes, fresh numbers */
    { name: 'Two powers in parentheses, raised to a power', laws: true, make() {
        const b = lawBase(), m = -ri(2, 7), n = ri(2, 5), k = pick([-1, -1, -2, 2, 3]);
        if (m + n === 0 || !lawOk(b, (m + n) * k)) return null;
        const inner = Math.random() < 0.6 ? B('×', P(Q(b), m), P(Q(b), n)) : B('×', P(Q(b), n), P(Q(b), m));
        return P(G(inner), k);
    } },
    { name: 'A power times a negative power of a negative power', laws: true, make() {
        const b = lawBase(), a = pick([-1, -1, -2, -3, 2]), c = -ri(1, 4), d = pick([-1, -1, -2]);
        if (!lawOk(b, a + c * d)) return null;
        return B('×', P(Q(b), a), P(G(P(Q(b), c)), d));
    } },
    { name: 'A raised zero power over a power', laws: true, make() {
        const b = lawBase(), k = pick([2, 3, 4, 5]), a = pick([1, 2, 2, 3, -1, -2]);
        if (!lawOk(b, -a)) return null;
        return O(P(G(P(Q(b), 0)), k), P(Q(b), a));
    } },
    { name: 'A power times a quotient with a negative bottom', laws: true, make() {
        const b = lawBase(), a = ri(2, 3), c = ri(-3, 6), d = -ri(1, 6);
        if (c === 0 || c === 1 || !lawOk(b, a + c - d)) return null;
        return B('×', P(Q(b), a), O(P(Q(b), c), P(Q(b), d)));
    } },
    { name: 'A zero power in a product', make() {
        const p = ri(2, 3), k = ri(2, p === 2 ? 6 : 4);
        const c = pick([p ** ri(1, 3), ri(2, 12)]);
        return J(Q(c), G(P(Q(ri(2, 20)), 0)), P(Q(p), -k));
    } }
];

function newProblem(avoid) {
    for (let tries = 0; tries < 200; tries++) {
        const fi = Math.floor(Math.random() * FAMILIES.length);
        if (fi === avoid) continue;
        /* the laws families throw away answers too big to work out by hand, so they
           get a few more tries rather than losing their turn to another family */
        let expr = null;
        for (let k = 0; !expr && k < (FAMILIES[fi].laws ? 80 : 1); k++) expr = FAMILIES[fi].make();
        if (!expr) continue;
        const v = evalNode(expr);
        const big = x => (x < 0n ? -x : x) > 2000n;
        if (big(v.n) || big(v.d)) continue;
        LAWS = !!FAMILIES[fi].laws;
        let sol;
        try { sol = solve(expr); } finally { LAWS = false; HOLD = false; }
        if (!rEq(sol.value, v)) throw new Error('solver mismatch');
        return { family: fi, expr, html: render(expr), value: v, steps: sol.steps };
    }
}




function createExprDrill(root, opts) {
    opts = opts || {};

    const MARKUP = `
        <header class="top">
            <span class="ptitle" id="ptitle">Problem 1</span>
            <aside class="coach off" id="coach">
                <div class="coach-rule" id="coach-rule"></div>
                <div class="coach-ask" id="coach-ask"></div>
            </aside>
        </header>

        <div class="qwrap">
            <div class="card">
                <div class="chain" id="chain"></div>
                <div class="feedback" id="feedback"></div>
                <div class="action-container">
                    <button class="check-btn off" id="check-btn">Check</button>
                    <button class="next-btn off" id="next-btn">Next &rsaquo;</button>
                </div>
            </div>
        </div>`;

    root.innerHTML = MARKUP;

    let localCount = 0;
    function nextNumber() { return opts.number ? opts.number() : ++localCount; }
    function isVisible() { return !root.classList.contains('hidden'); }
    function advance() { if (opts.onNext) opts.onNext(); else freshProblem(); }

/* ============================================================
   State
   ============================================================ */
let prob = null;        // the current problem
let stepIdx = 0;        // which step the student is filling in
let live = null;        // { el, holes } for that step
let revealed = false;   // "Show me this step" was used on this step
let finished = false;
let history = [];       // problems seen, so Back works
let pos = -1;
let count = 0;
let timers = [];
let dragging = null;

const $ = id => root.querySelector('#' + id);
const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };

function say(msg, cls) { const f = $('feedback'); f.textContent = msg; f.className = `feedback ${cls || ''}`; }

/* ---------- kind of problem ---------- */
function makeProblem() {
    return newProblem(prob ? prob.family : -1);
}

/* ============================================================
   Loading a problem
   ============================================================ */
function show(p) {
    timers.forEach(clearTimeout);
    timers = [];
    prob = p;
    finished = false;
    pending = '';
    $('chain').innerHTML = `<span class="eq"></span><span class="step" id="s0">${p.steps[0].html}</span>`;
    alignParts();
    $('chain').scrollTop = 0;
    $('next-btn').classList.add('off');
    $('check-btn').classList.add('off');
    
    say('', '');
    coach('', '', false);
    /* the problem gets a beat on its own -- nothing lit, nothing asked -- before the
       first step opens underneath it */
    live = null;
    opening = true;
    later(beginSolving, READ_PAUSE);
}

/* how long the problem sits by itself, and the way out of it for anyone who has
   already read it and wants to get on with it */
const READ_PAUSE = 2000;
let opening = false;
function beginSolving() {
    if (!opening) return;
    opening = false;
    openStep(1);
}

function freshProblem() {
    const p = makeProblem();
    p.number = ++count;
    $('ptitle').textContent = nextNumber();
    history = history.slice(0, pos + 1);
    history.push(p);
    pos = history.length - 1;
    show(p);
}

// steps two or more lines above the new one fade back, so the eye stays on the last line and the new one
function fadeOld() {
    const c = $('chain');
    const steps = [...c.querySelectorAll('.step')];
    const eqs = [...c.querySelectorAll('.eq')];
    steps.forEach((s, i) => {
        const old = i < steps.length - 2;
        s.classList.toggle('past', old);
        eqs[i].classList.toggle('past', old);
    });
}

/* ---------- lining the lines up ----------
   Corresponding pieces of the expression are given the same width on every line, so a
   piece is written directly under the piece it came from.  Widths are kept per problem
   and only ever grow, so a line already on the page never shuffles back to the left.
   They are measured and set in em, because a line that has faded back is drawn smaller
   and has to keep its own proportions rather than be stretched to a full-size line's.
   offsetWidth, not the bounding rect, so a line still animating in is not measured
   through its scale transform. */
function alignParts() {
    if (!prob) return;
    const w = prob.partW || (prob.partW = {});
    const parts = [...$('chain').querySelectorAll('.part')];
    if (!parts.length) return;
    parts.forEach(p => { p.style.minWidth = ''; });
    parts.forEach(p => {
        /* a line that has faded back is drawn at 72%, but the padding inside a fraction
           is set in px and does not shrink with it -- so that line measures wider in em
           than it really is.  Only full-size lines are measured; every line is set. */
        if (p.closest('.step.past')) return;
        const em = parseFloat(getComputedStyle(p).fontSize) || 16;
        const n = p.offsetWidth / em;
        const k = p.dataset.p;
        if (n > 0 && !(w[k] >= n)) w[k] = n;
    });
    parts.forEach(p => {
        const v = w[p.dataset.p];
        if (v) p.style.minWidth = v.toFixed(3) + 'em';
    });
}

function appendStep(html, cls) {
    const c = $('chain');
    const eq = document.createElement('span');
    eq.className = 'eq';
    eq.textContent = '=';
    const st = document.createElement('span');
    st.className = `step ${cls || ''}`;
    st.innerHTML = html;
    c.append(eq, st);
    fadeOld();
    alignParts();
    requestAnimationFrame(() => { c.scrollTop = c.scrollHeight; });
    return st;
}

/* ============================================================
   One step at a time, one question at a time
   ============================================================ */
function coach(rule, ask, calm) {
    $('coach-rule').textContent = rule || '';
    $('coach-ask').textContent = ask || '';
    $('coach').classList.toggle('calm', !!calm);
    /* nothing to say: the note goes away rather than sitting there empty */
    $('coach').classList.toggle('off', !rule && !ask);
}

function lightMove(prevEl, idx) {
    prevEl.querySelectorAll('.hl, .hlbar').forEach(h => h.classList.toggle('on', idx === 'all' || +h.dataset.m === idx));
}

function openStep(i) {
    stepIdx = i;
    const st = prob.steps[i];
    const steps = $('chain').querySelectorAll('.step');
    const prevEl = steps[steps.length - 1];
    prevEl.innerHTML = st.prevHtml;
    alignParts();
    const L = liveStep(st);

    // a rewrite with nothing to fill in: show it, say why, move on
    if (!L.units.length) {
        lightMove(prevEl, 'all');
        /* a rewrite worth naming says what it is while the line it rewrites is still
           the last one on screen, and holds there long enough to be read */
        const said = (st.moves || []).map(mo => mo.tip).find(Boolean) || '';
        const hold = (st.moves || []).reduce((h, mo) => Math.max(h, mo.hold || 0), 0) || 900;
        /* the note carries the name of the rewrite, or disappears if it has no name --
           the bare arrow that used to sit here meant something in a banner over the
           work, but nothing tucked away in the corner */
        coach('', said, false);
        const last = i === prob.steps.length - 1;
        later(() => {
            appendStep(st.html, last ? 'final pop' : 'pop');
            if (last) { finish(); return; }
            later(() => { lightMove(prevEl, -1); openStep(i + 1); }, 1600);
        }, hold);
        return;
    }

    const el = appendStep(L.html, 'pop');
    live = { el, prevEl, holes: L.holes, units: L.units, unit: 0, boxes: [...el.querySelectorAll('input')], xs: null };
    wireBoxes();
    prevEl.querySelectorAll('.term.src').forEach(t => {
        t.addEventListener('pointerdown', onPointerDown);
        t.addEventListener('keydown', onTermKey);
    });
    askUnit(0);
}

function askUnit(k) {
    live.unit = k;
    revealed = false;
    const u = live.units[k];
    const m = u.meta.m.idx;
    const isDrag = u.type === 'drag';

    // pieces that can be dragged right now, and the spots they can land in
    live.prevEl.querySelectorAll('.term.src').forEach(t => {
        const mine = isDrag && +t.dataset.m === m && !t.classList.contains('used');
        t.classList.toggle('live', mine);
        t.tabIndex = mine ? 0 : -1;
    });
    live.el.querySelectorAll('.drop-slot').forEach(s => {
        const mine = isDrag && +s.dataset.m === m;
        s.classList.toggle('ready', mine && !s.classList.contains('filled'));
        s.classList.toggle('wait', !mine && !s.classList.contains('filled'));
    });

    live.el.querySelectorAll('.xs').forEach(bd => bd.classList.remove('armed'));
    if (u.type === 'cancel') {
        live.boxes.forEach(b => {
            b.classList.remove('now');
            b.classList.toggle('wait', !b.classList.contains('done'));
            b.readOnly = true;
            b.tabIndex = -1;
        });
        lightMove(live.prevEl, m);
        $('check-btn').textContent = 'Check';
        $('check-btn').classList.remove('off');
        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
        const n = u.node;
        live.el.classList.add('xsline');
        const reuse = {};
        n.plan.forEach(p => { reuse['t' + p.i] = (reuse['t' + p.i] || 0) + 1; reuse['b' + p.j] = (reuse['b' + p.j] || 0) + 1; });
        if (Object.values(reuse).some(c => c > 1)) live.el.classList.add('deep');
        live.xs = { u, node: n, k: -1, top: n.tops.slice(), bot: n.bots.slice(), open: null, mul: null, miss: 0 };
        pending = '';
        nextPair();
        return;
    }

    if (isDrag) {
        live.boxes.forEach(b => {
            b.classList.remove('now');
            b.classList.toggle('wait', !b.classList.contains('done'));
            b.readOnly = true;
            b.tabIndex = -1;
        });
        lightMove(live.prevEl, m);
        const many = live.units.length > 1 ? `  (${k + 1} of ${live.units.length} in this step)` : '';
        coach(u.meta.m.tip || '', u.meta.q, false);
        $('check-btn').classList.add('off');
        
        
        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
        live.dragOpenedAt = Date.now();
        pending = '';
        return;
    }

    
    live.boxes.forEach((b, j) => {
        const mine = u.idx.includes(j);
        const done = b.classList.contains('done');
        b.classList.toggle('now', mine);
        b.classList.toggle('wait', !mine && !done);
        b.readOnly = !mine;
        b.tabIndex = mine ? 0 : -1;
        if (!mine && !done) b.placeholder = '';
    });
    lightMove(live.prevEl, u.meta.m.idx);
    coach(u.meta.tip || u.meta.m.tip || '', u.meta.q, false);
    $('check-btn').textContent = 'Check';
    $('check-btn').classList.remove('off');
    
    const first = live.boxes[u.idx[0]];
    first.focus({ preventScroll: true });
    if (pending) { first.value = pending; pending = ''; autoCheck(first); }
}

function wireBoxes() {
    live.boxes.forEach((inp, j) => {
        inp.addEventListener('input', () => { inp.classList.remove('wrong'); autoCheck(inp); });
        inp.addEventListener('focus', () => {
            // clicking a box that isn't being asked about sends you back to the one that is
            if (live && live.units[live.unit].type === 'drag') { inp.blur(); return; }
            if (live && !live.units[live.unit].idx.includes(j) && !inp.classList.contains('done')) {
                live.boxes[live.units[live.unit].idx[0]].focus();
            }
        });
        inp.addEventListener('keydown', e => {
            if (e.key !== 'Enter') return;
            e.preventDefault();
            if (!live || recentlyMoved()) return;
            const mine = live.units[live.unit].idx.map(x => live.boxes[x]);
            if (!mine.includes(inp) || mine.every(b => b.value.trim() === '')) return;
            const next = mine.slice(mine.indexOf(inp) + 1).find(b => b.value.trim() === '');
            if (next && inp.value.trim() !== '') next.focus();
            else checkStep();
        });
    });
}

/* the moment a box holds the right answer, move on without waiting for Enter or Check */
let lastAuto = 0;
let pending = '';   // keys typed in the short pause between steps go into the next box
document.addEventListener('keydown', e => {
    if (!isVisible() || live || finished || e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[0-9\-]$/.test(e.key)) { pending += e.key; e.preventDefault(); }
});
/* registered after the buffer above, so a digit typed during the pause is caught
   first and then carried into the box the step opens with */
document.addEventListener('keydown', () => { if (isVisible() && opening) beginSolving(); });
document.addEventListener('pointerdown', e => {
    if (!isVisible()) return;
    if (opening && !(e.target.closest && e.target.closest('button, select, input'))) beginSolving();
});
const recentlyMoved = () => Date.now() - lastAuto < 600;

function autoCheck(inp) {
    if (!live || finished) return;
    const u = live.units[live.unit];
    if (u.type === 'drag' || u.type === 'cancel') return;
    const j = live.boxes.indexOf(inp);
    if (!u.idx.includes(j)) return;
    const hole = live.holes[u.idx[0]];
    if (hole.kind === 'int') {
        if (intOf(inp.value) === hole.v) { lastAuto = Date.now(); passUnit(); }
        return;
    }
    const [nb, db] = u.idx.map(x => live.boxes[x]);
    const n = intOf(nb.value), d = intOf(db.value);
    if (n !== null && d !== null && BigInt(n) === hole.v.n && BigInt(d) === hole.v.d) { lastAuto = Date.now(); passUnit(); return; }
    // right top, empty bottom: hop down to the bottom box
    if (inp === nb && n !== null && BigInt(n) === hole.v.n && db.value.trim() === '') db.focus();
}

const intOf = s => { s = s.trim().replace(/[\u2212\u2013]/g, '-'); return /^-?\d+$/.test(s) ? parseInt(s, 10) : null; };

function checkStep() {
    if (!live || finished) return;
    const u = live.units[live.unit];
    if (u.type === 'drag') { say(u.meta.q, 'nudge'); return; }
    if (u.type === 'cancel') {
        const X = live.xs;
        const inp = X && [...(X.open ? [X.open.ti, X.open.bi] : []), ...(X.mul ? [X.mul.nIn, X.mul.dIn] : [])].find(i => i && !i.disabled);
        if (inp) xsWrong(inp, true);
        return;
    }
    const boxes = u.idx.map(j => live.boxes[j]);
    const hole = live.holes[u.idx[0]];
    let wrong = [], msg = null;

    if (boxes.some(b => b.value.trim() === '')) {
        wrong = boxes.filter(b => b.value.trim() === '');
        msg = '✎';
    } else if (hole.kind === 'int') {
        const v = intOf(boxes[0].value);
        if (v === null) { wrong = boxes; msg = '123'; }
        else if (v !== hole.v) { wrong = boxes; }
    } else {
        const n = intOf(boxes[0].value), d = intOf(boxes[1].value), want = hole.v;
        if (n === null || d === null || d === 0) { wrong = boxes; msg = '▢ / ▢'; }
        else {
            const got = R(n, d);
            if (!rEq(got, want)) wrong = boxes;
            else if (d < 0) { wrong = [boxes[1]]; msg = '− on top'; }
            else if (BigInt(n) !== want.n || BigInt(d) !== want.d) { wrong = boxes; msg = 'Simplify'; }
        }
    }

    if (!wrong.length) { passUnit(); return; }
    boxes.forEach(b => b.classList.toggle('wrong', wrong.includes(b)));
    live.el.classList.remove('shake');
    void live.el.offsetWidth;
    live.el.classList.add('shake');
    say(msg || `✗   ${u.meta.nudge}`, 'nudge');
    wrong[0].select();
}

function passUnit() {
    const u = live.units[live.unit];
    if (u.type === 'drag' || u.type === 'cancel') u.idx = [];
    u.idx.forEach(j => {
        const b = live.boxes[j];
        b.classList.remove('now', 'wrong', 'shown');
        b.classList.add('done');
        b.readOnly = true;
        b.tabIndex = -1;
    });
    if (live.unit < live.units.length - 1) {
        if (u.type !== 'drag') say('✓', 'correct');
        askUnit(live.unit + 1);
        return;
    }
    passStep();
}

function passStep() {
    const i = stepIdx;
    const last = i === prob.steps.length - 1;
    live.prevEl.innerHTML = prob.steps[i - 1].html;
    if (live.xs && live.xs.resLine) {
        live.el.querySelectorAll('.lit').forEach(e => e.classList.remove('lit'));
        live.el.querySelectorAll('input').forEach(e => { e.disabled = true; });
        live.el = live.xs.resLine;
    }
    live.el.innerHTML = prob.steps[i].html;
    alignParts();
    live.el.classList.remove('shake', 'pop');
    void live.el.offsetWidth;
    live.el.classList.add('pop');
    live = null;
    $('check-btn').classList.add('off');
    
    if (last) { finish(); return; }
    say('✓', 'correct');
    coach('', '✓', true);
    later(() => openStep(i + 1), 650);
}

function finish() {
    finished = true;
    const steps = $('chain').querySelectorAll('.step');
    steps[steps.length - 1].classList.add('final');
    steps.forEach(s => s.classList.remove('past'));
    $('chain').querySelectorAll('.eq').forEach(e => e.classList.remove('past'));
    requestAnimationFrame(() => { $('chain').scrollTop = $('chain').scrollHeight; });
    if (prob.steps[prob.steps.length - 1].mixed && steps.length > 1) steps[steps.length - 2].classList.add('final');
    coach('', '✓', true);
    say('', '');
    $('check-btn').classList.add('off');
    
    $('next-btn').classList.remove('off');
    if (isVisible()) $('next-btn').focus({ preventScroll: true });
}

function showMe() {
    if (!live || finished) return;
    const u = live.units[live.unit];
    if (u.type === 'drag') {
        revealed = true;
        const left = [...live.prevEl.querySelectorAll('.term.src.live')];
        say('', '');
        left.forEach((t, k) => later(() => { if (!t.classList.contains('used')) placeTerm(t, t.getBoundingClientRect()); }, k * 650));
        return;
    }
    u.idx.forEach(j => {
        const h = live.holes[j], b = live.boxes[j];
        if (h.kind === 'int') b.value = String(h.v).replace('-', '−');
        else if (h.kind === 'num') b.value = String(h.v.n).replace('-', '−');
        else b.value = String(h.v.d);
        b.classList.remove('wrong');
        b.classList.add('shown');
    });
    revealed = true;
    say('', '');
    $('check-btn').textContent = 'Continue';
    $('check-btn').focus({ preventScroll: true });
}

/* ============================================================
   Cross cancelling
   ------------------------------------------------------------
   One pair at a time, chosen for the student and lit: a box above
   the top number for what is left of it, then a box below the
   bottom number.  Both divide by their greatest common factor.
   When no top and bottom share anything, the product is written
   on the next line: tops first, then bottoms.
   ============================================================ */
function xsStack(id) { return live.el.querySelector(`#${id}`); }
function xsCurrent(stack) {
    const boxes = [...stack.querySelectorAll('.xbox-wrap')];
    return boxes.length ? boxes[boxes.length - 1] : stack.querySelector('.xv');
}
function xsLit(els) {
    live.el.querySelectorAll('.lit').forEach(e => e.classList.remove('lit'));
    els.forEach(e => e && e.classList.add('lit'));
}
function xsAddBox(stack, label) {
    const k = stack.querySelectorAll('.xbox-wrap').length;
    const wrap = document.createElement('span');
    wrap.className = 'xbox-wrap';
    wrap.style.setProperty('--k', k);
    wrap.innerHTML = `<input class="cbox" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="${label}">`;
    stack.appendChild(wrap);
    const inp = wrap.querySelector('input');
    inp.addEventListener('input', () => { inp.classList.remove('wrong'); xsInput(inp); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (!recentlyMoved()) xsWrong(inp, true); } });
    return inp;
}

function nextPair() {
    const X = live.xs;
    X.k++;
    X.miss = 0;
    X.open = null;
    if (X.k >= X.node.plan.length) { later(xsMultiply, 250); return; }
    const p = X.node.plan[X.k];
    const tStack = xsStack(`xt-${p.i}`), bStack = xsStack(`xb-${p.j}`);
    const tVal = xsCurrent(tStack), bVal = xsCurrent(bStack);
    xsLit([tVal, bVal]);
    const ti = xsAddBox(tStack, `what is left of ${p.a}`);
    const bi = xsAddBox(bStack, `what is left of ${p.b}`);
    bi.disabled = true;
    X.open = { p, tVal, bVal, ti, bi };
    const what = X.node.lone ? 'Simplify' : 'Cross simplify';
    coach(X.node.plan.length > 1 ? `${what}  (${X.k + 1} of ${X.node.plan.length})` : what, `${p.a} and ${p.b}   ÷ same number`, false);
    requestAnimationFrame(() => { $('chain').scrollTop = $('chain').scrollHeight; });
    ti.focus({ preventScroll: true });
}

function xsExpect(inp) {
    const X = live.xs;
    if (X.open && inp === X.open.ti) return X.open.p.ra;
    if (X.open && inp === X.open.bi) return X.open.p.rb;
    if (X.mul && inp === X.mul.nIn) return X.mul.tp;
    if (X.mul && inp === X.mul.dIn) return X.mul.bp;
    return null;
}

function xsInput(inp) {
    if (!live || !live.xs || inp.disabled) return;
    const X = live.xs, want = xsExpect(inp);
    if (want === null) return;
    const v = intOf(inp.value);
    if (v === want) {
        inp.disabled = true;
        lastAuto = Date.now();
        X.miss = 0;
        say('✓', 'correct');
        if (X.open && inp === X.open.ti) {
            X.open.tVal.classList.add('struck');
            X.top[X.open.p.i] = want;
            X.open.bi.disabled = false;
            X.open.bi.focus({ preventScroll: true });
        } else if (X.open && inp === X.open.bi) {
            X.open.bVal.classList.add('struck');
            X.bot[X.open.p.j] = want;
            later(nextPair, 350);
        } else if (X.mul && inp === X.mul.nIn) {
            if (X.mul.dIn) xsAskBottoms();
            else later(() => passUnit(), 350);
        } else if (X.mul && inp === X.mul.dIn) {
            later(() => passUnit(), 350);
        }
        return;
    }
    // wait until enough digits are in before calling it wrong
    const typed = inp.value.trim().replace(/[\u2212-]/g, '');
    if (typed.length >= String(Math.abs(want)).length) xsWrong(inp, false);
}

function xsWrong(inp, asked) {
    const X = live.xs, want = xsExpect(inp);
    if (want === null || inp.disabled) return;
    if (intOf(inp.value) === want) { xsInput(inp); return; }
    if (inp.value.trim() === '') { if (asked) say('✎', 'nudge'); return; }
    X.miss++;
    inp.classList.add('wrong');
    inp.select();
    let msg;
    if (X.open) {
        const p = X.open.p, top = inp === X.open.ti;
        msg = X.miss < 2 ? `both ÷ ${p.g}` : `${top ? p.a : p.b} ÷ ${p.g} = ${want}`;
    } else {
        const top = inp === X.mul.nIn;
        if (X.node.lone) {
            msg = X.miss < 2 ? (top ? 'what is left above' : 'what is left below') : `${want}`;
        } else {
            const list = top ? X.top : X.node.bot.filter((b, i) => X.node.bots[i] !== 1);
            msg = X.miss < 2 ? (top ? 'tops ×' : 'bottoms ×') : `${list.join(' × ')} = ${want}`;
        }
    }
    say(`✗   ${msg}`, 'nudge');
}

function xsMultiply() {
    const X = live.xs;
    if (!live || !X) return;
    X.open = null;
    X.miss = 0;
    const r = xsResultLine(prob.steps[stepIdx]);
    const line = appendStep(r.html, 'pop');
    X.resLine = line;
    X.mul = { nIn: line.querySelector('#xr-n'), dIn: line.querySelector('#xr-d'), tp: r.info.tp, bp: r.info.bp };
    [X.mul.nIn, X.mul.dIn].forEach(inp => {
        if (!inp) return;
        inp.addEventListener('input', () => { inp.classList.remove('wrong'); xsInput(inp); });
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (!recentlyMoved()) xsWrong(inp, true); } });
    });
    if (X.mul.dIn) X.mul.dIn.disabled = true;
    xsLit(X.node.tops.map((_, i) => xsCurrent(xsStack(`xt-${i}`))));
    coach(X.node.lone ? 'Bring it down' : 'Multiply across',
        X.node.lone ? `${X.top[0]}${X.mul.dIn ? ` over ${X.bot[0]}` : ''}` : `${X.top.join(' × ')} = ?`, false);
    X.mul.nIn.focus({ preventScroll: true });
}

function xsAskBottoms() {
    const X = live.xs;
    X.miss = 0;
    const stacks = X.node.bots.map((b, i) => b === 1 ? null : xsStack(`xb-${i}`)).filter(Boolean);
    xsLit(stacks.map(xsCurrent));
    const list = X.node.bots.map((b, i) => b === 1 ? null : X.bot[i]).filter(v => v !== null);
    coach(X.node.lone ? 'Bring it down' : 'Multiply across',
        X.node.lone ? `${list[0]}` : `${list.join(' × ')} = ?`, false);
    X.mul.dIn.disabled = false;
    X.mul.dIn.focus({ preventScroll: true });
}

/* ============================================================
   Dragging a negative power across the bar
   ============================================================ */
function unitSlots() {
    if (!live) return [];
    const u = live.units[live.unit];
    if (u.type !== 'drag') return [];
    return u.slots.map(id => $(`slot-${id}`)).filter(Boolean);
}

// the open spot nearest the pointer, if the pointer is close enough to any
function hitSlot(x, y) {
    let best = null, bestD = Infinity;
    unitSlots().forEach(s => {
        if (s.classList.contains('filled')) return;
        const r = s.getBoundingClientRect();
        if (x < r.left - 24 || x > r.right + 24 || y < r.top - 24 || y > r.bottom + 24) return;
        const d = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2));
        if (d < bestD) { bestD = d; best = s; }
    });
    return best;
}

function onPointerDown(e) {
    const srcEl = e.currentTarget;
    if (!srcEl.classList.contains('live') || srcEl.classList.contains('used')) return;
    e.preventDefault();
    srcEl.focus({ preventScroll: true });
    if ($('feedback').classList.contains('nudge')) say('', '');

    const rect = srcEl.getBoundingClientRect();
    const ghost = srcEl.cloneNode(true);
    ghost.removeAttribute('id');
    ghost.classList.remove('live', 'src');
    ghost.classList.add('ghost');
    const cs = getComputedStyle(srcEl);
    ghost.style.fontSize = cs.fontSize;
    ghost.style.left = rect.left + 'px';
    ghost.style.top = rect.top + 'px';
    root.appendChild(ghost);

    dragging = { src: srcEl, ghost, dx: e.clientX - rect.left, dy: e.clientY - rect.top, moved: false };
    unitSlots().forEach(s => { if (!s.classList.contains('filled')) s.classList.add('armed'); });

    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);
}

function onPointerMove(e) {
    if (!dragging) return;
    dragging.moved = true;
    dragging.ghost.style.left = (e.clientX - dragging.dx) + 'px';
    dragging.ghost.style.top = (e.clientY - dragging.dy) + 'px';
    const over = hitSlot(e.clientX, e.clientY);
    unitSlots().forEach(s => s.classList.toggle('eligible', s === over));
}

function onPointerUp(e) {
    if (!dragging) return;
    const { src: srcEl, ghost, moved } = dragging;
    const rect = ghost.getBoundingClientRect();
    const over = hitSlot(e.clientX, e.clientY);

    window.removeEventListener('pointermove', onPointerMove);
    window.removeEventListener('pointerup', onPointerUp);
    window.removeEventListener('pointercancel', onPointerUp);
    unitSlots().forEach(s => s.classList.remove('armed', 'eligible'));
    ghost.remove();
    dragging = null;

    if (!moved) { say('✋ Drag', 'nudge'); return; }
    if (!over) return;
    if (over.id === srcEl.dataset.target) placeTerm(srcEl, rect);
    else bump(srcEl, live.units[live.unit].meta.nudge);
}

function bump(el, msg) {
    el.classList.add('shake');
    later(() => el.classList.remove('shake'), 400);
    say(msg, 'nudge');
}

function onTermKey(e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    const srcEl = e.currentTarget;
    // only a deliberate key press on a chip the student tabbed to moves it
    if (e.repeat || !live || Date.now() - (live.dragOpenedAt || 0) < 1000) return;
    if (!srcEl.classList.contains('live')) return;
    placeTerm(srcEl, srcEl.getBoundingClientRect());
}

function slideFrom(el, fromRect, ms) {
    const now = el.getBoundingClientRect();
    const dx = fromRect.left - now.left, dy = fromRect.top - now.top;
    if (!dx && !dy) return;
    el.style.transition = 'none';
    el.style.transform = `translate(${dx}px, ${dy}px)`;
    requestAnimationFrame(() => {
        el.style.transition = `transform ${ms}ms cubic-bezier(0.35, 0, 0.2, 1)`;
        el.style.transform = 'translate(0, 0)';
    });
}

// turn a landed exponent positive: the minus sign slides away and the number goes green
function flipExp(ex, hide) {
    if (!ex) return;
    if (hide) { ex.classList.add('vanish'); return; }
    const sign = ex.querySelector('.exp-sign'), num = ex.querySelector('.exp-num');
    if (sign) sign.classList.add('gone');
    if (num) { num.classList.remove('neg'); num.classList.add('flipped'); }
}

function placeTerm(srcEl, fromRect) {
    if (!live) return;
    const slot = $(srcEl.dataset.target);
    if (!slot || slot.classList.contains('filled')) return;
    const u = live.units[live.unit];
    const isPow = srcEl.dataset.kind === 'pow';

    slot.innerHTML = `<span class="term landed">${srcEl.innerHTML}</span>`;
    slot.classList.remove('ready', 'armed', 'eligible');
    slot.classList.add('filled');
    const landed = slot.querySelector('.term');
    if (fromRect) slideFrom(landed, fromRect, 380);

    srcEl.classList.remove('live');
    srcEl.classList.add('used');
    srcEl.tabIndex = -1;

    let overOne = null;
    if (isPow) {
        const ex = landed.querySelector(':scope > .pw > .ex');
        if (ex) {
            const num = ex.textContent.replace(/\u2212|-/g, '').trim();
            ex.classList.remove('neg');
            ex.innerHTML = `<span class="exp-sign neg">${MINUS}</span><span class="exp-num neg">${num}</span>`;
            later(() => flipExp(ex, slot.dataset.hide === '1'), 420);
        }
    } else {
        const blk = slot.dataset.blk;
        const pair = [...live.el.querySelectorAll(`.drop-slot[data-blk="${blk}"]`)];
        if (pair.every(s => s.classList.contains('filled'))) {
            const fx = $(`fx-${blk}`);
            later(() => flipExp(fx, fx && fx.dataset.hide === '1'), 420);
            const fr = $(`fr-${blk}`);
            if (fr && fr.dataset.one) overOne = fr;
        }
    }

    const remaining = unitSlots().filter(s => !s.classList.contains('filled'));
    if (remaining.length) {
        say('✓', 'correct');
        if (document.activeElement === srcEl) srcEl.blur();
        return;
    }
    say('✓', 'correct');
    later(() => live && live.el.querySelectorAll('.fr.scaffold').forEach(f => f.classList.add('dissolved')), 900);

    /* A bottom of 1 is worth stopping on.  The exponent has just turned over at 420ms;
       from there the bar and the 1 are lit and named, held long enough to read, and
       then faded out, so the line is seen becoming a plain number before it is
       rewritten as one. */
    if (overOne) {
        later(() => {
            if (!live) return;
            const fd = overOne.querySelector(':scope > .fd');
            const h = fd ? fd.getBoundingClientRect().height : 0;
            if (h > 0) overOne.style.setProperty('--fdh', h + 'px');
            overOne.classList.add('over1');
            requestAnimationFrame(() => overOne.classList.add('lit1'));
            coach('Over 1', 'a bottom of 1 leaves the top as it is', false);
        }, 900);
        later(() => live && overOne.classList.add('dissolved'), 2000);
        later(() => { if (live && live.units[live.unit] === u) passUnit(); }, 2800);
        return;
    }
    later(() => { if (live && live.units[live.unit] === u) passUnit(); }, 1500);
}

/* ============================================================
   Wiring
   ============================================================ */
$('check-btn').addEventListener('click', checkStep);
$('next-btn').addEventListener('click', advance);
document.addEventListener('keydown', e => {
    if (!isVisible()) return;
    if (e.key === 'Enter' && recentlyMoved()) { e.preventDefault(); e.stopPropagation(); return; }
}, true);
document.addEventListener('keydown', e => {
    if (!isVisible()) return;
    if (e.key === 'Enter' && finished && document.activeElement.tagName !== 'BUTTON' && document.activeElement.tagName !== 'SELECT') {
        e.preventDefault();
        $('next-btn').click();
    }
});

    function focusInput() {
        const input = root.querySelector('.ans-input.now') || root.querySelector('.ans-input');
        if (input && !input.disabled) { try { input.focus(); } catch (e) {} }
        else if (finished) { try { $('next-btn').focus(); } catch (e) {} }
    }

    /* the shell writes a work log, and asks each drill to read its own problem
       back as plain text rather than scraping the chain off the screen, which
       by the end holds every line of the working */
    function currentText() { return prob ? T(prob.expr) + ' = ' + qT(prob.value) : ''; }

    return { loadNewProblem: freshProblem, focusInput: focusInput, problemText: currentText };
}

return { createExprDrill: createExprDrill };
})();
</script>

<script>
/* ===== PP: the power-of-a-power drill, turned into a factory =====
   Same problems, same steps, same arrows. What changed: the drill no longer
   owns the page, so it looks its pieces up inside its own root rather than by
   id, it is told which section it is (numbers or letters) instead of carrying
   its own tabs, and it hands the finished problem back to the shell. Two
   copies run on the page at once, so nothing addresses anything by id. */
var PP = (function () {

const dot = ' &middot; ';
const numericBases = [2, 3, 4, 5, 6, 7, 10];
const letters = ['x', 'y', 'z', 'a', 'b', 'c', 'm', 'n', 'd', 'p'];
const varColors = ['t2', 't3', 't4'];
const ARROW_COLOR = '#b7791f';

/* A small pool asked over and over starts to feel like the same four problems,
   so recent ones are held back. The list is short: long enough to stop a
   repeat inside a sitting, not so long that it runs out of problems to pick. */
const recentNumeric = [];

function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

/* ---------------- HTML helpers ---------------- */

function fracHtml(num, den, cls) {
    return '<span class="frac' + (cls ? ' ' + cls : '') + '">' +
           '<span class="num">' + num + '</span>' +
           '<span class="denom">' + den + '</span></span>';
}
function parenIfNeg(n) { return n < 0 ? '(' + n + ')' : String(n); }

function coefFactorHtml(coef, tgt) {
    if (!coef) return '';
    var mark = tgt === undefined ? '' : ' data-tgt="' + tgt + '"';
    return coef.kind === 'int'
        ? '<span class="t1"' + mark + '>' + coef.n + '</span>'
        : '<span class="frac t1"' + mark + '><span class="num">1</span><span class="denom">' + coef.d + '</span></span>';
}
function coefAnswerHtml(coef, outer) {
    if (!coef) return '';
    return coef.kind === 'int'
        ? '<span class="t1">' + Math.pow(coef.n, outer) + '</span>'
        : fracHtml(1, Math.pow(coef.d, outer), 't1');
}
function coefPowerHtml(coef, outer) {
    if (!coef) return '';
    return coef.kind === 'int'
        ? '<span class="t1">' + parenIfNeg(coef.n) + '</span><sup class="tOut">' + outer + '</sup>'
        : '<span class="t1">(' + fracHtml(1, coef.d) + ')</span><sup class="tOut">' + outer + '</sup>';
}
function coefAnswerString(coef, outer) {
    if (!coef) return null;
    return coef.kind === 'int'
        ? String(Math.pow(coef.n, outer))
        : '1/' + Math.pow(coef.d, outer);
}
function varHtml(v, cls, exp) {
    var e = exp === undefined ? v.exp : exp;
    return '<span class="' + cls + '">' + v.letter + (e === 1 ? '' : '<sup>' + e + '</sup>') + '</span>';
}
function powerName(n) {
    var names = { 2: 'second power', 3: 'third power', 4: 'fourth power', 5: 'fifth power',
                  6: 'sixth power', 7: 'seventh power', 8: 'eighth power', 9: 'ninth power' };
    return names[n] || 'power of ' + n;
}

/* ---------------- Problem generation ---------------- */

function generateNumericProblem() {
    var base, outer, inner, key, tries = 0;
    do {
        base = pick(numericBases);
        outer = getRandomInt(2, 5);
        do { inner = getRandomInt(-9, 9); } while (inner === 0 || inner === 1 || inner === -1);
        key = base + ':' + inner + ':' + outer;
        tries++;
    } while (tries < 40 && recentNumeric.indexOf(key) !== -1);
    recentNumeric.push(key);
    if (recentNumeric.length > 15) recentNumeric.shift();
    return { type: 'numeric', base: base, inner: inner, outer: outer };
}

function generateProductProblem() {
    while (true) {
        var outer = getRandomInt(2, 5);
        var coefType = pick(['none', 'int', 'int', 'neg', 'frac']);

        var coef = null;
        if (coefType === 'int') coef = { kind: 'int', n: getRandomInt(2, 5) };
        if (coefType === 'neg') coef = { kind: 'int', n: -getRandomInt(2, 5) };
        if (coefType === 'frac') coef = { kind: 'frac', d: getRandomInt(2, 5) };

        if (coef && coef.kind === 'int' && Math.pow(Math.abs(coef.n), outer) > 4096) continue;
        if (coef && coef.kind === 'frac' && Math.pow(coef.d, outer) > 1296) continue;

        var varCount = getRandomInt(1, 3);
        var pool = letters.slice();
        var vars = [];
        for (var i = 0; i < varCount; i++) {
            var idx = Math.floor(Math.random() * pool.length);
            vars.push({ letter: pool.splice(idx, 1)[0], exp: getRandomInt(1, 9) });
        }
        if (!coef && varCount === 1 && vars[0].exp === 1) continue;

        return { type: 'product', outer: outer, coef: coef, vars: vars };
    }
}

/* ---------------- Expanded form, kept from the older drill ---------------- */

function buildExpandedRevealHtml(base, e1, e2) {
    var netExp = e1 * e2;
    var absE1 = Math.abs(e1);
    var expanded, group;

    if (e1 > 0) {
        if (absE1 > 4 || e2 > 3) {
            expanded = Array(e2).fill('<span class="t2">(' + base + '<sup>' + e1 + '</sup>)</span>').join(dot);
        } else {
            group = Array(absE1).fill(base).join(dot);
            expanded = Array(e2).fill('<span class="t2">(' + group + ')</span>').join(dot);
        }
    } else {
        if (absE1 > 4 || e2 > 3) {
            expanded = Array(e2).fill(
                '<span class="t2">' + fracHtml(1, base + '<sup>' + absE1 + '</sup>') + '</span>'
            ).join(dot);
        } else {
            group = Array(absE1).fill(base).join(dot);
            expanded = Array(e2).fill('<span class="t2">' + fracHtml(1, group) + '</span>').join(dot);
        }
    }

    var finalForm = netExp < 0
        ? base + '<sup>' + netExp + '</sup> = ' + fracHtml(1, base + '<sup>' + Math.abs(netExp) + '</sup>')
        : base + '<sup>' + netExp + '</sup>';

    return '<div class="reveal-title">Fully expanded:</div>' +
           '<div class="reveal-line">' + expanded + ' <span>=</span> <span>' + finalForm + '</span></div>';
}

/* ---------------- The drill ---------------- */

function createPowerDrill(root, opts) {
    opts = opts || {};
    var mode = opts.mode || 'numbers';

    root.innerHTML =
        '<div class="card" data-card>' +
            '<div class="problem-header">' +
                '<span data-title>Problem 1</span>' +
                '<span class="step-count" data-step-count></span>' +
            '</div>' +
            '<div class="expression-wrap">' +
                '<svg class="arrow-layer" data-arrows></svg>' +
                '<div class="expression-row" data-expr></div>' +
            '</div>' +
            '<div class="step-area">' +
                '<div class="step-title" data-step-title></div>' +
                '<div class="step-line" data-step-line></div>' +
                '<div class="step-reveal" data-step-reveal></div>' +
            '</div>' +
            '<div class="progress-strip" data-strip></div>' +
            '<div class="feedback" data-feedback></div>' +
            '<div class="hint" data-hint></div>' +
            '<div class="action-container" data-actions>' +
                '<button class="next-btn" data-next>Next problem</button>' +
            '</div>' +
        '</div>';

    var exprRow    = root.querySelector('[data-expr]');
    var arrowSvg   = root.querySelector('[data-arrows]');
    var titleEl    = root.querySelector('[data-title]');
    var stepCountEl= root.querySelector('[data-step-count]');
    var stepTitleEl= root.querySelector('[data-step-title]');
    var stepLineEl = root.querySelector('[data-step-line]');
    var revealEl   = root.querySelector('[data-step-reveal]');
    var stripEl    = root.querySelector('[data-strip]');
    var feedback   = root.querySelector('[data-feedback]');
    var hintEl     = root.querySelector('[data-hint]');
    var actionsEl  = root.querySelector('[data-actions]');
    var nextBtn    = root.querySelector('[data-next]');

    var localCount = 0;
    var problem = null;
    var steps = [];
    var stepIndex = 0;
    var stepSolved = false;
    var phase = 'preview';      // preview | steps | shortcut | done
    var timers = [];

    function nextNumber() { return opts.number ? opts.number() : ++localCount; }
    function isVisible() { return !root.classList.contains('hidden'); }
    function advance() { if (opts.onNext) opts.onNext(); else loadNewProblem(); }
    function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
    function clearTimers() { timers.forEach(clearTimeout); timers = []; }
    function tgt(i) { return root.querySelector('[data-tgt="' + i + '"]'); }
    function ansPart(i) { return root.querySelector('[data-ans="' + i + '"]'); }

    /* ---------------- Expression, with arrow targets ---------------- */

    function buildExpressionHtml(p) {
        var inside = '';
        if (p.type === 'numeric') {
            inside = '<span class="factor" data-f="0"><span class="t2">' + p.base +
                     '<sup data-tgt="0">' + parenIfNeg(p.inner) + '</sup></span></span>';
        } else {
            var i = 0;
            if (p.coef) {
                inside += '<span class="factor" data-f="' + i + '">' + coefFactorHtml(p.coef, i) + '</span>';
                i++;
            }
            p.vars.forEach(function (v, k) {
                var cls = varColors[k];
                inside += v.exp === 1
                    ? '<span class="factor" data-f="' + i + '"><span class="' + cls + '" data-tgt="' + i + '">' + v.letter + '</span></span>'
                    : '<span class="factor" data-f="' + i + '"><span class="' + cls + '">' + v.letter + '<sup data-tgt="' + i + '">' + v.exp + '</sup></span></span>';
                i++;
            });
        }

        var expr = '<span>(' + inside + ')<sup><span class="factor" data-f="out" data-tgt="out">' +
                   '<span class="tOut">' + p.outer + '</span></span></sup></span>';
        return expr + '<span class="final-answer" data-final>' + buildAnswerHtml(p) + '</span>';
    }

    function buildAnswerHtml(p) {
        var parts = '<span class="eq-sign" data-eq>=</span>';
        if (p.type === 'numeric') {
            parts += '<span class="ans-part" data-ans="0">' + p.base + '<sup>' + (p.inner * p.outer) + '</sup></span>';
            return parts;
        }
        var i = 0;
        if (p.coef) {
            parts += '<span class="ans-part" data-ans="' + i + '">' + coefAnswerHtml(p.coef, p.outer) + '</span>';
            i++;
        }
        p.vars.forEach(function (v, k) {
            parts += '<span class="ans-part" data-ans="' + i + '">' + varHtml(v, varColors[k], v.exp * p.outer) + '</span>';
            i++;
        });
        return parts;
    }

    /* ---------------- Steps ---------------- */

    function buildSteps(p) {
        var list = [];

        if (p.type === 'numeric') {
            var termHtml = '<span class="t2">' + p.base + '<sup>' + parenIfNeg(p.inner) + '</sup></span>';
            list.push({
                factorIndex: 0,
                title: 'Use ' + p.base + ' to the ' + powerName(p.inner) + ' as a factor ' + p.outer + ' times.',
                lineHtml: Array(p.outer).fill(termHtml).join(dot) +
                          ' <span>=</span> <span>' + p.base +
                          '<sup><input type="text" class="ans-input" maxlength="4"></sup></span>',
                expected: String(p.inner * p.outer),
                hint: 'Same base multiplied? Add the exponents: ' + Array(p.outer).fill(parenIfNeg(p.inner)).join(' + '),
                chipHtml: p.base + '<sup>' + (p.inner * p.outer) + '</sup>',
                revealHtml: buildExpandedRevealHtml(p.base, p.inner, p.outer),
                arrowLine: p.base + '<sup><span class="exp-content"><span class="t2">' + parenIfNeg(p.inner) +
                           '</span> <span style="color:#38a169;">&middot;</span> <span class="tOut">' + p.outer +
                           '</span></span></sup> = ' + p.base + '<sup>' + (p.inner * p.outer) + '</sup>'
            });
            return list;
        }

        var idx = 0;

        if (p.coef) {
            var factorTxt = p.coef.kind === 'int'
                ? '<span class="t1">' + parenIfNeg(p.coef.n) + '</span>'
                : fracHtml(1, p.coef.d, 't1');
            var nameTxt = p.coef.kind === 'int' ? p.coef.n : '1/' + p.coef.d;
            list.push({
                factorIndex: idx++,
                title: 'Use ' + nameTxt + ' as a factor ' + p.outer + ' times.',
                lineHtml: Array(p.outer).fill(factorTxt).join(dot) +
                          ' <span>=</span> <input type="text" class="ans-input" maxlength="7">',
                expected: coefAnswerString(p.coef, p.outer),
                hint: p.coef.kind === 'frac'
                    ? 'The top stays 1. The bottom is ' + p.coef.d + ' multiplied ' + p.outer + ' times. Type it like 1/16.'
                    : 'Multiply two at a time: start with ' + parenIfNeg(p.coef.n) + ' &middot; ' + parenIfNeg(p.coef.n) + ', then keep going.',
                chipHtml: coefAnswerHtml(p.coef, p.outer),
                arrowLine: coefPowerHtml(p.coef, p.outer) + ' = ' + coefAnswerHtml(p.coef, p.outer)
            });
        }

        p.vars.forEach(function (v, k) {
            var cls = varColors[k];
            var termHtml = varHtml(v, cls);
            var label = v.exp === 1 ? v.letter : v.letter + ' to the ' + powerName(v.exp);
            var oneNote = v.exp === 1
                ? ' <span style="color:#718096;">(no exponent showing means an exponent of 1)</span>'
                : '';
            list.push({
                factorIndex: idx++,
                title: 'Use ' + label + ' as a factor ' + p.outer + ' times.' + oneNote,
                lineHtml: Array(p.outer).fill(termHtml).join(dot) +
                          ' <span>=</span> <span class="' + cls + '">' + v.letter +
                          '<sup><input type="text" class="ans-input" maxlength="3"></sup></span>',
                expected: String(v.exp * p.outer),
                hint: 'Same base multiplied? Add the exponents: ' + Array(p.outer).fill(v.exp).join(' + '),
                chipHtml: varHtml(v, cls, v.exp * p.outer),
                arrowLine: '<span class="' + cls + '">' + v.letter + '</span><sup><span class="exp-content"><span class="' +
