        const top = pick([3, 5, 7, 9, 15]), bot = pick([2, 4, 6, 8]);
        const a = rnd(3, 8), b = rnd(1, a - 1);
        return buildProblem(
            [mono(top, [[v[0], a], [v[1], rnd(2, 7)]])],
            [mono(bot, [[v[0], b], [v[1], rnd(1, 3)]])]);
    }

    // a negative exponent underneath, with coefficients: 24x^5 / (4x^2 y^-3)
    function genNegDen() {
        const v = pickVars(2);
        const c = pick([2, 3, 4, 5, 6]), k = rnd(2, 8);
        const a = rnd(3, 8), b = rnd(1, a - 1);
        return buildProblem(
            [mono(c * k, [[v[0], a]])],
            [mono(c, [[v[0], b], [v[1], -rnd(2, 6)]])]);
    }
    // two terms to drag across
    function genTwoNeg() {
        const v = pickVars(3);
        const a = rnd(3, 7), b = rnd(1, a - 1);
        return buildProblem(
            [mono(1, [[v[0], a], [v[1], rnd(2, 5)]])],
            [mono(1, [[v[0], b], [v[1], -rnd(2, 5)], [v[2], -rnd(2, 4)]])]);
    }

    const POOL = [genNoCoef, genOneVar, genTwoVar, genTwoVar, genThreeVar, genThreeVar,
                  genProductTop, genProductTop, genNegResult, genZeroPower, genFracCoef,
                  genNegDen, genNegDen, genTwoNeg];

    // the four problems from the worksheet, shown first and in order
    function featured() {
        return [
            buildProblem([mono(1, [['e', 4], ['f', 9]])], [mono(1, [['e', 2]])]),
            buildProblem([mono(1, [['c', 4], ['d', 5], ['e', 10]])], [mono(1, [['c', 2], ['d', -6], ['e', 1]])]),
            buildProblem([mono(20, [['x', 5], ['y', 16]])], [mono(5, [['x', 2], ['y', 5]])]),
            buildProblem([mono(24, [['x', 2], ['y', 3]]), mono(2, [['x', 8]])], [mono(6, [['x', 1], ['y', 2]])])
        ];
    }

    /* ===================== state ===================== */
    let localCount = 0;
    /* The four worksheet problems open the Day One drill, in order. On a
       review the next day they are the last thing worth showing again, so the
       caller can ask to go straight to the random pool. */
    let queue = opts.skipFeatured ? [] : featured();
    let p = null;
    let stages = [];
    let stageIndex = 0;
    let solved = false;
    let previewTimer = null;

    function nextNumber() { return opts.number ? opts.number() : ++localCount; }
    function isVisible() {
        if (root.classList.contains('hidden')) return false;
        const panel = root.closest('.panel');
        return !panel || panel.classList.contains('is-active');
    }
    function advance() { if (opts.onNext) opts.onNext(); else loadNewProblem(); }

    function generateProblem() {
        if (queue.length) return queue.shift();
        let q, tries = 0;
        do {
            q = pick(POOL)();
            tries++;
        } while (tries < 30 && !sane(q));
        return q;
    }
    // keep the numbers reasonable, and keep every letter small enough to write out
    function sane(q) {
        if (Math.abs(q.coefAnswer.n) > 200 || q.coefAnswer.d > 12) return false;
        if (!q.varOrder.every(n => Math.abs(q.expAnswer[n]) <= 16)) return false;
        let total = 0, ok = true;
        q.varOrder.forEach(name => {
            const size = q.allVars.filter(v => v.name === name)
                .reduce((a, v) => a + Math.abs(v.exp), 0);
            if (size > EXPAND_LIMIT) ok = false;
            total += size;
        });
        return ok && total <= 32;
    }

    /* ===================== stages ===================== */
    // read from where each letter sits right now, coloured by where it started
    function varEntries(name) {
        const out = [];
        ['num', 'den'].forEach(side => {
            p.allVars.forEach(v => {
                if (v.name === name && v.side === side) {
                    out.push({ exp: v.exp, cls: v.home === 'num' ? 't1' : 't2', side: side });
                }
            });
        });
        return out;
    }
    function hasCoefficients() {
        return p.num.concat(p.den).some(f => !frIsOne(f.coef));
    }

    function buildStages() {
        const list = [];
        if (p.negCount) list.push({ kind: 'move', key: 'move' });
        if (hasCoefficients()) list.push({ kind: 'coef', key: 'coef', answer: frText(p.coefAnswer) });
        p.varOrder.forEach(name => {
            list.push({
                kind: 'exp', name: name, key: name,
                answer: String(p.expAnswer[name])
            });
        });
        return list;
    }

    /* ===================== the work lines ===================== */
    function coefFracHtml() {
        const top = p.num.map(f => '<span class="t1">' + frHtml(f.coef) + '</span>').join(DOT);
        const bot = p.den.map(f => '<span class="t2">' + frHtml(f.coef) + '</span>').join(DOT);
        return fracHtml(top, bot);
    }
    function powerFormHtml(name, entries) {
        const one = e => '<span class="' + e.cls + '">' + name + expSup(e.exp, true) + '</span>';
        const nums = entries.filter(e => e.side === 'num').map(one);
        const dens = entries.filter(e => e.side === 'den').map(one);
        if (!dens.length) return nums.join(DOT);
        return fracHtml(nums.length ? nums.join(DOT) : '1', dens.join(DOT));
    }
    // every copy of the letter written out, with the matching pairs crossed off
    function expandVarHtml(name, entries) {
        const num = [], den = [];
        entries.forEach(e => {
            const eff = e.side === 'num' ? e.exp : -e.exp;
            for (let i = 0; i < Math.abs(eff); i++) (eff > 0 ? num : den).push(e.cls);
        });
        const cancel = Math.min(num.length, den.length);
        const one = (cls, struck) =>
            '<span class="' + cls + (struck ? ' cross-out' : '') + '">' + name + '</span>';
        const numParts = num.map((c, i) => one(c, i < cancel));
        const denParts = den.map((c, i) => one(c, i < cancel));
        if (!numParts.length && !denParts.length) return '1';
        if (!denParts.length) return numParts.join(DOT);
        return fracHtml(numParts.length ? numParts.join(DOT) : '1', denParts.join(DOT));
    }
    function expandSize(entries) {
        return entries.reduce((a, e) => a + Math.abs(e.exp), 0);
    }
    function expandOrPower(name, entries) {
        const total = expandSize(entries);
        return (total > 0 && total <= EXPAND_LIMIT)
            ? expandVarHtml(name, entries)
            : powerFormHtml(name, entries);
    }

    function rewriteHtml(activeKey) {
        const groups = [];
        if (hasCoefficients()) groups.push({ key: 'coef', html: coefFracHtml() });
        p.varOrder.forEach(name => {
            groups.push({ key: name, html: expandOrPower(name, varEntries(name)) });
        });
        return groups.map(g =>
            '<span class="group' + (g.key === activeKey ? ' on' : '') + '">' + g.html + '</span>'
        ).join(DOT);
    }

    // how many letters end up written out on the widest line
    function rewriteWeight() {
        let w = hasCoefficients() ? 3 : 0;
        p.varOrder.forEach(name => {
            const entries = varEntries(name);
            const size = expandSize(entries);
            w += (size > 0 && size <= EXPAND_LIMIT) ? size : entries.length * 2;
        });
        return w;
    }

    function doneLine(s) {
        if (s.kind === 'coef') {
            return coefFracHtml() + ' = <span class="result">' + frHtml(p.coefAnswer) + '</span>';
        }

        const total = parseInt(s.answer, 10);
        const entries = varEntries(s.name);
        const left = powerFormHtml(s.name, entries);

        // 2 + 8 - 1, top exponents added, bottom exponents taken away
        let sum = '';
        entries.forEach((e, i) => {
            const txt = e.exp < 0 ? '(&minus;' + Math.abs(e.exp) + ')' : String(e.exp);
            const val = '<span class="' + e.cls + '">' + txt + '</span>';
            if (i === 0) sum += (e.side === 'den' ? '<span class="minus">&minus;</span> ' : '') + val;
            else if (e.side === 'num') sum += ' <span class="plus">+</span> ' + val;
            else sum += ' <span class="minus">&minus;</span> ' + val;
        });
        const middle = entries.length > 1 ? ' = ' + s.name + '<sup><span class="exp-sum">' + sum + '</span></sup>' : '';

        let right, note = '';
        if (total === 0) {
            right = '<span class="result">1</span>';
            note = ' <span class="note">zero power, so it drops out</span>';
        } else if (total < 0) {
            right = '<span class="result">' + s.name + expSup(total, false) + '</span>';
            note = ' <span class="note">or ' + fracHtml('1', s.name + expSup(-total, false)) + '</span>';
        } else {
            right = '<span class="result">' + s.name + expSup(total, false) + '</span>';
            if (entries.length === 1) note = ' <span class="note">no ' + s.name + ' underneath, so it stays</span>';
        }
        return left + middle + ' = ' + right + note;
    }

    // the rule, with plain letters, so the drag stays a thinking step
    function ruleLine() {
        return '<span class="rule-text">A negative exponent means the term belongs on the other side of the bar.</span>' +
            '<span class="rule-math">' +
                fracHtml('1', 'a<sup>&minus;n</sup>') + ' = a<sup>n</sup>' +
                '<span class="rule-gap"></span>' +
                'a<sup>&minus;n</sup> = ' + fracHtml('1', 'a<sup>n</sup>') +
            '</span>';
    }

    function moveDoneLine() {
        return problemHtml(null, true) + ' = ' + problemHtml(null, false);
    }

    function renderWork() {
        let html = '';
        const moveIdx = stages.findIndex(s => s.kind === 'move');
        const moveDone = moveIdx === -1 || stageIndex > moveIdx;

        if (moveIdx > -1) {
            html += moveDone
                ? '<span class="wline done">' + moveDoneLine() + '</span>'
                : '<span class="wline rule">' + ruleLine() + '</span>';
        }
        if (stageIndex >= -1 && moveDone) {
            const activeKey = (stageIndex >= 0 && stages[stageIndex]) ? stages[stageIndex].key : null;
            const w = rewriteWeight();
            const size = w > 34 ? ' tighter' : (w > 22 ? ' tight' : '');
            html += '<span class="wline rewrite' + size + '">' + rewriteHtml(activeKey) + '</span>';
        }
        for (let i = 0; i < stages.length; i++) {
            if (i < stageIndex && stages[i].kind !== 'move') {
                html += '<span class="wline done">' + doneLine(stages[i]) + '</span>';
            }
        }
        if (solved) {
            html += '<span class="wline final">' + problemHtml(null, true) +
                    ' = <span class="result">' + answerHtmlOf(p) + '</span></span>';
        }
        workEl.innerHTML = html;
        fitSoon(workEl, function () { workEl.scrollTop = workEl.scrollHeight; });
    }

    /* ===================== rendering ===================== */
    function stageColor(i) {
        if (!stages[i]) return STAGE_COLORS[0];
        if (stages[i].kind === 'move') return MOVE_COLOR;
        if (stages[i].kind === 'coef') return STAGE_COLORS[0];
        const vi = p.varOrder.indexOf(stages[i].name);
        return STAGE_COLORS[1 + (Math.max(vi, 0) % 3)];
    }

    function renderAnswerLine() {
        let html = '';
        stages.forEach((s, i) => {
            if (s.kind === 'move') return;
            if (s.kind === 'coef') {
                html += '<input type="text" class="box coef-box waiting" data-stage="' + i + '" maxlength="6" ' +
                    'autocomplete="off" spellcheck="false" disabled>';
            } else {
                html += '<span class="avar" data-avar="' + i + '">' + s.name +
                    '<sup><input type="text" class="box exp-box waiting" data-stage="' + i + '" maxlength="3" ' +
                    'inputmode="numeric" autocomplete="off" spellcheck="false" disabled></sup></span>';
            }
        });
        answerEl.innerHTML = html;
    }

    function moveHint() {
        const waiting = p.allVars.filter(movable);
        const names = waiting.map(v => v.name);
        const which = waiting.length > 1
            ? 'the ' + names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1] + ' terms'
            : 'the ' + names[0];
        return 'Drag ' + which + ' across the bar. The exponent turns positive on the way over.';
    }

    function setStage(i) {
        stageIndex = i;
        if (i >= stages.length) { finish(); return; }

        const s = stages[i];
        const col = stageColor(i);
        card.style.setProperty('--stage', col.main);
        card.style.setProperty('--stage-soft', col.soft);

        const focus = s.kind === 'coef' ? { kind: 'coef' }
            : s.kind === 'move' ? { kind: 'move' }
            : { kind: 'var', name: s.name };
        displayEl.innerHTML = problemHtml(focus);
        fitSoon(exprRowEl);

        if (s.kind === 'move') {
            checkBtn.style.display = 'none';
            feedbackEl.className = 'feedback hint';
            feedbackEl.textContent = moveHint();
        } else {
            checkBtn.style.display = '';
            if (feedbackEl.classList.contains('hint')) {
                feedbackEl.textContent = '';
                feedbackEl.className = 'feedback';
            }
        }

        root.querySelectorAll('.box').forEach(b => {
            const bi = parseInt(b.dataset.stage, 10);
            b.classList.remove('active');
            if (bi === i) {
                b.disabled = false;
                b.classList.remove('waiting');
                b.classList.add('active');
            } else if (bi > i) {
                b.disabled = true;
                b.classList.add('waiting');
            }
        });
        renderWork();
        const box = root.querySelector('.box[data-stage="' + i + '"]');
        if (box && isVisible()) box.focus();
    }

    function renderProblem(newP) {
        p = newP;
        stages = buildStages();
        solved = false;
        stageIndex = -2;
        if (previewTimer) { clearTimeout(previewTimer); previewTimer = null; }

        titleEl.textContent = nextNumber();
        feedbackEl.textContent = '';
        feedbackEl.className = 'feedback';
        workEl.innerHTML = '';
        nextBtn.style.display = 'none';
        checkBtn.style.display = '';

        card.style.setProperty('--stage', '#a0aec0');
        card.style.setProperty('--stage-soft', '#edf2f7');

        // the whole problem, nothing dimmed, for a couple of seconds
        dragger.endDrag();
        dragger.clearSelection();
        displayEl.innerHTML = problemHtml(null);
        renderAnswerLine();
        fitSoon(exprRowEl);

        previewTimer = setTimeout(skipAhead, 2000);
    }

    // problem only -> problem rewritten -> first step
    function skipAhead() {
        if (previewTimer) { clearTimeout(previewTimer); previewTimer = null; }
        if (stageIndex === -2) {
            stageIndex = -1;
            renderWork();
            previewTimer = setTimeout(skipAhead, 2200);
        } else if (stageIndex === -1) {
            setStage(0);
        }
    }

    /* ===================== dragging a term across the bar ===================== */
    function inMoveStage() {
        return !solved && stageIndex >= 0 && stages[stageIndex] && stages[stageIndex].kind === 'move';
    }

    function refreshMoveDisplay(landedIdx) {
        displayEl.innerHTML = problemHtml({ kind: 'move' });
        if (landedIdx !== undefined) {
            const el = displayEl.querySelector('[data-vi="' + landedIdx + '"]');
            if (el) el.classList.add('landed');
        }
        fitSoon(exprRowEl);
    }

    function attemptDrop(idx, side) {
        const v = p.allVars[idx];
        if (!v || !movable(v)) return false;
        if (side === v.side) {
            feedbackEl.className = 'feedback incorrect';
            feedbackEl.textContent = v.side === 'den'
                ? 'That is the side it is already on. A negative exponent moves up across the bar.'
                : 'That is the side it is already on. A negative exponent moves down across the bar.';
            return false;
        }

        v.side = side;
        v.exp = -v.exp;
        refreshMoveDisplay(idx);

        if (pendingMoves() === 0) {
            feedbackEl.className = 'feedback correct';
            feedbackEl.textContent = 'The exponent is positive now.';
            const next = stageIndex + 1;
            setTimeout(function () {
                if (!solved && stageIndex === next - 1) setStage(next);
            }, 900);
        } else {
            feedbackEl.className = 'feedback hint';
            feedbackEl.textContent = moveHint();
        }
        return true;
    }

    const dragger = createDragMove({
        host: displayEl,
        isActive: inMoveStage,
        onPick: function () {
            feedbackEl.className = 'feedback hint';
            feedbackEl.textContent = 'Now tap the other side of the bar.';
        },
        onDrop: attemptDrop
    });

    /* ===================== checking ===================== */
    function cleanNum(v) {
        return String(v).trim().replace(/[\u2212\u2013\u2014]/g, '-').replace(/\s+/g, '').replace(/^\+/, '');
    }

    function lockStage(i) {
        const box = root.querySelector('.box[data-stage="' + i + '"]');
        box.value = stages[i].answer;
        box.disabled = true;
        box.classList.remove('active', 'waiting');
        box.classList.add('locked');
        if (stages[i].kind === 'exp' && stages[i].answer === '0') {
            const av = root.querySelector('[data-avar="' + i + '"]');
            if (av) av.classList.add('vanish');
        }
    }

    function checkCurrent(silent) {
        if (solved || stageIndex < 0 || stageIndex >= stages.length) return;
        const s = stages[stageIndex];
        if (s.kind === 'move') {
            if (!silent) {
                feedbackEl.className = 'feedback hint';
                feedbackEl.textContent = moveHint();
            }
            return;
        }
        const box = root.querySelector('.box[data-stage="' + stageIndex + '"]');
        if (!box) return;
        const val = cleanNum(box.value);
        if (val === '') return;

        if (val === cleanNum(s.answer)) {
            lockStage(stageIndex);
            if (stageIndex + 1 >= stages.length) {
                setStage(stages.length);
            } else {
                feedbackEl.textContent = '';
                feedbackEl.className = 'feedback';
                setStage(stageIndex + 1);
            }
            return;
        }
        if (silent) return;

        box.classList.remove('shake');
        void box.offsetWidth;
        box.classList.add('shake');
        feedbackEl.className = 'feedback incorrect';
        feedbackEl.innerHTML = wrongMessage(s, val);
    }

    function wrongMessage(s, val) {
        if (s.kind === 'coef') {
            if (!/^-?\d+(\/\d+)?$/.test(val)) return 'Type a number here. Use a slash for a fraction, like 5/2.';
            const num = val.indexOf('/') > -1
                ? parseInt(val.split('/')[0], 10) / parseInt(val.split('/')[1], 10)
                : parseFloat(val);
            const want = p.coefAnswer.n / p.coefAnswer.d;
            const topProd = p.num.reduce((a, f) => frMul(a, f.coef), fr(1, 1));
            const botProd = p.den.reduce((a, f) => frMul(a, f.coef), fr(1, 1));
            const tv = topProd.n / topProd.d, bv = botProd.n / botProd.d;

            if (num === tv && p.num.length > 1) return 'That is just the top. Now divide by the bottom number.';
            if (num === tv) return 'Divide the top number by the bottom number.';
            if (num === bv / tv) return 'Upside down. Top divided by bottom, not the other way round.';
            if (num === tv * bv) return 'That is multiplying them. Divide the top by the bottom instead.';
            if (num === tv - bv) return 'That is subtracting. Numbers divide, only exponents subtract.';
            if (num === -want) return 'Right number, wrong sign.';
            if (p.num.length > 1) return 'Multiply the top numbers first, then divide by the bottom.';
            return 'Divide the top number by the bottom number.';
        }

        const name = s.name;
        if (!/^-?\d+$/.test(val)) return 'Type just the exponent here, as a whole number.';
        const num = parseFloat(val);
        const want = parseFloat(s.answer);
        const entries = varEntries(name);
        const tops = entries.filter(e => e.side === 'num');
        const bots = entries.filter(e => e.side === 'den');
        const topSum = tops.reduce((a, e) => a + e.exp, 0);
        const botSum = bots.reduce((a, e) => a + e.exp, 0);

        if (!bots.length) {
            return tops.length > 1
                ? 'Both ' + name + ' terms are on top now, so add those exponents.'
                : 'There is no ' + name + ' on the bottom, so its exponent does not change.';
        }
        if (num === topSum + botSum) return 'That is adding them. Take the bottom exponent away from the top.';
        if (num === -want) return 'Right way round is top minus bottom. You have it backwards.';
        if (bots.some(e => e.exp < 0) && num === want - 2 * Math.abs(botSum)) {
            return 'Subtracting a negative adds. Watch what happens to that minus.';
        }
        if (entries.some(e => e.exp === 1) && Math.abs(num - want) === 1) {
            return 'Close. The ' + name + ' with no exponent written counts as 1.';
        }
        if (tops.length > 1 && num === want - topSum + tops[0].exp) {
            return 'There are two ' + name + ' terms on top. Add those first, then subtract.';
        }
        if (num > want) return 'Too high. Count the ' + name + ' left over on top.';
        return 'Too low. Count the ' + name + ' left over on top.';
    }

    function finish() {
        solved = true;
        card.style.setProperty('--stage', '#2f855a');
        card.style.setProperty('--stage-soft', '#ddf6e5');
        displayEl.innerHTML = problemHtml(null);
        fitSoon(exprRowEl);
        feedbackEl.textContent = 'Correct!';
        feedbackEl.className = 'feedback correct';
        renderWork();
        checkBtn.style.display = 'none';
        nextBtn.style.display = '';
        if (isVisible()) nextBtn.focus();
    }

    /* ===================== events ===================== */
    root.addEventListener('input', function (e) {
        if (!e.target.classList.contains('box')) return;
        if (feedbackEl.classList.contains('incorrect')) {
            feedbackEl.textContent = '';
            feedbackEl.className = 'feedback';
        }
        checkCurrent(true);
    });

    document.addEventListener('click', function (e) {
        if (!isVisible()) return;
        if (previewTimer && !(e.target && e.target.tagName === 'BUTTON')) skipAhead();
    });

    document.addEventListener('keydown', function (e) {
        if (!isVisible()) return;
        if (previewTimer) { skipAhead(); return; }
        if (e.key !== 'Enter') return;
        if (e.target && e.target.tagName === 'BUTTON') return;
        e.preventDefault();
        if (solved) advance();
        else checkCurrent(false);
    });

    checkBtn.addEventListener('click', function () { checkCurrent(false); });
    nextBtn.addEventListener('click', advance);

    function loadNewProblem() { renderProblem(generateProblem()); }
    function focusInput() {
        if (solved) { nextBtn.focus(); return; }
        const box = root.querySelector('.box[data-stage="' + stageIndex + '"]');
        if (box && !box.disabled) box.focus();
    }

    return { loadNewProblem: loadNewProblem, focusInput: focusInput };

   exist, and opts.forceExp pins a drill to exponent 0 or exponent 1 so the

    const TIMES = "\u00B7";
    const APPROX = "\u2248";
    const DIV = "\u00F7";

    const negBases = [-7, -8, -11, -12, -15, -20, -25];
    const fracBases = [[1,6],[1,7],[1,9],[1,10],[1,12],[3,5],[2,7],[5,8],[4,9],[7,10],[5,12],[9,11]];

    function chainHtml(base, n) {

            const classes = ["ladder-row"];

        function generateProblem() {

                feedback.className = "feedback correct";

   walks the expression and rebuilds it: an <input> contributes what was typed
   into it, a <sup> becomes ^, a stacked fraction becomes (a/b), and anything
   struck through was cancelled and is left out. */
function readMath(node) {
    if (!node) return '';
    var out = '';

    function walk(n) {
        var kids = n.childNodes;
        for (var i = 0; i < kids.length; i++) {
            var k = kids[i];
            if (k.nodeType === 3) { out += k.nodeValue; continue; }
            if (k.nodeType !== 1) continue;
            /* The quotient drill lays its exponent boxes out beside the base
               rather than inside a <sup>, so the fraction bar can span them.
               Without this, 2 with a 4 typed next to it reads back as 24. */
            if (k.tagName === 'INPUT') {
                if (k.parentElement && k.parentElement.classList.contains('pw')) out += '^';
                out += k.value;
                continue;

            if (k.classList && k.classList.contains('cross-out')) continue;
            if (k.tagName === 'SUP') { out += '^'; walk(k); continue; }

                var den = k.querySelector('.denom');
                out += '(';
                if (num) walk(num);
                out += '/';
                if (den) walk(den);
                out += ')';
                continue;
            }
            walk(k);
        }
    }

    return out

        .replace(/\u2212/g, '-')

var TEST_QUESTIONS = [
    ['(1/8)^2 * (1/9)^2',            [8, 2, 9, 2]],
    ['2.5^16',                       [2.5, 16]],
    ['(-3/4)^6 * (-3/4)^2',          [3, 4, 6, 3, 4, 2]],
    ['(-1.5)^5 * (3.2)^5',           [1.5, 5, 3.2, 5]],
    ['(5/6)^3',                      [5, 6, 3]],
    ['0.3^5',                        [0.3, 5]],
    ['5^3 / 5^2',                    [5, 3, 5, 2]],
    ['(1/2^-2)^2',                   [2, 2, 2]],
    ['(-1/2)^-3 * (2^-3)^1',         [2, 3, 2, 3]],
    ['(2^-2)^-2 + 4^2/4^-2',         [2, 2, 2, 4, 2, 4, 2]],
    ['1/3^-2 * 9^-2',                [3, 2, 9, 2]],
    ['-8^-2',                        [8, 2]],
    ['(3/5)^0',                      [3, 5, 0]],
    ['(2/5)^3',                      [2, 5, 3]],
    ['5^1 x 5^2 x 5^1',              [5, 5, 2, 5]],
    ['(2/3)^-3 * (3/4)^-3',          [2, 3, 3, 3, 4, 3]],
    ['(3/5)^-8 / (3/5)^-4',          [3, 5, 8, 3, 5, 4]],
    ['8(10^0)2^-6',                  [8, 10, 0, 2, 6]],
    ['6^-4 / 6^-6',                  [6, 4, 6, 6]],
    ['6^-4 * 6^4',                   [6, 4, 6, 4]],
    ['(2/7)^3',                      [2, 7, 3]],
    ['(4/9)^-2 * (3/4)^-2',          [4, 9, 2, 3, 4, 2]],
    ['y^-7 z^8 / z^2',               [7, 8, 2]],
    ['(2e^-3 f^4 g^-1)^2',           [2, 3, 4, 2]]
];
function numberKey(list) {
    return list.map(Number).filter(function (n) { return n !== 1; })
               .map(String).sort().join(',');
}
var TEST_KEYS = TEST_QUESTIONS.map(function (q) { return numberKey(q[1]); });

var SUPS = '\u2070\u00b9\u00b2\u00b3\u2074\u2075\u2076\u2077\u2078\u2079';
function numbersIn(text) {
    // superscript digits (9⁻² from the negative-exponent drill) become their own numbers
    var t = String(text).replace(/[\u2070\u00b9\u00b2\u00b3\u2074-\u2079]+/g, function (m) {
        return ' ' + m.split('').map(function (c) { return SUPS.indexOf(c); }).join('') + ' ';
    });
    return t.match(/\d+(?:\.\d+)?/g) || [];
}
/* the problem as shown, without its answer */
function currentProblemOnly() {
    if (current.problemKey) return current.problemKey();
    var own = current.problemText ? current.problemText() : '';
    if (own) return own.split(' = ')[0];
    var e = currentRoot && (currentRoot.querySelector('[data-expr]') || currentRoot.querySelector('[data-display]'));
    return readMath(e).split('=')[0];
}
function matchesTest() {
    return TEST_KEYS.indexOf(numberKey(numbersIn(currentProblemOnly()))) !== -1;
}
/* Every problem in the set uses its own numbers: once a set of numbers has been
   shown, no other problem in this sitting - from any tab - uses the same ones. */
var USED_KEYS = {};
function loadFresh() {
    for (var tries = 0; tries < 120; tries++) {
        current.loadNewProblem();
        var key = numberKey(numbersIn(currentProblemOnly()));
        if (!matchesTest() && !USED_KEYS[key]) { USED_KEYS[key] = true; return; }
    }
}

/* ---------- the tabs ---------- */
function sectionsFinished() {
    var n = 0;
    for (var i = 0; i < SECTIONS.length; i++) if (progress[i].done >= SECTIONS[i].count) n++;
    return n;
}

function paintTabs() {
    /* one solid bar, no sections and no numbers: how far along, not how many */
    var pct = Math.round(Math.min(solved, TOTAL) * 100 / TOTAL);
    el('progressFill').style.width = pct + '%';
    el('progress').setAttribute('aria-valuenow', pct);

    var spec = SECTIONS[sectionIndex];
    var part = spec && spec.parts[progress[sectionIndex].partIndex];
    el('where').textContent = part && part.note ? spec.label + ' \u00b7 ' + part.note : (spec ? spec.label : '');
}

/* ---------- running a tab ---------- */
function showPart(spec, secState) {
    if (currentRoot) currentRoot.classList.add('hidden');

    var part = spec.parts[secState.partIndex];
    currentRoot = el(part.root);
    currentRoot.classList.remove('hidden');

    if (!instances[part.root]) {
        instances[part.root] = part.make(currentRoot, {
            number: problemNumber,
            onNext: finishProblem
        });
    }
    current = instances[part.root];
    missedThis = false;
}

function startSection(i) {
    sectionIndex = i;
    var spec = SECTIONS[i];
    var secState = progress[i];

    showPart(spec, secState);
    paintTabs();
    loadFresh();
}

/* The heading inside each drill's own card. The drills ask for this number
   themselves as they render, so it always names the problem on screen. */
function problemNumber() { return ''; }

/* A review is a test of picking the rule, not of repeating one, so the next
   problem comes from a tab drawn at random rather than from the tab just
   finished. Every tab still keeps its own place, so one that comes round again
   carries on where it left off rather than starting over. */
function unfinished() {
    var open = [];
    for (var i = 0; i < SECTIONS.length; i++) {
        if (progress[i].done < SECTIONS[i].count) open.push(i);
    }
    return open;
}

/* Mixed evenly: before the first problem, every tab's problems are laid out
   along the whole set - a tab with four gets one slot in each quarter, a tab
   with three one in each third - each nudged a little at random, then the lot
   is sorted by position. The same rule never comes twice in a row, so every
   problem is a matter of picking the rule, and each rule turns up from start
   to finish rather than in one block. A tab with two parts still does its
   numbers before its letters, because it keeps its own place. */
var ORDER = (function () {
    var slots = [];
    SECTIONS.forEach(function (s, i) {
        var offset = Math.random();
        for (var k = 0; k < s.count; k++) {
            var jitter = (Math.random() - 0.5) * 0.6;
            slots.push({ i: i, at: (k + 0.5 + jitter * 0.5 + (offset - 0.5) * 0.4) / s.count });
        }
    });
    slots.sort(function (a, b) { return a.at - b.at; });
    var seq = slots.map(function (x) { return x.i; });
    // pull apart any back-to-back repeats by swapping with the nearest safe spot
    for (var pass = 0; pass < 4; pass++) {
        for (var p = 1; p < seq.length; p++) {
            if (seq[p] !== seq[p - 1]) continue;
            for (var d = 1; d < seq.length; d++) {
                var q = p + d < seq.length ? p + d : p - d;
                if (q <= 0 && p + d >= seq.length) continue;
                var ok = function (pos, val) {
                    return (pos === 0 || seq[pos - 1] !== val) && (pos === seq.length - 1 || seq[pos + 1] !== val);
                };
                var a = seq[p], b = seq[q];
                seq[p] = b; seq[q] = a;
                if (ok(p, b) && ok(q, a)) break;
                seq[p] = a; seq[q] = b;
            }
        }
    }
    return seq;
})();

function nextSection(after) {
    for (var k = solved; k < ORDER.length; k++) {
        if (progress[ORDER[k]].done < SECTIONS[ORDER[k]].count) return ORDER[k];
    }
    var open = unfinished();
    return open.length ? open[0] : -1;
}

function firstUnfinished(after) {
    var open = unfinished();
    if (!open.length) return -1;
    var pool = open.filter(function (i) { return i !== after; });
    return (pool.length ? pool : open)[0];
}

/* Called by whichever drill is on screen once a problem is done with and the
   student has asked for the next one. */
function finishProblem() {
    var spec = SECTIONS[sectionIndex];
    var secState = progress[sectionIndex];

    records.push({
        q: problemText(currentRoot),
        section: spec.label,
        clean: !missedThis
    });
    missedThis = false;
    solved++;
    secState.done++;
    secState.inPart++;

    var part = spec.parts[secState.partIndex];
    var partFull = secState.inPart >= part.count;
    var sectionFull = secState.done >= spec.count;

    if (solved >= TOTAL) { paintTabs(); showSubmitCard(true); return; }

    if (partFull && !sectionFull) {
        secState.partIndex++;
        secState.inPart = 0;
    }

    var next = nextSection(sectionIndex);
    if (next === -1) { paintTabs(); showSubmitCard(true); return; }
    if (next !== sectionIndex) { startSection(next); return; }

    if (partFull) showPart(spec, secState);
    paintTabs();
    loadFresh();
}

/* A tab is a way back to work that is still owed, not a way to redo work
   already done, so a finished tab stops taking clicks. */
function goToSection(i) {
    if (i === sectionIndex || progress[i].done >= SECTIONS[i].count) return;
    if (cardShowing()) setCard(false);
    startSection(i);
}

/* Whether a problem was answered first time. Rather than reaching into every
   drill for it, this watches the sheet for the marks they all already make
   when an answer is wrong or an answer is given away.

   'shown' means an answer was handed over - but only on an input. The
   power-of-a-power drill uses the same word for the pieces of its own worked
   answer appearing, which is not a miss. */
var MISS_MARKS = '.incorrect, .shake, .wrong, input.shown';

function noteMiss() {
    if (!missedThis && currentRoot && currentRoot.querySelector(MISS_MARKS)) missedThis = true;
}

(function watchForMisses() {
    var stage = el('stage');

    /* An observer reports after the fact, and by then a mark can already have
       been replaced by the next one - a wrong answer overwritten by the right
       one reads as though it were never wrong. So the sheet is also swept as
       each keystroke passes through, while the mark is still standing. */
    ['input', 'keydown', 'keyup', 'click', 'mouseup'].forEach(function (evt) {
        stage.addEventListener(evt, noteMiss);
        document.addEventListener(evt, noteMiss);
    });

    var obs = new MutationObserver(function (muts) {
        for (var i = 0; i < muts.length; i++) {
            var t = muts[i].target;
            if (!t.classList) continue;
            if (t.classList.contains('incorrect') || t.classList.contains('shake') ||
                t.classList.contains('wrong')) {
                missedThis = true;
                return;
            }
            if (t.tagName === 'INPUT' && t.classList.contains('shown')) {
                missedThis = true;
                return;
            }
        }
    });
    obs.observe(stage, { subtree: true, attributes: true, attributeFilter: ['class'] });
})();

/* =====================================================================
   Turning it in
   ===================================================================== */
function cleanSolves() {
    var n = 0;
    for (var i = 0; i < records.length; i++) if (records[i].clean) n++;
    return n;
}

function breakdown() {
    var counts = {};
    for (var i = 0; i < records.length; i++) {
        var s = records[i].section;
        counts[s] = (counts[s] || 0) + 1;
    }
    var bits = [];
    for (var j = 0; j < SECTIONS.length; j++) {
        var lab = SECTIONS[j].label;
        if (counts[lab]) bits.push(SECTIONS[j].tag + ' ' + counts[lab]);
    }
    return bits.join(', ');
}

function esc(t) {
    return String(t).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
}

function cardShowing() { return el('submitCard').classList.contains('show'); }

function setCard(on) {
    el('submitCard').classList.toggle('show', on);
    document.body.classList.toggle('oncard', on);
    /* The drills listen for Enter on the document and check whether they are
       hidden before acting. While the form is up, Enter belongs to the form. */
    if (currentRoot) currentRoot.classList.toggle('hidden', on);
}

function showSubmitCard(completed) {
    setCard(true);

    el('submitTitle').textContent = completed ? 'All done' : 'Your work so far';
    el('submitNote').textContent = completed
        ? 'That is every problem. Enter your period and name to submit.'
        : 'Enter your period and name to submit what you have so far. Nothing is lost by doing this \u2014 go back afterwards, finish the set, and send it again.';

    el('recap').innerHTML =
        '<div>Progress<span class="progress" style="display:block;height:14px;margin-top:10px;">' +
            '<span class="progress-fill" style="display:block;width:' + (Math.min(solved, TOTAL) * 100 / TOTAL) + '%"></span></span></div>';

    var log = '';
    if (records.length) {
        log = '<div class="log">';
        for (var i = 0; i < records.length; i++) {
            var r = records[i];
            log += '<div class="logrow">' +
                       '<span class="logn">' + (i + 1) + '.</span>' +
                       '<span class="logq">' + esc(r.q || '\u2014') + '</span>' +
                       '<span class="logh">' + (r.clean ? 'first try' : 'more than one go') + '</span>' +
                   '</div>';
        }
        log += '</div>';
    } else {
        log = '<div class="logempty">Nothing finished yet \u2014 work goes in here as you go.</div>';
    }
    el('workLog').innerHTML = log;

    /* Turning in early does not close the sheet. If they carry on afterwards
       and get further, the form comes back so the fuller set can be sent as
       well; the teacher takes the later one. */
    var more = submitted && solved > submittedAt;
    el('gform').style.display = (!submitted || more) ? '' : 'none';
    var btn = document.querySelector('#gform .submit-btn');
    if (more) {
        el('formFeedback').innerHTML =
            '<span class="resend">You have done more since you turned in. Send it again and the newer one counts.</span>';
        btn.textContent = 'Send updated results';
    } else if (!submitted) {
        el('formFeedback').innerHTML = '';
        btn.textContent = 'Submit Results';
    }

    var left = TOTAL - solved;
    el('keepBtn').style.display = left > 0 ? '' : 'none';
    el('keepBtn').textContent = 'Go back and keep going';
    document.querySelector('.after-submit .lab').textContent = left > 0 ? 'still more to do:' : '';
    document.querySelector('.after-submit').style.display = left > 0 ? '' : 'none';

    el('formScore').value = points();
    try { window.scrollTo(0, 0); } catch (e) {}
}

function keepDrilling() {
    setCard(false);
    /* Turning in halfway through a finished tab leaves nothing to come back
       to, so the way back is the next tab that still owes problems. */
    if (sectionIndex < 0 || progress[sectionIndex].done >= SECTIONS[sectionIndex].count) {
        var next = firstUnfinished(sectionIndex);
        if (next !== -1) { startSection(next); return; }
    }
    paintTabs();
    if (current && current.focusInput) current.focusInput();
}

function showSubmittedMessage() {
    el('formFeedback').innerHTML =
        '<span style="color:#38a169;">Successfully submitted. ' +
        (solved >= TOTAL
            ? 'You can close this page.'
            : 'You can close this page, or go back and finish the set.') +
        '</span>';
    el('gform').style.display = 'none';
}
function onHiddenFrameLoad() { if (submitted) showSubmittedMessage(); }

/* ---------- the two names, read back before anything is sent ----------
   Last and first get swapped constantly, so the form shows what it is about
   to send and makes them look at it once. */
function nameCheck() {
    var ln = el('lastName').value.trim(), fn = el('firstName').value.trim();
    function row(tag, val) {
        return '<div class="row"><span class="tag">' + tag + '</span>' +
               '<span class="val' + (val ? '' : ' empty') + '">' +
               (val ? esc(val) : '\u2014') + '</span></div>';
    }
    el('nameCheck').innerHTML =
        '<div class="checkhead">This is what will be sent \u2014 check it is the right way round:</div>' +
        row('Last name', ln) + row('First name', fn) +
        row('Roll call', (ln && fn) ? ln + ', ' + fn : '');
}

el('lastName').addEventListener('input', nameCheck);
el('firstName').addEventListener('input', nameCheck);
nameCheck();

el('gform').addEventListener('submit', function () {
    var ln = el('lastName').value.trim(), fn = el('firstName').value.trim();
    var bits = breakdown();
    el('studentName').value =
        'Period ' + el('studentPeriod').value.trim() +
        ' \u2014 ' + ln +
        ' \u2014 ' + fn +
        ' \u2014 ' + points() + '/' + POINTS + ' points, ' + solved + '/' + TOTAL + ' problems' +
        ' \u2014 ' + cleanSolves() + ' first try' +
        ' \u2014 ' + DRILL_NAME +
        (bits ? ' (' + bits + ')' : '');
    el('formScore').value = points();
    submitted = true;
    submittedAt = solved;
});

/* ---------- getting back to work ---------- */
el('keepBtn').onclick = keepDrilling;
el('turnInBtn').onclick = function () {
    if (cardShowing()) keepDrilling(); else showSubmitCard(solved >= TOTAL);
};

startSection(nextSection(-1));
</script>

</body>
</html>
