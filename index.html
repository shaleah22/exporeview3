        else setTimeout(startDrag, 350);
    }

    function missBox(inp) {
        const key = inp.dataset.key;
        boxMiss[key] = (boxMiss[key] || 0) + 1;
        misses++;
        say(key === '#' ? 'Check the number.' : 'Check the exponent on ' + key + '.', 'incorrect');
        if (misses >= 2) hintEl.textContent = P.combineRule;
        if (boxMiss[key] >= 3) { inp.value = inp.dataset.want.replace('-', MINUS); lockBox(inp, true); }
    }

    root.addEventListener('input', function (e) {
        const inp = e.target;
        if (!inp.classList || !inp.classList.contains('lbox') || (lstage !== 'combine' && lstage !== 'type2')) return;
        const got = normal(inp.value), want = inp.dataset.want;
        if (got === want) { say('', ''); lockBox(inp, false); return; }
        if (got === '' || got === '-') { say('', ''); return; }
        if (got.length >= want.length) missBox(inp);
    });

    function checkFocusedBox() {
        const inp = document.activeElement;
        if (!inp || !inp.classList.contains('lbox') || inp.disabled) {
            const first = zoneEl.querySelector('.lbox:not(:disabled)');
            if (first) { try { first.focus(); } catch (e) {} }
            return;
        }
        const got = normal(inp.value);
        if (!got || got === '-') { say('Fill in the box first.', 'nudge'); return; }
        if (got === inp.dataset.want) lockBox(inp, false); else missBox(inp);
    }

    /* The piece of the problem a box is about lights up while that box is being
       filled, and a line underneath says what to do with it. */
    function guideFor(key) {
        const ex = exprEl.querySelector('.ex');
        exprEl.querySelectorAll('.hlp.hl').forEach(el => el.classList.remove('hl'));
        zoneEl.querySelectorAll('.olv.on').forEach(el => el.classList.remove('on'));
        const g = zoneEl.querySelector('[data-guide]');
        if (!key || !P || !P.guide) {
            if (ex) ex.classList.remove('focusing');
            if (g) g.innerHTML = '';
            return;
        }
        const keys = [key].concat(P.hlOuter ? ['out'] : []);
        keys.forEach(k => exprEl.querySelectorAll('.hlp[data-hl="' + k + '"]').forEach(el => el.classList.add('hl')));
        const olv = zoneEl.querySelector('[data-olv="' + key + '"]');
        if (olv) olv.classList.add('on');
        if (ex) ex.classList.add('focusing');
        if (g) g.innerHTML = P.guide[key] || '';
    }

    root.addEventListener('focusin', function (e) {
        const inp = e.target;
        if (!P || P.kind !== 'drag' || !inp.classList || !inp.classList.contains('lbox') || inp.disabled) return;
        if (lstage === 'type2') { guide2(inp.dataset.key); return; }
        if (lstage !== 'combine') return;
        guideFor(inp.dataset.key);
    });

    function startDrag() {
        if (waiting) return;
        guideFor(null);
        lstage = 'drag';
        const A = P.answer;
        const s2 = zoneEl.querySelector('[data-s2]');
        const zeros = A.order.filter(v => (A.exps[v] || 0) === 0);
        const tile = v => { const e = A.exps[v]; return '<span class="tile" tabindex="0" role="button" data-v="' + v + '" data-e="' + e + '" aria-label="' + v + ' to the ' + e + '">' + pairHtml(v, e) + '</span>'; };
        const top = (A.coef.n !== 1 ? '<span class="tile coef">' + sgn(A.coef.n) + '</span>' : A.coef.n === -1 ? '<span class="tile coef">' + MINUS + '</span>' : '') +
                    A.order.filter(v => (A.exps[v] || 0) !== 0).map(tile).join('');
        s2.innerHTML =
            '<div class="steplab">' + (P.combine ? 'Step 2: drag' : 'Drag') + ' every negative exponent across the bar</div>' +
            (zeros.length ? '<div class="type-tip">' + zeros.map(v => '<i>' + v + '</i><sup>0</sup>').join(', ') + ' = 1, so ' + (zeros.length > 1 ? 'they drop' : 'it drops') + ' out.</div>' : '') +
            '<div class="drag-row"><span>=</span><div class="board">' +
                '<div class="brow" data-top>' + top + '<span class="ghost1 hide" data-top1>1</span></div>' +
                '<div class="bbar"></div>' +
                '<div class="brow" data-bot><span class="ghost1" data-bot1>1</span></div>' +
            '</div></div>' +
            '<div class="type-tip">A negative exponent flips across the bar and turns positive. Keyboard: Tab to a piece, then press Enter.</div>';
        s2.querySelectorAll('.tile[data-v]').forEach(wireTile);
        const first = s2.querySelector('.tile[data-v]');
        if (first && P.combine) { try { first.focus({ preventScroll: true }); } catch (e) {} }
    }

    function wireTile(t) {
        let sx = 0, sy = 0, moved = false, dragging = false;
        t.addEventListener('pointerdown', e => {
            if (waiting || lstage !== 'drag' || t.classList.contains('moved')) return;
            dragging = true; moved = false; sx = e.clientX; sy = e.clientY;
            try { t.setPointerCapture(e.pointerId); } catch (x) {}
            t.style.transition = 'none';
            t.classList.add('lift');
            e.preventDefault();
        });
        t.addEventListener('pointermove', e => {
            if (!dragging) return;
            const dx = e.clientX - sx, dy = e.clientY - sy;
            if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
            t.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
        });
        const end = e => {
            if (!dragging) return;
            dragging = false;
            t.classList.remove('lift');
            const bar = zoneEl.querySelector('.bbar').getBoundingClientRect();
            if (moved && e.clientY > bar.top + bar.height / 2) { tryMove(t); return; }
            snapBack(t);
            if (!moved && !clickNudged) { clickNudged = true; say('Drag it across the bar.', 'nudge'); }
        };
        t.addEventListener('pointerup', end);
        t.addEventListener('pointercancel', end);
    }

    const reduced = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function snapBack(t) {
        t.style.transition = reduced() ? 'none' : 'transform 0.25s ease';
        t.style.transform = '';
    }

    function tryMove(t) {
        const v = t.dataset.v, e = +t.dataset.e;
        if (e > 0) {
            snapBack(t);
            t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake'); setTimeout(() => t.classList.remove('shake'), 450);
            misses++;
            const board = zoneEl.querySelector('.board');
            if (board) board.classList.add('hintneg');
            say('Only negative exponents move. <i>' + v + '</i><sup>' + e + '</sup> is already positive, so it stays on top.', 'incorrect');
            return;
        }
        const from = t.getBoundingClientRect();
        const bot = zoneEl.querySelector('[data-bot]');
        const ghost = zoneEl.querySelector('[data-bot1]');
        if (ghost) ghost.remove();
        t.style.transition = 'none';
        t.style.transform = '';
        bot.appendChild(t);
        t.innerHTML = pairHtml(v, -e);
        t.dataset.e = String(-e);
        t.classList.add('moved', 'flip');
        t.removeAttribute('tabindex');
        t.setAttribute('aria-label', v + ' to the ' + (-e) + ', moved to the bottom');
        if (!reduced()) {
            const to = t.getBoundingClientRect();
            t.style.transform = 'translate(' + (from.left - to.left) + 'px,' + (from.top - to.top) + 'px)';
            void t.offsetWidth;
            t.style.transition = 'transform 0.35s ease';
            t.style.transform = '';
        }
        say('', '');
        const left = zoneEl.querySelectorAll('[data-top] .tile[data-v]');
        const negLeft = Array.from(left).filter(x => +x.dataset.e < 0);
        if (negLeft.length) { try { negLeft[0].focus({ preventScroll: true }); } catch (x) {} return; }
        if (!zoneEl.querySelector('[data-top] .tile')) zoneEl.querySelector('[data-top1]').classList.remove('hide', 'ghost1');
        zoneEl.querySelectorAll('.tile').forEach(x => x.removeAttribute('tabindex'));
        setTimeout(() => finish(false), reduced() ? 0 : 380);
    }

    /* ----- letters, drag first: the negatives cross the bar on the problem itself,
       then the answer is typed from what is left ----- */
    let type2Guide = {};

    function renderDragFirst() {
        const B = P.board;
        lstage = 'drag1';
        const tile = (v, e) => '<span class="tile" tabindex="0" role="button" data-v="' + v + '" data-e="' + e + '" aria-label="' + v + ' to the ' + e + '">' + pairHtml(v, e) + '</span>';
        const topH = (B.coef ? '<span class="tile coef" data-coef>' + sgn(B.coef) + '</span>' : '') + B.top.map(p => tile(p[0], p[1])).join('');
        const botH = B.bot.map(p => tile(p[0], p[1])).join('');
        let board = '<div class="board">' +
            '<div class="brow" data-top>' + topH + '<span class="one1" data-top1' + (topH ? ' style="display:none"' : '') + '>1</span></div>' +
            '<div class="bbar"></div>' +
            '<div class="brow" data-bot>' + botH + '<span class="ghost1" data-bot1' + (botH ? ' style="display:none"' : '') + '>1</span></div></div>';
        if (B.outer) board = '<span class="bwrap"><span class="bpar">(</span>' + board + '<span class="bpar">)</span><sup class="bout">' + B.outer + '</sup></span>';
        zoneEl.innerHTML = '<div data-s1><div class="steplab">Step 1: drag every negative exponent across the bar</div>' +
            '<div class="drag-row"><span>=</span>' + board + '</div>' +
            '<div class="type-tip" data-s1tip>A negative exponent crosses the bar and turns positive. Keyboard: Tab to a piece, then press Enter.</div></div>' +
            '<div data-s2></div>';
        zoneEl.querySelectorAll('[data-s1] .tile[data-v]').forEach(wireTile1);
    }

    function wireTile1(t) {
        let sx = 0, sy = 0, moved = false, on = false;
        t.addEventListener('pointerdown', e => {
            if (waiting || lstage !== 'drag1' || t.classList.contains('moved')) return;
            on = true; moved = false; sx = e.clientX; sy = e.clientY;
            try { t.setPointerCapture(e.pointerId); } catch (x) {}
            t.style.transition = 'none';
            t.classList.add('lift');
            e.preventDefault();
        });
        t.addEventListener('pointermove', e => {
            if (!on) return;
            const dx = e.clientX - sx, dy = e.clientY - sy;
            if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
            t.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
        });
        const end = e => {
            if (!on) return;
            on = false;
            t.classList.remove('lift');
            const bar = zoneEl.querySelector('[data-s1] .bbar').getBoundingClientRect();
            const mid = bar.top + bar.height / 2, onTop = !!t.closest('[data-top]');
            if (moved && (onTop ? e.clientY > mid : e.clientY < mid)) { tryMove1(t); return; }
            snapBack(t);
            if (!moved && !clickNudged) { clickNudged = true; say('Drag it across the bar.', 'nudge'); }
        };
        t.addEventListener('pointerup', end);
        t.addEventListener('pointercancel', end);
    }

    function tryMove1(t) {
        if (waiting || lstage !== 'drag1' || t.classList.contains('moved')) return;
        const v = t.dataset.v, e = +t.dataset.e, onTop = !!t.closest('[data-top]');
        const boardEl = zoneEl.querySelector('[data-s1] .board');
        if (e > 0) {
            snapBack(t);
            t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake'); setTimeout(() => t.classList.remove('shake'), 450);
            misses++;
            if (boardEl) boardEl.classList.add('hintneg');
            say('Only negative exponents move. <i>' + v + '</i>' + (e === 1 ? '' : '<sup>' + e + '</sup>') + ' is already positive, so it stays on the ' + (onTop ? 'top' : 'bottom') + '.', 'incorrect');
            return;
        }
        const from = t.getBoundingClientRect();
        const dest = zoneEl.querySelector(onTop ? '[data-s1] [data-bot]' : '[data-s1] [data-top]');
        t.style.transition = 'none';
        t.style.transform = '';
        dest.insertBefore(t, dest.querySelector(onTop ? '[data-bot1]' : '[data-top1]'));
        t.innerHTML = pairHtml(v, -e);
        t.dataset.e = String(-e);
        t.classList.add('moved', 'flip');
        t.removeAttribute('tabindex');
        t.setAttribute('aria-label', v + ' to the ' + (-e) + ', moved to the ' + (onTop ? 'bottom' : 'top'));
        const topHas = zoneEl.querySelector('[data-s1] [data-top] .tile'), botHas = zoneEl.querySelector('[data-s1] [data-bot] .tile');
        zoneEl.querySelector('[data-s1] [data-top1]').style.display = topHas ? 'none' : '';
        zoneEl.querySelector('[data-s1] [data-bot1]').style.display = botHas ? 'none' : '';
        if (!reduced()) {
            const to = t.getBoundingClientRect();
            t.style.transform = 'translate(' + (from.left - to.left) + 'px,' + (from.top - to.top) + 'px)';
            void t.offsetWidth;
            t.style.transition = 'transform 0.35s ease';
            t.style.transform = '';
        }
        say('', '');
        const negLeft = Array.from(zoneEl.querySelectorAll('[data-s1] .tile[data-v]:not(.moved)')).filter(x => +x.dataset.e < 0);
        if (negLeft.length) { try { negLeft[0].focus({ preventScroll: true }); } catch (x) {} return; }
        zoneEl.querySelectorAll('[data-s1] .tile').forEach(x => x.removeAttribute('tabindex'));
        if (boardEl) boardEl.classList.remove('hintneg');
        lstage = 'wait2';
        setTimeout(startType2, reduced() ? 0 : 420);
    }

    function startType2() {
        if (waiting || !P || !P.board || lstage !== 'wait2') return;
        lstage = 'type2';
        boxMiss = {};
        const A = P.answer, B = P.board;
        const side = { top: {}, bot: {} }, each = { top: {}, bot: {} };
        zoneEl.querySelectorAll('[data-s1] .tile[data-v]').forEach(t => {
            const sd = t.closest('[data-top]') ? 'top' : 'bot';
            side[sd][t.dataset.v] = (side[sd][t.dataset.v] || 0) + (+t.dataset.e);
            (each[sd][t.dataset.v] = each[sd][t.dataset.v] || []).push(+t.dataset.e);
        });
        type2Guide = {};
        if (B.outer) {
            const n = B.outer;
            if (B.coef && A.coef.n !== 1) type2Guide['#'] = 'The ' + B.coef + ' gets raised to the ' + ordinal(n) + ' power too: ' + Array(n).fill(B.coef).join(' ' + TIMES + ' ');
            A.order.forEach(v => { const e = side.top[v] || side.bot[v]; type2Guide[v] = 'Power of a power: multiply the exponents. <i>' + v + '</i>: ' + e + ' ' + TIMES + ' ' + n; });
        } else {
            A.order.forEach(v => {
                const t = side.top[v] || 0, b = side.bot[v] || 0;
                const sd = t ? 'top' : 'bot', twice = !(t && b) && (each[sd][v] || []).length > 1;
                type2Guide[v] = twice
                    ? '<i>' + v + '</i> is on the ' + (t ? 'top' : 'bottom') + ' more than once: same base multiplied, add the exponents, ' + each[sd][v].join(' + ')
                    : t && b
                    ? '<i>' + v + '</i> is on the top and the bottom: ' + (t >= b ? 'top exponent minus bottom exponent, ' + t + ' ' + MINUS + ' ' + b : 'bottom exponent minus top exponent, ' + b + ' ' + MINUS + ' ' + t)
                    : '<i>' + v + '</i> is only on the ' + (t ? 'top' : 'bottom') + ', so it keeps its exponent, ' + (t || b) + '.';
            });
        }
        const box = (key, want) => '<input type="text" class="lbox" autocomplete="off" spellcheck="false" inputmode="numeric" data-key="' + key + '" data-want="' + want + '" aria-label="' + (key === '#' ? 'number' : 'exponent on ' + key) + '">';
        const lv = (v, want) => '<span class="olv" data-olv="' + v + '"><i>' + v + '</i><sup>' + box(v, String(want)) + '</sup></span>';
        const topL = A.order.filter(v => (A.exps[v] || 0) > 0), botL = A.order.filter(v => (A.exps[v] || 0) < 0);
        const numH = ((A.coef.n !== 1 ? box('#', String(A.coef.n)) : '') + topL.map(v => lv(v, A.exps[v])).join('')) || '1';
        const denH = botL.map(v => lv(v, -A.exps[v])).join('') || '1';
        const tip = zoneEl.querySelector('[data-s1tip]');
        if (tip) tip.style.display = 'none';
        zoneEl.querySelector('[data-s2]').innerHTML =
            '<div class="steplab">Step 2: ' + (B.outer ? 'raise every factor to the ' + ordinal(B.outer) + ' power' : 'combine each letter') + '</div>' +
            '<div class="oneline t2"><span>=</span>' + fr('<span class="ol">' + numH + '</span>', '<span class="ol">' + denH + '</span>') + '</div>' +
            '<div class="guide" data-guide aria-live="polite"></div>' +
            '<div class="type-tip">Fill in each box. Every exponent in the answer is positive.</div>';
        const first = zoneEl.querySelector('[data-s2] .lbox');
        if (first && isVisible()) { try { first.focus({ preventScroll: true }); first.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
    }

    function guide2(key) {
        zoneEl.querySelectorAll('[data-s1] .tile.hl').forEach(el => el.classList.remove('hl'));
        zoneEl.querySelectorAll('.olv.on').forEach(el => el.classList.remove('on'));
        const g = zoneEl.querySelector('[data-s2] [data-guide]');
        if (!key) { if (g) g.innerHTML = ''; return; }
        const sel = key === '#' ? '[data-s1] .tile[data-coef]' : '[data-s1] .tile[data-v="' + key + '"]';
        zoneEl.querySelectorAll(sel).forEach(el => el.classList.add('hl'));
        const olv = zoneEl.querySelector('[data-s2] [data-olv="' + key + '"]');
        if (olv) olv.classList.add('on');
        if (g) g.innerHTML = type2Guide[key] || '';
    }

    /* ----- guided: one step at a time, each line appears when the last is right ----- */
    let gstep = 0, gMiss = {};

    function renderGuided() {
        gstep = 0; gMiss = {};
        zoneEl.innerHTML = '<div class="gsteps" data-gsteps></div>' +
            '<div class="type-tip" data-gtip>Fill in each box. The next step appears when this one is right.</div>';
        addGuidedStep();
    }

    function addGuidedStep() {
        const st = P.steps[gstep];
        let k = 0;
        const line = st.html.replace(/\{box\}/g, function () {
            const b = st.boxes[k], i = k++;
            return '<input type="text" class="gbox' + (b.check === 'value' ? ' wide' : '') + '" data-i="' + i +
                '" autocomplete="off" spellcheck="false" inputmode="text" aria-label="' + b.label + '">';
        });
        zoneEl.querySelector('[data-gsteps]').insertAdjacentHTML('beforeend',
            '<div class="gstep"><div class="steplab">Step ' + (gstep + 1) + ': ' + st.label.charAt(0).toUpperCase() + st.label.slice(1) + '</div>' +
            '<div class="gline">' + line + '</div></div>');
        hintEl.textContent = '';
        const tip = zoneEl.querySelector('[data-gtip]');
        if (tip) tip.textContent = st.tip || 'Fill in each box. The next step appears when this one is right.';
        if (st.drag === 'flip') {
            const stepEl = zoneEl.querySelector('.gstep:last-child');
            stepEl.querySelectorAll('.ftile').forEach(wireFlip);
            return;
        }
        const first = zoneEl.querySelector('.gstep:last-child .gbox');
        if (first && isVisible()) { try { first.focus({ preventScroll: true }); first.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
    }

    /* a fraction with a negative exponent: drag either number across its bar and the
       top and bottom trade places while the exponent turns positive */
    let flipNudged = false;
    function wireFlip(t) {
        let sx = 0, sy = 0, moved = false, on = false;
        t.addEventListener('pointerdown', e => {
            const pw = t.closest('.fpw');
            if (waiting || !pw || pw.classList.contains('flipped')) return;
            on = true; moved = false; sx = e.clientX; sy = e.clientY;
            try { t.setPointerCapture(e.pointerId); } catch (x) {}
            t.style.transition = 'none';
            t.classList.add('lift');
            e.preventDefault();
        });
        t.addEventListener('pointermove', e => {
            if (!on) return;
            const dx = e.clientX - sx, dy = e.clientY - sy;
            if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
            t.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
        });
        const end = e => {
            if (!on) return;
            on = false;
            t.classList.remove('lift');
            const pw = t.closest('.fpw');
            const bar = pw.querySelector('.num').getBoundingClientRect().bottom;
            const isTop = !!t.closest('.num');
            if (moved && (isTop ? e.clientY > bar : e.clientY < bar)) { doFlip(pw); return; }
            t.style.transition = reducedMotion() ? 'none' : 'transform 0.25s ease';
            t.style.transform = '';
            if (!moved && !flipNudged) { flipNudged = true; say('Drag it across the bar.', 'nudge'); }
            else if (moved) say('Drop it on the other side of the fraction bar.', 'nudge');
        };
        t.addEventListener('pointerup', end);
        t.addEventListener('pointercancel', end);
    }

    const reducedMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function doFlip(pw) {
        if (!pw || pw.classList.contains('flipped') || waiting) return;
        const numEl = pw.querySelector('.num'), denEl = pw.querySelector('.denom');
        const topT = numEl.querySelector('.ftile'), botT = denEl.querySelector('.ftile');
        const r1 = topT.getBoundingClientRect(), r2 = botT.getBoundingClientRect();
        [topT, botT].forEach(x => { x.style.transition = 'none'; x.style.transform = ''; });
        numEl.appendChild(botT); denEl.appendChild(topT);
        pw.classList.add('flipped');
        const supEl = pw.querySelector('[data-fsup]');
        const st = P.steps[gstep];
        if (supEl) { supEl.textContent = supEl.textContent.replace(MINUS, ''); supEl.classList.add('fflash'); }
        [topT, botT].forEach(x => { x.removeAttribute('tabindex'); x.classList.add('moved'); });
        if (!reducedMotion()) {
            const n1 = topT.getBoundingClientRect(), n2 = botT.getBoundingClientRect();
            topT.style.transform = 'translate(' + (r1.left - n1.left) + 'px,' + (r1.top - n1.top) + 'px)';
            botT.style.transform = 'translate(' + (r2.left - n2.left) + 'px,' + (r2.top - n2.top) + 'px)';
            void topT.offsetWidth;
            [topT, botT].forEach(x => { x.style.transition = 'transform 0.4s ease'; x.style.transform = ''; });
        }
        say('', '');
        const stepEl = pw.closest('.gstep');
        const next = stepEl.querySelector('.fpw:not(.flipped) .ftile');
        if (next) { try { next.focus({ preventScroll: true }); } catch (x) {} return; }
        gstep++;
        if (gstep < P.steps.length) setTimeout(addGuidedStep, reducedMotion() ? 150 : 520);
        else finish(false);
    }

    function gJudge(inp) {
        const b = P.steps[gstep].boxes[+inp.dataset.i];
        const raw = String(inp.value).trim().replace(/\u2212/g, '-').replace(/\s+/g, '');
        if (b.check === 'value') {
            const got = parseRational(raw);
            if (!got) return raw.length >= String(b.want).length ? 'bad' : 'wait';
            if (req(got.r, P.answer)) return got.reduced ? 'ok' : 'unreduced';
            return raw.length >= String(b.want).length ? 'bad' : 'wait';
        }
        if (raw === String(b.want)) return 'ok';
        if (raw === '' || raw === '-') return 'wait';
        if (b.check === 'xnew' && /^\d+$/.test(raw) && +raw > 0 && b.v % +raw === 0) {
            const f = b.v / +raw;                       // what they divided by
            if (f > 1 && f < b.g && b.other % f === 0) return 'smaller';
        }
        return raw.length >= String(b.want).length ? 'bad' : 'wait';
    }

    function gLock(inp, given) {
        inp.disabled = true;
        inp.classList.add(given ? 'shown' : 'ok');
        const next = zoneEl.querySelector('.gstep:last-child .gbox:not(:disabled)');
        if (next) { try { next.focus({ preventScroll: true }); } catch (e) {} return; }
        gstep++;
        if (gstep < P.steps.length) { say('', ''); setTimeout(addGuidedStep, 250); }
        else finish(false);
    }

    function gMissBox(inp) {
        const st = P.steps[gstep], key = gstep + ':' + inp.dataset.i;
        gMiss[key] = (gMiss[key] || 0) + 1;
        misses++;
        say(st.boxes[+inp.dataset.i].miss || st.hint, 'incorrect');
        hintEl.textContent = st.hint;
        if (gMiss[key] >= 3) { inp.value = String(st.boxes[+inp.dataset.i].want).replace('-', MINUS); gLock(inp, true); }
    }

    function gCheck(inp, final) {
        const r = gJudge(inp);
        if (r === 'ok') { say('', ''); gLock(inp, false); }
        else if (r === 'unreduced') say('Right value \u2014 now write the fraction in simplest form.', 'nudge');
        else if (r === 'smaller') {
            const b = P.steps[gstep].boxes[+inp.dataset.i];
            say('You divided by ' + (b.v / +inp.value.trim()) + '. That goes into both, but a bigger number does too \u2014 divide by the biggest.', 'nudge');
        }
        else if (r === 'bad' || (final && r === 'wait' && inp.value.trim())) gMissBox(inp);
        else if (final) say('Fill in the box first.', 'nudge');
    }

    root.addEventListener('input', function (e) {
        const inp = e.target;
        if (!inp.classList || !inp.classList.contains('gbox') || waiting || !P || P.kind !== 'guided') return;
        const r = gJudge(inp);
        if (r === 'ok') gCheck(inp, false);
        else if (r === 'bad') gMissBox(inp);
        else if (r === 'smaller' && inp.value.trim().length >= String(P.steps[gstep].boxes[+inp.dataset.i].want).length) gCheck(inp, false);
        else say('', '');
    });

    /* ----- keys ----- */
    document.addEventListener('keydown', function (e) {
        if (!isVisible() || !P) return;
        if (e.key === 'Enter') {
            e.preventDefault();
            if (waiting) { advance(); return; }
            if (P.kind === 'multi') checkMulti();
            else if (P.kind === 'value' || P.kind === 'decimal') checkTyped();
            else if (P.kind === 'guided' && document.activeElement && document.activeElement.classList.contains('ftile')) {
                doFlip(document.activeElement.closest('.fpw'));
            }
            else if (P.kind === 'guided') {
                const inp = document.activeElement && document.activeElement.classList.contains('gbox') && !document.activeElement.disabled
                    ? document.activeElement : zoneEl.querySelector('.gstep:last-child .gbox:not(:disabled)');
                if (inp) { if (document.activeElement !== inp) { try { inp.focus(); } catch (x) {} } gCheck(inp, true); }
            }
            else if (P.kind === 'drag') {
                if (lstage === 'combine' || lstage === 'type2') checkFocusedBox();
                else if (document.activeElement && document.activeElement.classList.contains('tile') && document.activeElement.dataset.v) (lstage === 'drag1' ? tryMove1 : tryMove)(document.activeElement);
            }
            return;
        }
        if (e.key === ' ' && P.kind === 'drag' && (lstage === 'drag' || lstage === 'drag1') && !waiting &&
            document.activeElement && document.activeElement.classList.contains('tile') && document.activeElement.dataset.v) {
            e.preventDefault(); (lstage === 'drag1' ? tryMove1 : tryMove)(document.activeElement); return;
        }
        if (e.key === ' ' && P.kind === 'guided' && !waiting && document.activeElement && document.activeElement.classList.contains('ftile')) {
            e.preventDefault(); doFlip(document.activeElement.closest('.fpw')); return;
        }
        if (waiting || e.ctrlKey || e.metaKey || e.altKey) return;
        if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
        if (P.kind === 'mc' || P.kind === 'multi') {
            const i = LETTERS.indexOf(e.key.toUpperCase());
            if (i !== -1 && i < P.options.length) { e.preventDefault(); choose(i); }
        }
    });
    nextBtn.addEventListener('click', advance);

    function focusInput() {
        if (waiting) { try { nextBtn.focus({ preventScroll: true }); } catch (e) {} return; }
        const inp = zoneEl.querySelector('input:not(:disabled)');
        if (inp) { try { inp.focus({ preventScroll: true }); } catch (e) {} }
    }

    function loadNewProblem() {
        P = draw();
        misses = 0; waiting = false;
        titleEl.textContent = nextNumber();
        fmtEl.textContent = P.fmt;
        promptEl.innerHTML = P.prompt + (P.note ? '<span class="note">' + P.note + '</span>' : '');
        exprEl.innerHTML = '<span class="ex">' + P.expr + '</span>';
        say('', '');
        hintEl.textContent = '';
        revealEl.innerHTML = '';
        revealEl.style.display = 'none';
        actionsEl.style.display = 'none';
        cardEl.classList.remove('done');
        if (P.kind === 'mc' || P.kind === 'gel') renderChoices(false);
        else if (P.kind === 'multi') renderChoices(true);
        else if (P.kind === 'drag') renderLetters();
        else if (P.kind === 'guided') renderGuided();
        else renderTyped();
        focusInput();
    }

    // for the work log on the turn-in card
    function problemText() {
        if (!P) return '';
        if (P.kind === 'drag') return 'Simplify ' + P.text + ' = ' + P.answer.numText + '/' + P.answer.denText;
        if (P.kind === 'value' || P.kind === 'guided') return P.text + ' = ' + P.answerText;
        if (P.kind === 'decimal') return P.text + ' = ' + P.answerText;
        const right = P.options.filter(o => o.ok).map(o => o.text).join(', ');
        return (P.kind === 'multi' ? 'Select all = ' : P.kind === 'gel' ? '' : 'Equivalent to ') + P.text + ': ' + right;
    }

    return { loadNewProblem, focusInput, problemText, problemKey: () => (P ? P.text : '') };
}

return { createQuizDrill, _test: { POOLS, parseRational, parseMono } };
})();
</script>

<script>
/* ===== NX: the negative-exponent drill, turned into a factory =====
   The drag across the bar, the exponent turning over, the faint bar and the
   faint 1, the crossing out and the repeated-division note are all unchanged.
   What changed: the drill draws into a root it is given rather than into the
   page, its ids carry a prefix so it can sit beside the other drills, it takes
   its problem number from the shell, and finishing a problem hands control
   back to the shell instead of opening a turn-in page of its own. ===== */
var NX = (function () {

/* ============================================================
   THE DRILL  —  Negative Exponents
   Problems are made fresh each time, in the same shapes as the
   handout: plain powers, a negative in front, a negative base,
   1 or a whole number over a power, one power over another, and
   fractions raised to a negative power.

   An item is either
     pw(base, exp)          a power              e.g. pw(9,-2)  -> 9^-2
     fr(top, bottom, exp)   a fraction to a power e.g. fr(3,5,-2) -> (3/5)^-2
   A group is G([numerator items], [denominator items], {neg, op}).
   ============================================================ */
const pw = (b, e) => ({ k: 'p', b, e });
const fr = (n, d, e) => ({ k: 'f', n, d, e });
const G  = (num, den, o = {}) => ({ num, den, neg: !!o.neg, op: o.op || null });

const rint = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const pick = list => list[Math.floor(Math.random() * list.length)];
const coin = (odds = 0.5) => Math.random() < odds;

// each base with the largest exponent that keeps the answer a readable size
const POWERS = [[2, 6], [3, 4], [4, 4], [5, 4], [6, 3], [7, 3], [8, 3], [9, 3], [10, 4]];
const somePower = (lo = 2) => { const [b, m] = pick(POWERS); return [b, rint(lo, m)]; };

const FAMILIES = [
    // 3^-4
    { n: 1, w: 4, make: () => { const [b, e] = somePower(); return [G([pw(b, -e)], [])]; } },
    // 3^4, no negative
    // not in the regular decks: exactly one is added to the 21 that get turned in (see dealDeck)
    { n: 0, w: 0, make: () => { const [b, m] = pick(POWERS); return [G([pw(b, rint(2, Math.min(m, 4)))], [])]; } },
    // -4^-2
    { n: 1, w: 1.5, make: () => [G([pw(rint(2, 6), -rint(2, 3))], [], { neg: true })] },
    // (-4)^-2
    { n: 1, w: 1.5, make: () => { const b = rint(2, 5); return [G([pw(-b, -rint(2, b === 2 ? 5 : 3))], [])]; } },
    // 1 / 4^-2
    { n: 1, w: 2, make: () => { const [b, e] = somePower(); return [G([], [pw(b, -e)])]; } },
    // 2 / 3^-3
    { n: 1, w: 1.5, make: () => {
        let a, b, e;
        do { a = rint(2, 6); b = rint(2, 7); e = rint(2, 3); } while (a * Math.pow(b, e) > 2500);
        return [G([pw(a, 1)], [pw(b, -e)])];
    } },
    // 5^-3 / 25^-2, or two unrelated bases
    { n: 1, w: 1.5, make: () => {
        if (coin(0.6)) {
            const [a, c, k] = pick([[2, 4, 2], [2, 8, 3], [3, 9, 2], [5, 25, 2]]);
            const m = rint(1, a === 2 ? 5 : 3), n = rint(1, 2);
            if (m === k * n) return null;                       // would just be 1
            const small = pw(a, -m), big = pw(c, -n);
            return coin() ? [G([small], [big])] : [G([big], [small])];
        }
        let a, b, m, n;
        do { a = rint(2, 7); b = rint(2, 7); m = rint(1, 3); n = rint(1, 3); }
        while (a === b || (m === 1 && n === 1) || Math.pow(a, m) > 350 || Math.pow(b, n) > 350);
        return [G([pw(a, -m)], [pw(b, -n)])];
    } },
    // (3/5)^-2, (2/-5)^-2, (-4/3)^-2
    // always exactly 2 in every deck, so 4 in the 21 that get turned in
    { n: 2, w: 0, make: () => {
        let p, q, e;
        do { p = rint(1, 9); q = rint(1, 9); e = rint(2, 3); }
        while (p === q || q === 1 || gcd(p, q) !== 1 || (e === 3 && Math.max(p, q) > 6));
        if (coin(0.3)) { if (coin()) p = -p; else q = -q; }
        return [G([fr(p, q, -e)], [])];
    } }
];

/* Problems are dealt from a deck of ten. Each kind goes in n times (fractions to
   a negative power twice, powers with no negative not at all, the rest once),
   and the deck is topped up to ten with random extras chosen by weight w. It is
   shuffled so the same kind never comes twice in a row.

   The 21 problems that get turned in are the first two decks, and one of those
   two (chosen at random, so it can land anywhere in the 21) also gets the single
   problem with no negative exponent, making it eleven cards. */
const NO_NEG = 1;                                  // the index of that kind in FAMILIES
let deck = [];
let decksDealt = 0;
const noNegDeck = Math.random() < 0.5 ? 0 : 1;

function dealDeck(lastFam) {
    const cards = [];
    FAMILIES.forEach((f, i) => { for (let k = 0; k < f.n; k++) cards.push(i); });
    const total = FAMILIES.reduce((t, f) => t + f.w, 0);
    while (cards.length < 10) {
        let r = Math.random() * total;
        cards.push(FAMILIES.findIndex(f => (r -= f.w) < 0));
    }
    if (decksDealt === noNegDeck) cards.push(NO_NEG);
    decksDealt++;
    for (;;) {
        for (let k = cards.length - 1; k > 0; k--) {
            const m = Math.floor(Math.random() * (k + 1));
            [cards[k], cards[m]] = [cards[m], cards[k]];
        }
        const ok = cards.every((c, k) => c !== (k ? cards[k - 1] : lastFam));
        if (ok) return cards;
    }
}

// the next kind of problem off the deck, dealing a fresh deck when it runs out
function nextFam(lastFam = -1) {
    if (!deck.length) deck = dealDeck(lastFam);
    return deck.shift();
}

// fresh numbers for one kind of problem
function makeProblem(fam) {
    for (;;) {
        const groups = FAMILIES[fam].make();
        if (groups) return { groups, fam };
    }
}

/* A single whole-number power with a negative exponent — like 3^-4 — is
   the same as starting at 1 and dividing by the base over and over:
   1 ÷ 3 ÷ 3 ÷ 3 ÷ 3. Returns that chain as markup, or null for any other shape. */
function divisionChain(prob) {
    if (prob.groups.length !== 1) return null;
    const g = prob.groups[0];
    if (g.den.length || g.num.length !== 1) return null;
    const it = g.num[0];
    if (it.k !== 'p' || it.e >= 0) return null;
    const b = it.b < 0 ? `(&minus;${-it.b})` : `${it.b}`;
    const chain = '1' + ` &divide; ${b}`.repeat(-it.e);
    return g.neg ? `&minus;(${chain})` : chain;
}

/* ============================================================
   Where every item ends up once the negatives have moved
   ------------------------------------------------------------
   A power with a negative exponent crosses the main fraction bar.
   A fraction with a negative exponent turns upside down in place.
   Either way the exponent comes out positive.
   ============================================================ */
function plan(g) {
    const num = [], den = [];
    g.num.forEach((it, ii) => {
        if (it.k === 'p') {
            if (it.e < 0) den.push({ post: pw(it.b, -it.e), src: { kind: 'pow', from: 'num', ii } });
            else          num.push({ post: it, src: null });
        } else {
            if (it.e < 0) num.push({ post: fr(it.d, it.n, -it.e), src: { kind: 'frac', from: 'num', ii } });
            else          num.push({ post: it, src: null });
        }
    });
    g.den.forEach((it, ii) => {
        if (it.k === 'p') {
            if (it.e < 0) num.push({ post: pw(it.b, -it.e), src: { kind: 'pow', from: 'den', ii } });
            else          den.push({ post: it, src: null });
        } else {
            if (it.e < 0) den.push({ post: fr(it.d, it.n, -it.e), src: { kind: 'frac', from: 'den', ii } });
            else          den.push({ post: it, src: null });
        }
    });
    return { num, den };
}

/* Write every power out as repeated multiplication, all over one bar.
   A 1 that the student put there — from a zero power, or from a base of 1 —
   is flagged so it survives the tidying up below. */
function emit(post, T, B) {
    if (post.k === 'p') {
        if (post.e === 0) T.push({ v: 1, keep: true });          // anything^0 is 1
        else for (let k = 0; k < post.e; k++) T.push({ v: post.b, keep: post.b === 1 });
    } else {
        for (let k = 0; k < post.e; k++) T.push({ v: post.n });
        for (let k = 0; k < post.e; k++) B.push({ v: post.d });
    }
}

// stray 1s beside real factors go away; a row of nothing but 1s is written out in full
function tidy(list) {
    const real = list.filter(x => x.v !== 1 || x.keep);
    return real.length ? real : list;
}

function expandGroup(g) {
    const pl = plan(g), top = [], bot = [];
    pl.num.forEach(({ post }) => emit(post, top, bot));
    pl.den.forEach(({ post }) => emit(post, bot, top));
    return { top: tidy(top), bot: tidy(bot) };
}

const product = list => list.reduce((p, x) => p * x.v, 1);

/* ============================================================
   What actually cancels
   ------------------------------------------------------------
   A cross-out is legal when the factors struck on top are worth
   the same as the factors struck on the bottom, so we look for
   the largest value that both sides can build. That is honest
   even when the bases differ, e.g. 25 on top against 5 · 5 below.
   ============================================================ */
function subsetProducts(list) {
    const m = new Map(), n = list.length;
    for (let mask = 0; mask < (1 << n); mask++) {
        let p = 1;
        for (let k = 0; k < n; k++) if (mask >> k & 1) p *= list[k].v;
        if (!m.has(p)) m.set(p, mask);
    }
    return m;
}

function cancelPlan(top, bot) {
    if (top.length > 14 || bot.length > 14) return { p: 1, topMask: 0, botMask: 0 };
    const mt = subsetProducts(top), mb = subsetProducts(bot);
    let best = 1, tm = 0, bm = 0;
    for (const [p, mask] of mt) {
        if (p !== 1 && mb.has(p) && Math.abs(p) > Math.abs(best)) { best = p; tm = mask; bm = mb.get(p); }
    }
    return { p: best, topMask: tm, botMask: bm };
}

const maskCount = m => { let c = 0; while (m) { c += m & 1; m >>= 1; } return c; };

/* ---------- exact fraction arithmetic for the final answer ---------- */
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; };
function reduce(n, d) { const g = gcd(n, d); n /= g; d /= g; if (d < 0) { n = -n; d = -d; } return { n, d }; }
function addFrac(a, b) { return reduce(a.n * b.d + b.n * a.d, a.d * b.d); }

/* ============================================================
   Everything the drill needs to know about one problem
   ============================================================ */
function analyse(prob) {
    const groups = prob.groups.map(g => {
        const { top, bot } = expandGroup(g);
        const cut = cancelPlan(top, bot);
        const remTop = top.filter((_, k) => !(cut.topMask >> k & 1));
        const remBot = bot.filter((_, k) => !(cut.botMask >> k & 1));
        const sign = g.neg ? -1 : 1;
        return {
            g, top, bot, cut,
            cutTop: maskCount(cut.topMask),
            cutBot: maskCount(cut.botMask),
            remTopVal: product(remTop) * sign,
            remBotVal: product(remBot),
            value: reduce(product(top) * sign, product(bot))
        };
    });

    const answer = groups.reduce((acc, gi) => addFrac(acc, gi.value), { n: 0, d: 1 });
    const hasNeg = prob.groups.some(g =>
        g.num.some(i => i.e < 0) || g.den.some(i => i.e < 0));
    const cancels = groups.some(gi => gi.cut.p !== 1);
    const factors = groups.reduce((s, gi) => s + gi.top.length + gi.bot.length, 0);

    return { groups, answer, hasNeg, cancels, factors };
}




function createNegDrill(root, opts) {
    opts = opts || {};
    const PFX = 'nx-';

    const MARKUP = `
        <div class="qwrap">
            <div class="card">
                <div class="problem-header">
                    <span class="head-left"><span id="${PFX}problem-title">Problem 1</span></span>
                    <span class="hint" id="${PFX}hint-text"></span>
                </div>

                <div class="chain" id="${PFX}chain">
                    <span class="step" id="${PFX}step-orig" data-expr></span>
                    <span class="eq off" id="${PFX}eq-1">=</span>
                    <span class="step off" id="${PFX}step-flip"></span>
                    <span class="eq off" id="${PFX}eq-2">=</span>
                    <span class="step off" id="${PFX}step-expand"></span>
                    <span class="eq off" id="${PFX}eq-3">=</span>
                    <span class="step off" id="${PFX}step-left"></span>
                    <span class="eq off" id="${PFX}eq-4">=</span>
                    <span class="step off" id="${PFX}step-ans"></span>
                    <span class="eq off" id="${PFX}eq-5">=</span>
                    <span class="step off" id="${PFX}step-mixed"></span>
                </div>

                <div class="feedback" id="${PFX}feedback"></div>

                <div class="action-container">
                    <button class="act-btn off" id="${PFX}act-btn"></button>
                    <button class="check-btn off" id="${PFX}check-btn">Check</button>
                    <button class="next-btn off" id="${PFX}next-btn">Next problem</button>
                </div>
            </div>
        </div>`;

    root.innerHTML = MARKUP;

    let localCount = 0;
    function nextNumber() { return opts.number ? opts.number() : ++localCount; }
    function isVisible() { return !root.classList.contains('hidden'); }
    function advance() { if (opts.onNext) opts.onNext(); else loadProblem(); }

/* ============================================================
   State
   ============================================================ */
let P = null;          // the current problem
let A = null;          // its analysis
let recent = [];       // the last problems served, so numbers do not come back soon
let lastFam = -1;
let phase = 'flip';    // flip -> expand -> cancel -> locked -> answer -> done
let drag = null;
let timers = [];

const $ = id => root.querySelector('#' + PFX + id);
const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };

/* ============================================================
   Markup helpers
   ============================================================ */
const frac = (n, d) => `<span class="frac"><span class="num">${n}</span><span class="denom">${d}</span></span>`;

// the same thing over a faint bar and a faint 1; starts collapsed so it can grow in
const overOne = n =>
    `<span class="frac scaffold dissolved"><span class="num">${n}</span><span class="denom">1</span></span>`;
const baseHtml = b => b < 0 ? `(&minus;${-b})` : `${b}`;
const valHtml  = v => v < 0 ? `(&minus;${-v})` : `${v}`;

function supHtml(e) {
    if (e === 1) return '';
    return e < 0
        ? `<sup><span class="t2">&minus;${-e}</span></sup>`
        : `<sup>${e}</sup>`;
}

// a power, plain
const powHtml = it => `${baseHtml(it.b)}${supHtml(it.e)}`;

// a fraction raised to a power, plain
const fracPowHtml = it =>
    `<span class="grp"><span class="paren">(</span>${frac(baseHtml(it.n), baseHtml(it.d))}<span class="paren">)</span>${supHtml(it.e)}</span>`;

const itemHtml = it => it.k === 'p' ? powHtml(it) : fracPowHtml(it);

/* ---------- the starting form, with the movable pieces marked ---------- */
function srcHtml(id, target, kind, inner, label) {
    return `<span class="term src" id="${PFX}${id}" data-target="${target}" data-kind="${kind}"
                  tabindex="0" role="button" aria-label="${label}">${inner}</span>`;
}

function startItemHtml(it, gi, side, ii, live) {
    const stem = `${gi}-${side}-${ii}`;
    if (it.k === 'p') {
        if (!live || it.e >= 0) return powHtml(it);
        const target = `slot-${stem}`;
        const inner = `<span class="t1">${baseHtml(it.b)}</span><sup class="t2">&minus;${-it.e}</sup>`;
        return srcHtml(`s-${stem}`, target, 'pow', inner,
            `${it.b} to the negative ${-it.e}. Press Enter to move it across the bar.`);
    }
    if (!live || it.e >= 0) return fracPowHtml(it);
    const topSrc = srcHtml(`s-${stem}-n`, `slot-${stem}-d`, 'fbase',
        `<span class="t1">${baseHtml(it.n)}</span>`,
        `${it.n}, the top of the fraction. Press Enter to send it to the bottom.`);
    const botSrc = srcHtml(`s-${stem}-d`, `slot-${stem}-n`, 'fbase',
        `<span class="t1">${baseHtml(it.d)}</span>`,
        `${it.d}, the bottom of the fraction. Press Enter to send it to the top.`);
    return `<span class="grp"><span class="paren">(</span>${frac(topSrc, botSrc)}<span class="paren">)</span>`
         + `<sup class="t2">&minus;${-it.e}</sup></span>`;
}

function zoneHtml(items, gi, side, live) {
    if (!items.length) return '';
    return items.map((it, ii) => startItemHtml(it, gi, side, ii, live))
                .join('<span class="mul">&middot;</span>');
}

function startHtml(live) {
    return P.groups.map((g, gi) => {
        let h = g.op ? `<span class="op">${g.op}</span>` : '';
        h += '<span class="grp">';
        if (g.neg) h += '<span class="neg">&minus;</span>';
        const n = zoneHtml(g.num, gi, 'num', live);
        const d = zoneHtml(g.den, gi, 'den', live);
        // a power that has to fall through the bar needs a bar to fall through,
        // so give it one: the expression written over a faint 1
        const sinks = live && !g.den.length && g.num.some(it => it.k === 'p' && it.e < 0);
        if (g.den.length) h += frac(n || '1', d);
        else if (sinks)   h += overOne(n);
        else              h += n;
        h += '</span>';
        return h;
    }).join('');
}

/* ---------- the rewritten form, with empty slots to drop into ---------- */
function targetItemHtml(entry, gi) {
    if (!entry.src) return itemHtml(entry.post);
    const stem = `${gi}-${entry.src.from}-${entry.src.ii}`;
    if (entry.src.kind === 'pow') {
        return `<span class="drop-slot" id="${PFX}slot-${stem}" data-stem="${stem}">?</span>`;
    }
    const e = entry.post.e;
    return `<span class="grp" id="${PFX}blk-${stem}"><span class="paren">(</span>`
        + frac(`<span class="drop-slot" id="${PFX}slot-${stem}-n" data-blk="${stem}">?</span>`,
               `<span class="drop-slot" id="${PFX}slot-${stem}-d" data-blk="${stem}">?</span>`)
        + `<span class="paren">)</span>`
        + `<sup><span class="exp-sign t2" id="${PFX}sgn-${stem}">&minus;</span>`
        + `<span class="exp-num t2" id="${PFX}exn-${stem}">${e}</span></sup></span>`;
}

function targetZoneHtml(entries, gi) {
    if (!entries.length) return '';
    return entries.map(en => targetItemHtml(en, gi)).join('<span class="mul">&middot;</span>');
}

function flipHtml() {
    return P.groups.map((g, gi) => {
        const pl = plan(g);
        let h = g.op ? `<span class="op">${g.op}</span>` : '';
        h += '<span class="grp">';
        if (g.neg) h += '<span class="neg">&minus;</span>';
        const n = targetZoneHtml(pl.num, gi), d = targetZoneHtml(pl.den, gi);
        // a power that crossed the bar upwards needs a bar to have crossed,
        // even when the bottom comes out empty — so draw a faint one over a faint 1
        const rose = pl.num.some(en => en.src && en.src.kind === 'pow');
        if (d) h += frac(n || '1', d);
        else if (rose) h += `<span class="frac scaffold"><span class="num">${n}</span>`
                          + `<span class="denom">1</span></span>`;
        else h += n;
        h += '</span>';
        return h;
    }).join('');
}

/* ---------- the expanded form, one clickable factor at a time ---------- */
function factorRow(gi, side, list) {
    if (!list.length) return '1';
    let html = '';
    list.forEach((f, k) => {
        if (k > 0) html += `<span class="dot" data-g="${gi}" data-side="${side}" data-k="${k - 1}">&middot;</span>`;
        html += `<span class="fact" data-g="${gi}" data-side="${side}" data-k="${k}">${valHtml(f.v)}</span>`;
    });
    return html;
}

function expandHtml() {
    return A.groups.map((gi_, gi) => {
        let h = gi_.g.op ? `<span class="op">${gi_.g.op}</span>` : '';
        h += '<span class="grp">';
        if (gi_.g.neg) h += '<span class="neg">&minus;</span>';
        h += gi_.bot.length
            ? frac(factorRow(gi, 'num', gi_.top), factorRow(gi, 'den', gi_.bot))
            : factorRow(gi, 'num', gi_.top);
        h += '</span>';
        return h;
    }).join('');
}

function leftHtml() {
    return A.groups.map(gi_ => {
        let h = gi_.g.op ? `<span class="op">${gi_.g.op}</span>` : '';
        const neg = gi_.remTopVal < 0;
        const top = Math.abs(gi_.remTopVal);
        h += '<span class="grp">';
        if (neg) h += '<span class="neg">&minus;</span>';
        h += gi_.remBotVal === 1 ? `${top}` : frac(top, gi_.remBotVal);
        h += '</span>';
        return h;
    }).join('');
}

function answerHtml() {
    const { n, d } = A.answer;
    const body = d === 1
        ? `<span class="final">${Math.abs(n)}</span>`
        : frac(`<span class="final">${Math.abs(n)}</span>`, `<span class="final">${d}</span>`);
    return (n < 0 ? '<span class="neg final">&minus;</span>' : '') + body;
}

/* ============================================================
   Loading a problem
   ============================================================ */
function sizeClass(step, count) {
    step.classList.remove('tight', 'snug');
    if (count > 11) step.classList.add('tight');
    else if (count > 7) step.classList.add('snug');
}

function loadProblem() {
    timers.forEach(clearTimeout);
    timers = [];
    let key, tries = 0;
    const fam = nextFam(lastFam);
    do { P = makeProblem(fam); key = JSON.stringify(P.groups); }
    while (recent.includes(key) && ++tries < 200);
    recent.push(key);
    if (recent.length > 40) recent.shift();
    lastFam = P.fam;
    A = analyse(P);

    $('problem-title').textContent = nextNumber();

    ['eq-1', 'step-flip', 'eq-2', 'step-expand',
     'eq-3', 'step-left', 'eq-4', 'step-ans', 'eq-5', 'step-mixed'].forEach(id => $(id).classList.add('off'));
    ['step-flip', 'step-expand', 'step-left', 'step-ans', 'step-mixed']
        .forEach(id => { $(id).innerHTML = ''; $(id).classList.remove('tight', 'snug'); });

    say('', '');
    setHint('');
    $('act-btn').classList.add('off');
    $('check-btn').classList.add('off');
    $('next-btn').classList.add('off');

    $('step-orig').innerHTML = startHtml(true);
    riseOntoBar($('step-orig'));
}

// The starting form is drawn flat, exactly as the handout prints it. If it is
// really a whole number, let it settle onto a faint bar over a faint 1 first,
// so the student sees where the negative power is about to fall to.
function riseOntoBar(root) {
    const bars = [...root.querySelectorAll('.frac.scaffold.dissolved')];
    if (!bars.length) { beginAfterStart(); return; }
    phase = 'wait';
    setHint('Any expression can be written over 1.');
    later(() => bars.forEach(f => f.classList.remove('dissolved')), 550);
    later(beginAfterStart, 1650);
}

// once the starting form is on screen, either drag the negatives across or,
// if there are none, go straight to writing the powers out
function beginAfterStart() {
    if (A.hasNeg) {
        phase = 'flip';
        $('eq-1').classList.remove('off');
        const step = $('step-flip');
        step.innerHTML = flipHtml();
        step.classList.remove('off');
        setHint('Move every negative exponent so it turns positive.');
        wireSources();
    } else {
        phase = 'expand';
        setHint('Nothing here is negative — this one just gets written out.');
        say('No negative exponents in this one.', 'correct');
        later(doExpand, 1600);
    }
}

function srcRoot() {
    return $('step-orig');
}

function wireSources() {
    srcRoot().querySelectorAll('.term.src').forEach(t => {
        t.addEventListener('pointerdown', onPointerDown);
        t.addEventListener('keydown', onTermKey);
    });
}

function setHint(text, lit) {
    const h = $('hint-text');
    h.textContent = text;
    h.classList.toggle('lit', !!lit);
}
function say(msg, cls) { const f = $('feedback'); f.textContent = msg; f.className = `feedback ${cls}`; }

/* ============================================================
   Step 1 — moving the negatives
   ============================================================ */
const allSlots = () => [...$('step-flip').querySelectorAll('.drop-slot')];
const liveSources = () => [...srcRoot().querySelectorAll('.term.src')].filter(t => t.dataset.used !== '1');

function hitSlot(x, y) {
    return allSlots().find(s => {
        if (s.classList.contains('filled')) return false;
        const r = s.getBoundingClientRect();
        return x >= r.left - 24 && x <= r.right + 24 && y >= r.top - 24 && y <= r.bottom + 24;
    }) || null;
}

function onPointerDown(e) {
    const src = e.currentTarget;
    if (phase !== 'flip' || src.dataset.used === '1') return;
    e.preventDefault();
    src.focus({ preventScroll: true });
    if ($('feedback').classList.contains('nudge')) say('', '');

    const rect = src.getBoundingClientRect();
    const ghost = src.cloneNode(true);
    ghost.removeAttribute('id');
    ghost.classList.add('ghost');
    ghost.style.left = rect.left + 'px';
    ghost.style.top = rect.top + 'px';
    ghost.style.width = rect.width + 'px';
    root.appendChild(ghost);

    drag = { src, ghost, dx: e.clientX - rect.left, dy: e.clientY - rect.top, moved: false };
    allSlots().forEach(s => { if (!s.classList.contains('filled')) s.classList.add('armed'); });

    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);
}

function onPointerMove(e) {
    if (!drag) return;
    drag.moved = true;
    drag.ghost.style.left = (e.clientX - drag.dx) + 'px';
    drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
    const over = hitSlot(e.clientX, e.clientY);
    allSlots().forEach(s => s.classList.toggle('eligible', s === over));
}

function onPointerUp(e) {
    if (!drag) return;
    const { src, ghost, moved } = drag;
    const rect = ghost.getBoundingClientRect();
    const over = hitSlot(e.clientX, e.clientY);

    window.removeEventListener('pointermove', onPointerMove);
    window.removeEventListener('pointerup', onPointerUp);
    window.removeEventListener('pointercancel', onPointerUp);
    allSlots().forEach(s => s.classList.remove('armed', 'eligible'));
    ghost.remove();
    drag = null;

    if (!moved || !over) return;

    if (over.id === PFX + src.dataset.target) placeTerm(src, rect);
    else bump(src, src.dataset.kind === 'fbase'
        ? 'The top and the bottom trade places — try the other spot.'
        : 'Not that spot. A negative exponent crosses the bar to the other side.');
}

function bump(el, msg) {
    flubbed = true;
    el.classList.add('shake');
    later(() => el.classList.remove('shake'), 400);
    say(msg, 'nudge');
}

function onTermKey(e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    const src = e.currentTarget;
    if (phase !== 'flip' || src.dataset.used === '1') return;
    placeTerm(src, src.getBoundingClientRect());
}

function slideFrom(el, fromRect, ms) {
    const now = el.getBoundingClientRect();
    const dx = fromRect.left - now.left, dy = fromRect.top - now.top;
    if (!dx && !dy) return;
    el.style.transition = 'none';
    el.style.transform = `translate(${dx}px, ${dy}px)`;
    requestAnimationFrame(() => {
        el.style.transition = `transform ${ms}ms cubic-bezier(0.35, 0, 0.2, 1)`;
        el.style.transform = 'translate(0, 0)';
    });
}

function placeTerm(src, fromRect) {
    const slot = $(src.dataset.target);
    const isPow = src.dataset.kind === 'pow';
    slot.innerHTML = `<span class="term landed">${src.innerHTML}</span>`;
    slot.classList.add('filled');

    const landed = slot.querySelector('.term');
    if (fromRect) slideFrom(landed, fromRect, 380);

    src.dataset.used = '1';
    src.classList.add('used');
    src.removeAttribute('tabindex');

    // the payoff: the exponent turns positive once the move is made
    if (isPow) {
        const sup = landed.querySelector('sup');
        sup.innerHTML = `<span class="exp-sign t2">&minus;</span>`
                      + `<span class="exp-num t2">${sup.textContent.replace(/\u2212|-/g, '').trim()}</span>`;
        later(() => flipSign(sup.querySelector('.exp-sign'), sup.querySelector('.exp-num')), 400);
    } else {
        const stem = slot.dataset.blk;
        const pair = [...$('step-flip').querySelectorAll(`.drop-slot[data-blk="${stem}"]`)];
        if (pair.every(s => s.classList.contains('filled'))) {
            later(() => flipSign($(`sgn-${stem}`), $(`exn-${stem}`)), 400);
        }
    }

    const left = liveSources();
    if (left.length) {
        say(src.dataset.kind === 'fbase'
            ? 'Good — that piece crossed the bar.'
            : 'Good — it crossed the bar and the exponent went positive.', 'correct');
    } else {
        later(() => {
            say('Every negative exponent is gone.', 'correct');
            phase = 'expand';
            setHint('Now write each power out as repeated multiplication.');
        }, 800);
        // the scaffold has done its job once the move is made
        later(dissolveScaffolds, 1300);
        later(doExpand, 2800);
    }
}

function dissolveScaffolds() {
    $('step-flip').querySelectorAll('.frac.scaffold').forEach(f => f.classList.add('dissolved'));
}

function flipSign(sign, num) {
    if (!sign || !num) return;
    sign.classList.add('gone');
    sign.setAttribute('aria-hidden', 'true');
    num.classList.remove('t2');
    num.classList.add('flipped');
}

/* ============================================================
   Step 2 — expand into repeated multiplication
   ============================================================ */
function doExpand() {
    if (phase !== 'expand') return;      // the auto-advance and "Show me" must not both fire
    $('eq-2').classList.remove('off');
    const step = $('step-expand');
    step.innerHTML = expandHtml();
    sizeClass(step, A.factors);
    step.classList.remove('off');
    step.classList.add('pop');
    later(() => step.classList.remove('pop'), 400);

    $('act-btn').classList.add('off');

    const zeroPower = P.groups.some(g => g.num.concat(g.den).some(i => i.k === 'p' && i.e === 0));
    if (A.cancels) armCancel(zeroPower);
    else {
        say(zeroPower ? 'Remember: anything to the zero power is just 1.'
                      : 'Nothing cancels here — go straight to the value.', 'correct');
        openAnswer();
    }
}

/* ============================================================
   Step 3 — the student clicks whatever cancels
   ============================================================ */
const facts = (gi, side) =>
    [...$('step-expand').querySelectorAll(`.fact[data-g="${gi}"][data-side="${side}"]`)];
function struckVals(gi, side) {
    const list = side === 'num' ? A.groups[gi].top : A.groups[gi].bot;
    return facts(gi, side).map((f, k) => f.classList.contains('struck') ? list[k].v : null)
                          .filter(v => v !== null);
}
const prodOf = vals => vals.reduce((p, v) => p * v, 1);

function armCancel(zeroPower) {
    phase = 'cancel';
    say(zeroPower ? 'The zero power became 1. Now look for factors that match.'
                  : 'Some factors on top and bottom are worth the same thing.', 'correct');
    setHint('Click every factor you can cancel — on the top and on the bottom.');
    $('step-expand').querySelectorAll('.fact').forEach(f => {
        if (A.groups[+f.dataset.g].cut.p === 1) return;   // nothing cancels in that group
        f.classList.add('pickable');
        f.setAttribute('tabindex', '0');
        f.setAttribute('role', 'button');
        f.setAttribute('aria-pressed', 'false');
        f.addEventListener('click', toggleFact);
        f.addEventListener('keydown', onFactKey);
    });
}

function onFactKey(e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    toggleFact({ currentTarget: e.currentTarget });
}

function toggleFact(e) {
    if (phase !== 'cancel') return;
    const f = e.currentTarget;
    const on = f.classList.toggle('struck');
    f.setAttribute('aria-pressed', on ? 'true' : 'false');
    refreshDots(f.dataset.g, f.dataset.side);
    judgeCancel();
}

// a dot is crossed out only when the factors on both sides of it are
function refreshDots(gi, side) {
    const list = facts(gi, side);
    $('step-expand').querySelectorAll(`.dot[data-g="${gi}"][data-side="${side}"]`).forEach(d => {
        const k = +d.dataset.k;
        const both = list[k] && list[k + 1]
            && list[k].classList.contains('struck') && list[k + 1].classList.contains('struck');
        d.classList.toggle('struck', both);
    });
}

function judgeCancel() {
    let anyStruck = false, allDone = true, uneven = null;

    A.groups.forEach((gr, gi) => {
        if (gr.cut.p === 1) return;
        const t = prodOf(struckVals(gi, 'num')), b = prodOf(struckVals(gi, 'den'));
        if (t !== 1 || b !== 1) anyStruck = true;
        if (t !== b) { uneven = t > b ? 'top' : 'bottom'; allDone = false; }
        else if (t !== gr.cut.p) allDone = false;
    });

    if (!anyStruck) { say('', ''); return; }
    if (uneven) { say(`Not even yet — you have crossed out more on the ${uneven}.`, 'nudge'); return; }
    if (allDone) lockCancel();
    else say('Even so far — but there is still more that cancels.', 'nudge');
}

function lockCancel() {
    phase = 'locked';
    $('step-expand').querySelectorAll('.fact').forEach(f => {
        f.classList.remove('pickable');
        f.removeAttribute('tabindex');
        f.removeAttribute('role');
    });

    // if a whole row cancelled away, spell out that what is left there is 1
    let cleared = null;
    A.groups.forEach((gr, gi) => {
        if (gr.cut.p === 1) return;
        if (gr.cutTop === gr.top.length) { later(() => tailOne(gi, 'num'), 350); cleared = 'top'; }
        if (gr.cutBot === gr.bot.length) { later(() => tailOne(gi, 'den'), 350); cleared = 'bottom'; }
    });

    if (cleared) say(`The whole ${cleared} cancelled, so the ${cleared} is 1.`, 'correct');
    else say('That is everything that cancels.', 'correct');

    later(() => {
        if (showLeftStep()) {
            $('eq-3').classList.remove('off');
            const step = $('step-left');
            step.innerHTML = leftHtml();
            step.classList.remove('off');
            step.classList.add('pop');
            later(() => step.classList.remove('pop'), 400);
        }
        openAnswer();
    }, cleared ? 1400 : 750);
}

// only worth a line of its own if it is not just the answer written twice
function showLeftStep() {
    if (!A.cancels) return false;
    if (A.groups.length > 1) return true;
    const g0 = A.groups[0];
    return !(g0.remTopVal === A.answer.n && g0.remBotVal === A.answer.d);
}

function tailOne(gi, side) {
    const sel = side === 'num' ? '.num' : '.denom';
    const grp = $('step-expand').querySelectorAll('.grp')[gi];
    const row = grp && grp.querySelector(sel);
    if (!row || row.querySelector('.tail-one')) return;
    const dot = document.createElement('span');
    dot.className = 'dot tail pop';
    dot.innerHTML = '&middot;';
    const one = document.createElement('span');
    one.className = 'tail-one pop';
    one.textContent = '1';
    row.append(dot, one);
    later(() => { dot.classList.remove('pop'); one.classList.remove('pop'); }, 400);
}

/* ============================================================
   Step 4 — the student types the value
   ============================================================ */
function openAnswer() {
    phase = 'answer';
    $('eq-4').classList.remove('off');
    const step = $('step-ans');
    step.innerHTML = `<input class="ans-input" id="${PFX}ans" type="text" inputmode="numeric"
                             autocomplete="off" spellcheck="false" aria-label="Your answer">`;
    step.classList.remove('off');
    setHint('Type the value — a whole number, or a fraction like 1/5.');
    $('check-btn').classList.remove('off');

    const input = $('ans');
    input.addEventListener('input', () => {
        input.classList.remove('wrong');
        if ($('feedback').classList.contains('nudge')) say('', '');
        const got = parseAnswer(input.value);
        if (got && isRight(got)) finish();      // a right answer accepts itself
    });
    input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); checkAnswer(); }
    });
    later(() => input.focus(), 250);
}

function parseAnswer(raw) {
    const s = raw.trim().replace(/\s+/g, '').replace(/\u2212/g, '-');
    if (!s) return null;
    if (/^-?\d+$/.test(s)) return { n: +s, d: 1 };
    const f = s.match(/^(-?\d+)\/(-?\d+)$/);
    if (f && +f[2] !== 0) return { n: +f[1], d: +f[2] };

function isRight(got) {
    return got.dec !== undefined
        ? Math.abs(got.dec - A.answer.n / A.answer.d) < 1e-9

function checkAnswer() {
    if (phase !== 'answer') return;
    const input = $('ans');
    const got = parseAnswer(input.value);

    if (!got) {
        input.classList.add('wrong');
        say('Type a number, or a fraction like 1/5.', 'nudge');
        return;
    }
    if (isRight(got)) { finish(); return; }

    flubbed = true;
    input.classList.add('wrong');
    input.select();
    if (A.groups.length === 1) {
        const g0 = A.groups[0];
        $('feedback').innerHTML = `Not yet — work out ${valHtml(g0.remTopVal)} &divide; ${g0.remBotVal}.`;
    } else {
        $('feedback').textContent = 'Not yet — work out each piece, then add them.';
    }
    $('feedback').className = 'feedback nudge';

function finish() {
    $('step-ans').innerHTML = answerHtml();
    $('check-btn').classList.add('off');

    if (needsMixed()) {
        say('Correct!', 'correct');
        phase = 'wait';
        later(() => openMixed(), 700);
        return;
    }
    setHint('');
    const chain = divisionChain(P);
    const recip = reciprocalChain();
    if (recip) {
        const f = $('feedback');
        f.innerHTML = `<div>Correct!</div>${recip}`;
        f.className = 'feedback correct';
    } else if (chain) {
        const f = $('feedback');
        f.innerHTML = `<div>Correct!</div><div class="divnote">This kind of problem is repeated division:`
            + `<span class="divchain">${chain} = ${answerPlain()}</span></div>`;
        f.className = 'feedback correct';

        say('Correct!', 'correct');

/* 1 over a power with a negative exponent — like 1/6^-3 — written out the long way:
   1/6^-3 = 1/(1/6^3) = 1 ÷ 1/6^3 = 1/1 × 6^3/1 = 6^3 = 6 · 6 · 6 = 216.
   Returns that as two lines of markup, or null for any other shape. */
function reciprocalChain() {
    if (P.groups.length !== 1) return null;
    const g = P.groups[0];
    if (g.neg || g.num.length || g.den.length !== 1) return null;
    const it = g.den[0];
    if (it.k !== 'p' || it.e >= 0) return null;

    const b = baseHtml(it.b), n = -it.e;
    const negPow = `<span>${b}<sup>&minus;${n}</sup></span>`;
    const posPow = n === 1 ? b : `<span>${b}<sup>${n}</sup></span>`;
    const eq = '<span class="op">=</span>';
    const steps = [
        frac(1, negPow),
        frac(1, frac(1, posPow)),
        `1 <span class="op">&divide;</span> ${frac(1, posPow)}`,
        `${frac(1, 1)} <span class="op">&times;</span> ${frac(posPow, 1)}`,
        posPow

    if (n > 1) steps.push(Array(n).fill(valHtml(it.b)).join(' &middot; '));
    steps.push(answerPlain());

    // each step keeps its own = sign, so a narrow screen breaks between steps, never inside one
    const pieces = steps.map((h, k) =>
        `<span class="piece">${k ? '<span class="op">=</span>' : ''}${h}</span>`).join('');

    const { n, d } = A.answer;
    const body = d === 1 ? `${Math.abs(n)}` : frac(Math.abs(n), d);
    return (n < 0 ? '&minus;' : '') + body;
}

function endProblem() {
    phase = 'done';
    const n = $('next-btn');
    n.textContent = 'Next problem';
    n.classList.remove('off');
    if (isVisible()) n.focus();

/* ============================================================
   Reading a problem back as plain text
   ------------------------------------------------------------
   The drill draws its mathematics with markup, so the shell's
   work log asks for this instead of scraping the screen.
   ============================================================ */
const SUP = { '0': '\u2070', '1': '\u00b9', '2': '\u00b2', '3': '\u00b3', '4': '\u2074',
              '5': '\u2075', '6': '\u2076', '7': '\u2077', '8': '\u2078', '9': '\u2079', '-': '\u207b' };

    ? `${numText(it.b)}${supText(it.e)}`

function problemText(prob) {
    return prob.groups.map(g => {
        const n = g.num.map(itemText).join(' \u00b7 ');
        const d = g.den.map(itemText).join(' \u00b7 ');
        return (g.neg ? '\u2212' : '') + (d ? `${n || '1'} / ${d}` : n);

    const { n, d } = A.answer;
    const sign = n < 0 ? '\u2212' : '';
    if (d === 1) return `${sign}${Math.abs(n)}`;
    let t = `${sign}${Math.abs(n)}/${d}`;
    if (needsMixed()) { const m = mixedParts(); t += ` = ${sign}${m.w} ${m.r}/${m.d}`; }
    return t;
}

/* ============================================================
   Step 5 — an improper answer gets written as a mixed number
   ------------------------------------------------------------
   Only worth doing when there is a whole part to pull out, so a
   proper fraction like 1/5 and a whole number like 64 both skip it.
   The answer is already reduced, so the remainder is never 0.
   ============================================================ */
function needsMixed() {
    const { n, d } = A.answer;
    return d !== 1 && Math.abs(n) > d;
}

function mixedParts() {
    const { n, d } = A.answer;
    const a = Math.abs(n);
    return { neg: n < 0, w: Math.floor(a / d), r: a % d, d, a };
}

function mixedHtml() {
    const m = mixedParts();
    return (m.neg ? '<span class="neg final">&minus;</span>' : '')
        + `<span class="mixed"><span class="whole final">${m.w}</span>`
        + frac(`<span class="final">${m.r}</span>`, `<span class="final">${m.d}</span>`)
        + '</span>';

// the student found the fraction; the drill writes it as a mixed number for them
function openMixed() {
    const m = mixedParts();
    const sign = m.neg ? '&minus;' : '';
    $('eq-5').classList.remove('off');
    const step = $('step-mixed');
    step.innerHTML = mixedHtml();
    step.classList.remove('off');
    step.classList.add('pop');
    later(() => step.classList.remove('pop'), 400);
    setHint('');
    $('feedback').innerHTML = '<div>Correct!</div>'
        + `<div class="divnote">${m.a} &divide; ${m.d} is ${m.w} with ${m.r} left over, so ${sign}${m.a}/${m.d} is ${sign}${m.w} and ${m.r}/${m.d}.</div>`;
    $('feedback').className = 'feedback correct';
    endProblem();
}

/* ============================================================
   Wiring
   ============================================================ */
$('act-btn').addEventListener('click', () => {
    if (phase === 'expand') doExpand();
});
$('check-btn').addEventListener('click', () => {
    checkAnswer();
});
$('next-btn').addEventListener('click', advance);

document.addEventListener('keydown', e => {
    const tag = e.target && e.target.tagName;
    if (tag === 'BUTTON' || tag === 'INPUT' || !isVisible()) return;
    if (e.key === 'Enter' && phase === 'done') {
        e.preventDefault();
        $('next-btn').click();
    }
});

    function focusInput() {
        const input = $('ans');
        if (input) { try { input.focus(); } catch (e) {} }
        else if (phase === 'done') { try { $('next-btn').focus(); } catch (e) {} }
    }

    /* the shell writes a work log, and asks each drill to read its own
       problem back as plain text rather than scraping it off the screen */
    function currentText() { return P ? problemText(P) + ' = ' + answerText() : ''; }

    return { loadNewProblem: loadProblem, focusInput: focusInput, problemText: currentText };

return { createNegDrill: createNegDrill };
})();

<script>

        m.tip = 'A whole number is itself over 1';

        const m = mv(n, `Both sides over ${L}.`);
        m.tip = `Same bottom for both: ${L}`;
        m.hold = 1700;
        return B(op, RQ(wa.n * (L / wa.d), L), RQ(wb.n * (L / wb.d), L));
    }

    m.tip = `${W} the tops`;

            if (n.e === 0) {
                const m = mv(n, 'Any nonzero number to the 0 power is 1.');
                /* the box wants 1, so the reminder is the rule that gets you to 1.
                   Naming the power-of-a-power rule here would point at multiplying the
                   exponents, which lands on 0 -- the exponent, not the answer.
                   "nonzero" because 0⁰ is the one case the rule does not cover; the
                   drill never puts a 0 under a zero exponent, but the statement has to
                   be true on its own. */
                m.tip = 'Any nonzero number to the 0 power is 1.';
                return H(Q(1), ask(m, `${T(n)} = ?`, 'anything but 0, to the 0, is 1'));
            }
            if (n.b.t === 'pow') {
                const i = n.b.e, o = n.e;
                const m = mv(n, 'Power of a power: multiply the exponents.');
                m.tip = 'Raise a power to a power? Multiply the powers.';
                m.lightExp = [n.b, n];
                return P(n.b.b, i * o, ask(m, `${numT(i)} × ${parT(o)} = ?`, signNudge(i, o, '×')));
            }
            const L = litVal(n.b);
            if (L === null) {
                if (n.b.t === 'bin' && litVal(n.b.a) !== null && litVal(n.b.b) !== null && !MULS.includes(n.b.op)) {
                    const m = mv(n.b, 'Parentheses first: work out what is inside.');
                    return P(H(Qr(evalNode(n.b)), ask(m, `${T(n.b)} = ?`, T(n.b))), n.e);
                }
                return P(step(n.b), n.e);
            }
            if (n.e === 1) {
                /* Nothing is worked out here -- the exponent just goes.  Asking for the
                   base back is copying, and with a fraction base it is two boxes of
                   copying, so the rewrite is shown instead of asked. */
                const m = mv(n, 'An exponent of 1 leaves the base as it is.');
                m.tip = 'An exponent of 1 leaves the base as it is';
                return Qr(L);
            }
            if (n.e < 0) {
                if (L.d === 1n) {
                    const m = drag(n, n.e === -1
                        ? 'An exponent of −1: move it across the fraction bar and the exponent disappears.'
                        : 'Negative exponent: move the power across the fraction bar and the exponent turns positive.',
                        `Drag ${T(n)} ↓`,
                        '↕ other side of the bar');
                    src(m, n, 'pow', '');
                    return O(Q(1), SL(m, '', n.e === -1 ? Qr(L) : P(Qr(L), -n.e), n.e === -1));
                }
                const m = drag(n, 'Negative exponent on a fraction: the top and the bottom trade places, and the exponent turns positive.',
                    `Drag ${L.n < 0n ? -L.n : L.n} ↓   ${L.d} ↑`,
                    'Top ⇅ bottom');
                src(m, n, 'fracpow', '');
                const flip = R(L.d, L.n);
                return FS(m, '', L, -n.e, -n.e === 1 ? Qr(flip) : P(Qr(flip), -n.e));
            }
            const m = mv(n, 'No negatives left here: work out the power.');
            return H(Qr(rPow(L, n.e)), ask(m, `${T(n)} = ?`, powerNudge(L, n.e)));
        }

        case 'over': {
            const A = litVal(n.a), Bv = litVal(n.b);
            if (A !== null && Bv !== null) {
                const v = rDiv(A, Bv);
                const looksSame = A.d === 1n && Bv.d === 1n && Bv.n > 1n && v.n === A.n && v.d === Bv.n;
                if (looksSame) return Qr(v);
                if (A.d === 1n && Bv.d === 1n) {
                    const tp = A.n < 0n ? -A.n : A.n;
                    if (Bv.n > 1n) {
                        /* the bottom goes into the top exactly.  Nothing is left
                           underneath, so striking the bar out and writing a 1 below it
                           says less than just asking for the division. */
                        if (v.d === 1n) {
                            const m = mv(n, 'The bottom goes into the top exactly: divide.');
                            m.tip = 'Divide';
                            return H(Qr(v), ask(m, `${qT(A)} ÷ ${Bv.n} = ?`, `${Bv.n} × ? = ${qT(A)}`));
                        }
                        /* something is left on both sides of the bar: cut the top and
                           the bottom down on the line itself -- stroke through each
                           number, what is left written above and below */
                        if (A.n !== 0n) {
                            const xs = crossRaw(n, [Number(tp)], [Number(Bv.n)], A.n < 0n, v);
                            if (xs === 'defer') return n;
                            if (xs) return xs;
                        }
                    }
                    const m = mv(n, 'Simplify the fraction.');
                    return H(Qr(v), ask(m, `${T(n)} = ?`, 'Simplify'));
                }
                const m = mv(n, 'A fraction bar means divide.');
                return H(Qr(v), ask(m, `${T(n.a, { right: true })} ÷ ${T(n.b, { right: true })} = ?`, '÷ fraction = × its flip'));
            }
            if (LAWS) {
